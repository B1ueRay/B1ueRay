<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060b" />
<meta name="description" content="Кураж — живые эфиры, где зрители предлагают задания и скидываются в банк, а стримеры решаются их выполнить." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Кураж" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Кураж — эфиры с заданиями</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #07060b; --s1: #111019; --s2: #191723; --s3: #252232; --line: rgba(255,255,255,.09);
    --text: #f5f2ff; --muted: #9b95b3; --lime: #c6ff3d; --pink: #ff3d8b; --cyan: #41e2ff;
    --ok: #3dffa0; --bad: #ff5a6a; --nav: 64px;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea { font: inherit; color: inherit; }
  b { font-weight: 700; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  #app { position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--bg); }
  .screens { position: absolute; inset: 0 0 calc(var(--nav) + var(--sb)) 0; }
  body.is-live .screens { bottom: 0; }
  body.is-live .tabbar { display: none; }
  .screen { position: absolute; inset: 0; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen.on { display: block; }
  #scr-feed { overflow: hidden; }
  .page { padding: calc(var(--st) + 18px) 16px 28px; }
  h1 { font-size: 28px; font-weight: 850; letter-spacing: -.02em; }
  h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  h3 { font-size: 15px; font-weight: 700; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }

  /* ── buttons & chips ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 18px;
    border-radius: 14px; background: var(--s3); font-weight: 700; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.97); }
  .btn.lime { background: var(--lime); color: #0c0f02; }
  .btn.pink { background: var(--pink); color: #fff; }
  .btn.bad { background: rgba(255,90,106,.16); color: var(--bad); }
  .btn.ghost { background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .btn.sm { height: 34px; padding: 0 12px; border-radius: 11px; font-size: 13px; }
  .btn.block { width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; }
  .chip.on { background: var(--lime); color: #0c0f02; border-color: var(--lime); }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px;
    background: rgba(8,7,14,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px;
    background: var(--pink); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
  .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .ava { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; font-weight: 800;
    color: #0b0a10; font-size: 16px; }
  .spark { color: var(--lime); }

  /* ── tab bar ── */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--nav) + var(--sb)); padding-bottom: var(--sb);
    display: flex; background: rgba(9,8,14,.94); border-top: 1px solid var(--line); z-index: 20; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--text); }
  .tab.on svg { color: var(--lime); }
  .tab-go { flex: 1; display: grid; place-items: center; }
  .tab-go span { display: grid; place-items: center; width: 52px; height: 38px; border-radius: 13px;
    background: linear-gradient(135deg, var(--lime), #7dff6b); color: #0b0f02; box-shadow: 0 0 24px rgba(198,255,61,.35); }
  .tab-go span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 3px #0b0f02; }

  /* ── feed ── */
  .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .card { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; }
  .card canvas, .live-view canvas, .live-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 48%, rgba(0,0,0,.78) 100%); }
  .c-top { position: absolute; top: calc(var(--st) + 12px); left: 12px; right: 110px; display: flex; gap: 10px; align-items: center; }
  .c-top .who { flex: 1; min-width: 0; }
  .c-top .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-top .who small { display: flex; gap: 6px; align-items: center; color: rgba(255,255,255,.78); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; }
  .follow { flex: none; height: 28px; padding: 0 10px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 12px; font-weight: 700; }
  .follow.on { background: rgba(255,255,255,.14); }
  .balance { position: absolute; top: calc(var(--st) + 14px); right: 12px; z-index: 5; height: 34px; font-size: 14px; }
  .balance b { color: var(--lime); }
  .banner { position: absolute; top: calc(var(--st) + 66px); left: 12px; right: 12px; }
  .bn { background: rgba(10,9,16,.62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line);
    border-radius: 16px; padding: 10px 12px; display: grid; gap: 8px; animation: pop .25s ease; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  .bn-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .bn-text { font-size: 16px; font-weight: 700; line-height: 1.25; }
  .bn.idle .bn-text { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tag.hot { color: var(--pink); }
  .tag.cyan { color: var(--cyan); }
  .timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; }
  .timer.low { color: var(--bad); }
  .bar { height: 5px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--lime)); transition: width 1s linear; }
  .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vbtn { position: relative; height: 48px; border-radius: 13px; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-weight: 800; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
  .vbtn i { position: absolute; left: 0; top: 0; bottom: 0; z-index: 0; transition: width .6s; }
  .vbtn span, .vbtn b { position: relative; z-index: 1; }
  .vbtn.yes i { background: rgba(61,255,160,.25); }
  .vbtn.no i { background: rgba(255,90,106,.25); }
  .vbtn.sel { border-color: var(--text); }
  .vbtn:disabled { opacity: 1; }
  .bn.result { text-align: center; padding: 14px; }
  .bn.result .big { font-size: 20px; font-weight: 850; }
  .bn.result.ok { border-color: rgba(61,255,160,.5); }
  .bn.result.bad { border-color: rgba(255,90,106,.5); }
  .rail { position: absolute; right: 8px; bottom: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .rbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; }
  .rbtn > span { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(8,7,14,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 21px; }
  .rbtn.main > span { background: var(--lime); color: #0b0f02; }
  .rbtn .cnt { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    background: var(--pink); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .c-bottom { position: absolute; left: 12px; right: 70px; bottom: 14px; }
  .c-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .chat { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 132px; overflow: hidden; margin-bottom: 8px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%); mask-image: linear-gradient(180deg, transparent, #000 40%); }
  .msg { font-size: 13px; line-height: 1.3; text-shadow: 0 1px 4px rgba(0,0,0,.7); animation: rise .25s ease; overflow-wrap: anywhere; }
  .msg b { margin-right: 5px; }
  .msg.sys { align-self: flex-start; background: rgba(198,255,61,.14); border: 1px solid rgba(198,255,61,.25); padding: 4px 8px; border-radius: 9px; text-shadow: none; }
  .msg.me b { color: var(--lime) !important; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } }
  .say { display: flex; gap: 6px; }
  .say input { flex: 1; min-width: 0; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(8,7,14,.55);
    padding: 0 12px; outline: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 16px; }
  .say button { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 16px; }
  .heart { position: absolute; right: 22px; bottom: 210px; font-size: 26px; pointer-events: none; animation: fly 1.4s ease-out forwards; }
  @media (max-width: 400px) { .follow .fl { display: none; } .follow { width: 30px; padding: 0; } .c-top { right: 96px; } }
  @media (max-height: 700px) {
    .rail { gap: 8px; }
    .rbtn { font-size: 0; }
    .rbtn b { font-size: 11px; }
    .rbtn > span { width: 40px; height: 40px; font-size: 18px; }
    .chat { height: 96px; }
    .bn { padding: 8px 10px; gap: 6px; }
    .bn-text { font-size: 15px; }
  }
  @keyframes fly { to { transform: translate(var(--dx), -220px) scale(1.4); opacity: 0; } }

  /* ── lists ── */
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--s1); margin: 16px 0; }
  .seg button { flex: 1; height: 38px; border-radius: 11px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--s3); color: var(--text); }
  .list { display: grid; gap: 10px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line); text-align: left; width: 100%; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; line-height: 1.25; }
  .row .m { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .amt { flex: none; text-align: right; font-weight: 800; }
  .st { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 800; }
  .st.q { background: rgba(255,255,255,.08); color: var(--muted); }
  .st.go { background: rgba(255,61,139,.18); color: var(--pink); }
  .st.vote { background: rgba(65,226,255,.16); color: var(--cyan); }
  .st.ok { background: rgba(61,255,160,.15); color: var(--ok); }
  .st.back { background: rgba(255,255,255,.08); color: #d8d3ea; }
  .st.mine { background: rgba(198,255,61,.16); color: var(--lime); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty div { font-size: 42px; margin-bottom: 8px; }

  /* ── wallet / profile ── */
  .wcard { margin-top: 16px; padding: 20px; border-radius: 22px; position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, rgba(255,61,139,.35), transparent 55%), radial-gradient(120% 120% at 0% 100%, rgba(198,255,61,.22), transparent 55%), var(--s2);
    border: 1px solid var(--line); }
  .wcard .num { font-size: 42px; font-weight: 900; letter-spacing: -.03em; margin: 4px 0 14px; }
  .wcard .num small { font-size: 22px; color: var(--lime); }
  .wbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(65,226,255,.08); border: 1px solid rgba(65,226,255,.2); font-size: 12.5px; color: #bfefff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 14px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 22px; font-weight: 850; }
  .stat span { font-size: 12px; color: var(--muted); }
  .me-head { display: flex; gap: 14px; align-items: center; margin-top: 16px; }
  .me-head .ava { width: 64px; height: 64px; font-size: 26px; }
  .lvl { margin-top: 14px; }
  .lvl .bar { height: 8px; margin-top: 6px; }
  .menu { display: grid; border-radius: 16px; overflow: hidden; background: var(--s1); border: 1px solid var(--line); }
  .menu > * { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 14px; text-align: left; border-bottom: 1px solid var(--line); width: 100%; }
  .menu > *:last-child { border-bottom: 0; }
  .switch { position: relative; width: 46px; height: 28px; border-radius: 99px; background: var(--s3); transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.on { background: var(--lime); }
  .switch.on::after { transform: translateX(18px); background: #0b0f02; }

  /* ── go live ── */
  .preview { position: relative; height: 200px; border-radius: 20px; overflow: hidden; background: var(--s1); border: 1px solid var(--line); margin-top: 16px; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview .pill { position: absolute; left: 12px; bottom: 12px; }
  .field { display: block; margin-top: 16px; }
  .field > span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .inp { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--s1); padding: 0 14px; outline: none; font-size: 16px; }
  textarea.inp { height: 84px; padding: 12px 14px; resize: none; line-height: 1.35; }
  .inp:focus { border-color: rgba(198,255,61,.6); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 14px; text-align: left; }
  .check i { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; font-style: normal; font-size: 13px; color: #0b0f02; margin-top: 1px; }
  .check.on i { background: var(--lime); border-color: var(--lime); }
  .check.on i::before { content: "✓"; font-weight: 900; }
  .live-view { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .live-view video { transform: scaleX(-1); }
  .live-view video.rear { transform: none; }
  .lv-top { position: absolute; top: calc(var(--st) + 12px); left: 12px; right: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .lv-top .sp { flex: 1; }
  .lv-top .iconb { width: 34px; height: 34px; border-radius: 50%; background: rgba(8,7,14,.55); font-size: 17px; }
  .lv-shield { position: absolute; top: calc(var(--st) + 54px); left: 12px; }
  .lv-active { position: absolute; top: calc(var(--st) + 92px); left: 12px; right: 12px; }
  .lv-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(var(--sb) + 14px); display: grid; gap: 10px; }
  .lv-bottom .chat { height: 110px; margin: 0; width: 78%; }
  .inc { display: grid; gap: 8px; }
  .icard { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 15px; background: rgba(10,9,16,.7);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); animation: rise .25s ease; }
  .icard .grow { flex: 1; min-width: 0; }
  .icard .t { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .icard .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .icard .acts { display: flex; gap: 6px; }
  .icard .acts button { width: 40px; height: 40px; border-radius: 12px; font-size: 17px; font-weight: 800; }
  .icard .yes { background: var(--lime); color: #0b0f02; }
  .icard .no { background: rgba(255,255,255,.1); }
  .lv-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── sheet ── */
  .sheet-wrap { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .25s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column; background: var(--s1);
    border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sheet-wrap.open { pointer-events: auto; }
  .sheet-wrap.open .sheet-bg { opacity: 1; }
  .sheet-wrap.open .sheet { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--s3); margin: 10px auto 2px; flex: none; }
  .sheet-body { overflow-y: auto; padding: 8px 16px calc(var(--sb) + 20px); -webkit-overflow-scrolling: touch; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 4px; }
  .x { width: 34px; height: 34px; border-radius: 50%; background: var(--s3); font-size: 15px; flex: none; }
  .safe-hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .safe-hint.ok { color: var(--ok); }
  .safe-hint.bad { color: var(--bad); }
  .ideas { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .ideas::-webkit-scrollbar { display: none; }
  .ideas button { flex: none; height: 30px; padding: 0 10px; border-radius: 99px; background: var(--s2); border: 1px solid var(--line); font-size: 12.5px; }
  .drow { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 15px; background: var(--s2); }
  .drow .grow { flex: 1; min-width: 0; }
  .drow .t { font-weight: 700; line-height: 1.25; }
  .drow .m { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .drow .pool { color: var(--lime); font-weight: 800; }
  .rules li { margin: 0 0 10px 18px; }
  .rules { font-size: 14px; color: #ddd8ee; }
  .packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .pack { padding: 16px 12px; border-radius: 16px; background: var(--s2); border: 1px solid var(--line); text-align: center; position: relative; }
  .pack b { display: block; font-size: 24px; font-weight: 900; }
  .pack em { position: absolute; top: 8px; right: 8px; font-style: normal; font-size: 10.5px; font-weight: 800; color: #0b0f02; background: var(--lime); padding: 2px 6px; border-radius: 6px; }

  /* ── toasts / fx / onboarding ── */
  #toasts { position: absolute; top: calc(var(--st) + 10px); left: 12px; right: 12px; z-index: 80; display: grid; gap: 8px; pointer-events: none; }
  .toast { justify-self: center; max-width: 100%; padding: 10px 14px; border-radius: 14px; background: rgba(28,25,38,.96); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: drop .3s ease; }
  .toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
  .toast.ok { border-color: rgba(61,255,160,.4); }
  .toast.bad { border-color: rgba(255,90,106,.45); }

    o.start(); o.stop(actx.currentTime + d);
  } catch { /* нет аудио */ }
}

/* ═════════ streams simulation ═════════ */
function makeBokeh(hue) {
  return Array.from({ length: 14 }, () => ({ x: Math.random(), y: rnd(0, 0.75), r: rnd(0.03, 0.12), h: hue[0] + rnd(-35, 35), a: rnd(0.12, 0.4), s: rnd(0.15, 0.55), p: rnd(0, 6.3) }));
}
function botDare(st) {
  const taken = new Set([...st.dares.map((d) => d.text), st.active?.d.text]);
  const pool = [...(BANK[st.cat] || []), ...BANK.any].filter(([t]) => !taken.has(t));
  const [text, tag] = pick(pool.length ? pool : BANK.any);
  return { id: uid(), text, tag, pool: ri(3, 30) * 10, backers: ri(1, 14), time: pick([30, 30, 60, 60, 120]), by: botNick(), mine: false, my: 0 };
}
const streams = STREAMERS.map((m) => {
  const st = { ...m, likes: ri(2000, 30000), dares: [], active: null, cooldown: ri(3, 9), chat: [], bokeh: makeBokeh(m.hue) };
  for (let i = 0, n = ri(2, 4); i < n; i++) st.dares.push(botDare(st));
  if (Math.random() < 0.6) { const d = topDare(st); st.dares = st.dares.filter((x) => x !== d); st.active = { d, phase: 'doing', t: ri(10, d.time), total: d.time }; }
  for (let i = 0; i < 5; i++) st.chat.push({ nick: botNick(), text: pick(CHAT.idle) });
  return st;
});
const byId = (id) => streams.find((s) => s.id === id);
function topDare(st) { return st.dares.reduce((a, d) => (!a || d.pool > a.pool ? d : a), null); }

function pushChat(st, m) {
  st.chat.push(m); if (st.chat.length > 30) st.chat.shift();
  if (st === curStream() && cur === 'feed') renderChat(st);
}
function myBacks(dareId) { return S.backs.filter((b) => b.dareId === dareId && b.status === 'pending'); }

function startDare(st, d) {
  st.dares = st.dares.filter((x) => x !== d);
  st.active = { d, phase: 'doing', t: d.time, total: d.time, yes: 0, no: 0, myVote: null };
  pushChat(st, { sys: true, text: `▶ ${st.name} принял(а) задание «${d.text}» — банк ${fmt(d.pool)} ✦` });
  if (d.my > 0) { toast(`🔥 ${st.name} выполняет ваше задание!`, 'ok'); buzz([40, 60, 40]); chime(); }
}
function declineDare(st, d) {
  st.dares = st.dares.filter((x) => x !== d);
  pushChat(st, { sys: true, text: `✋ ${st.name} отказался(ась) от «${d.text}». Банк вернули зрителям.` });
  settle(d, false, st, 'отказ стримера');
}
function settle(d, success, st, why) {
  const mine = myBacks(d.id);
  if (!mine.length) return;
  const sum = mine.reduce((a, b) => a + b.amount, 0);
  for (const b of mine) b.status = success ? 'paid' : 'refunded';
  if (success) { S.stats.won++; gainXp(20); toast(`✅ Засчитано! Ваши ${fmt(sum)} ✦ ушли ${st.name}`, 'ok'); }
  else { S.stats.refunded++; addTx(sum, `Возврат (${why}): «${d.text}»`); toast(`↩ Возврат ${fmt(sum)} ✦ — ${why}`); }
  save();
}
function finishVote(st) {
  const a = st.active, total = a.yes + a.no;
  a.success = total > 0 && a.yes / total >= PASS;
  a.phase = 'result'; a.t = 5;
  pushChat(st, { sys: true, text: a.success ? `✅ Засчитано ${Math.round((a.yes / total) * 100)}% — ${fmt(a.d.pool)} ✦ уходят стримеру` : `❌ Не засчитано — банк ${fmt(a.d.pool)} ✦ возвращается` });
  const involved = a.d.my > 0 || a.myVote !== null;
  settle(a.d, a.success, st, 'не засчитано');
  if (st === curStream() && cur === 'feed') { if (a.success) { confetti(involved ? 60 : 26); chime(); } else beep(220, 0.25, 'triangle'); }
}
function tickStream(st, visible) {
  st.viewers = Math.max(40, Math.round(st.viewers * rnd(0.988, 1.014) + rnd(-4, 6)));
  const a = st.active;
  if (Math.random() < (visible ? 0.7 : 0.15)) pushChat(st, { nick: botNick(), text: pick(a ? (a.phase === 'result' ? CHAT[a.success ? 'ok' : 'bad'] : CHAT[a.phase]) : CHAT.idle) });
  if (st.dares.length < 7 && Math.random() < 0.07) {
    const d = botDare(st); st.dares.push(d);
    if (visible) pushChat(st, { sys: true, text: `🎯 Новое задание от ${d.by}: «${d.text}» — ${fmt(d.pool)} ✦` });
  }
  if (st.dares.length && Math.random() < 0.35) { const d = pick(st.dares); d.pool += pick([10, 20, 20, 50, 100]); d.backers++; }
  for (const d of st.dares) if (d.mine && Math.random() < 0.3) { d.pool += pick([10, 20, 30, 50]); d.backers++; }
  if (!a) {
    if (--st.cooldown > 0 || !st.dares.length) return;
    const top = topDare(st);
    if (top.pool < 60) { st.cooldown = 3; return; }
    if (Math.random() < 0.1) { declineDare(st, top); st.cooldown = 3; } else startDare(st, top);
    return;
  }
  a.t--;
  if (a.phase === 'doing') {
    if (Math.random() < 0.3) { a.d.pool += pick([10, 20, 50]); a.d.backers++; }
    if (a.t <= 0) {
      a.phase = 'voting'; a.t = VOTE_SEC; a.yes = a.yes || 0; a.no = a.no || 0; a.p = rnd(0.5, 0.95);
      pushChat(st, { sys: true, text: '🗳 Время вышло! Голосуйте: засчитать?' });
      if (visible) { beep(520, 0.1); buzz(30); }
    }
  } else if (a.phase === 'voting') {
    const n = ri(2, Math.max(3, Math.round(st.viewers / 140)));
    for (let i = 0; i < n; i++) Math.random() < a.p ? a.yes++ : a.no++;
    if (a.t <= 0) finishVote(st);
  } else if (a.t <= 0) { st.active = null; st.cooldown = ri(4, 9); }
}

/* ═════════ viewer actions ═════════ */
function backDare(st, d, amount) {
  if (needMoney(amount)) return false;
  addTx(-amount, `В банк «${d.text}» · ${st.name}`);
  if (!d.my) d.backers++;
  d.pool += amount; d.my += amount;
  const ex = myBacks(d.id)[0];
  if (ex) ex.amount += amount;
  else S.backs.unshift({ id: uid(), dareId: d.id, streamId: st.id, streamer: st.name, text: d.text, amount, status: 'pending', t: Date.now(), mine: d.mine });
  S.stats.backed++; gainXp(5); save();
  pushChat(st, { nick: S.user.nick, me: true, text: `+${fmt(amount)} ✦ в «${d.text}»` });
  beep(880, 0.06); buzz(15);
  return true;
}
function proposeDare(st, text, amount, time) {
  const r = Safety.check(text);
  if (!r.ok) { toast(`🛡 ${r.cat}: ${r.hint}`, 'bad'); return false; }
  if (needMoney(amount)) return false;
  const d = { id: uid(), text: text.trim().replace(/\s+/g, ' '), tag: 'talk', pool: 0, backers: 0, time, by: S.user.nick, mine: true, my: 0 };
  st.dares.push(d);
  backDare(st, d, amount);
  S.stats.proposed++; gainXp(10); save();
  pushChat(st, { sys: true, text: `🎯 Новое задание от ${S.user.nick}: «${d.text}» — ${fmt(d.pool)} ✦` });
  toast('Задание отправлено! Чем больше банк — тем выше шанс 🔥', 'ok');
  return true;
}
function vote(st, yes) {
  const a = st.active;
  if (!a || a.phase !== 'voting' || a.myVote !== null) return;
  a.myVote = yes; yes ? a.yes++ : a.no++;
  gainXp(2); buzz(20); beep(yes ? 880 : 330, 0.07);
  updateCard(st, true);
}

async function startCam() {
  const v = $('#cam');
  if (L.stream) L.stream.getTracks().forEach((t) => t.stop());
  L.stream = null; L.camOk = false;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no media');
    L.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: L.facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    v.srcObject = L.stream; v.classList.toggle('rear', L.facing !== 'user'); await v.play().catch(() => {});
    L.camOk = true;
  } catch { v.srcObject = null; }
  v.hidden = !L.camOk; $('#cam-fake').hidden = L.camOk;
  return L.camOk;
}

function genIncoming() {
  if (Math.random() < 0.22) {
    const r = Safety.check(pick(UNSAFE));
    if (!r.ok) { L.filtered++; toast(`🛡 Фильтр скрыл задание: ${r.cat}`); return; }
  }
  const taken = new Set([...L.incoming.map((d) => d.text), L.active?.d.text]);
  const pool = [...(BANK[L.cat] || []), ...BANK.any].filter(([t]) => !taken.has(t));
  if (!pool.length) return;
  const [text, tag] = pick(pool);
  if (!L.allow[tag]) { L.filtered++; return; }
  const d = { id: uid(), text, tag, pool: Math.max(L.minPool, ri(3, 20) * 10), backers: ri(1, 8), time: pick([30, 30, 60, 60, 120]), by: botNick() };
  L.incoming.push(d); beep(740, 0.05);
  liveChat({ sys: true, text: `🎯 ${d.by} предлагает: «${d.text}» — ${fmt(d.pool)} ✦` });
}
function liveTick() {
  L.sec++;
  const target = 8 + L.sec * 0.6 + L.done * 25;
  L.viewers = Math.max(1, Math.round(L.viewers + (target - L.viewers) * 0.05 + rnd(-2, 3)));
  L.peak = Math.max(L.peak || 0, L.viewers);
  const a = L.active;
  if (Math.random() < 0.45) liveChat({ nick: botNick(), text: pick(a ? (a.phase === 'result' ? CHAT[a.success ? 'ok' : 'bad'] : CHAT[a.phase]) : CHAT.idle) });
  if (!a && L.incoming.length < 3 && Math.random() < (L.sec < 6 ? 0.5 : 0.2)) genIncoming();
  for (const d of L.incoming) if (Math.random() < 0.25) { d.pool += pick([10, 20, 50]); d.backers++; }
  if (a) {
    a.t--;
    if (a.phase === 'doing') {
      if (Math.random() < 0.3) { a.d.pool += pick([10, 20, 50]); a.d.backers++; }
      if (a.t <= 0) liveResolve(false, 'время вышло');
      else if (a.t === 5) { beep(440, 0.08); buzz(20); }
    } else if (a.phase === 'voting') {
      for (let i = 0, n = ri(1, Math.max(2, Math.round(L.viewers / 6))); i < n; i++) Math.random() < a.p ? a.yes++ : a.no++;
      if (a.t <= 0) { const tot = a.yes + a.no; liveResolve(tot > 0 && a.yes / tot >= PASS, 'зрители не засчитали'); }
    } else if (a.t <= 0) L.active = null;
  }
  $('#lv-time').textContent = mmss(L.sec); $('#lv-viewers').textContent = fmt(L.viewers);
  $('#lv-earned').textContent = fmt(L.earned); $('#lv-filtered').textContent = L.filtered;
  renderLiveActive(); renderIncoming();
}
function liveResolve(success, why) {
  const a = L.active; a.phase = 'result'; a.success = success; a.t = 4; a.why = why;
  if (success) {
    const fee = Math.round(a.d.pool * FEE), net = a.d.pool - fee;
    a.net = net; L.earned += net; L.done++; S.earned += net; S.stats.daresDone++;
    addTx(net, `Эфир: «${a.d.text}» (−${fee} комиссия)`); gainXp(25);
    liveChat({ sys: true, text: `✅ Засчитано! +${fmt(net)} ✦ на ваш баланс` }); confetti(60); chime(); buzz([40, 50, 80]);
  } else {
    liveChat({ sys: true, text: `↩ Не засчитано (${why}) — банк ${fmt(a.d.pool)} ✦ вернули зрителям` }); beep(220, 0.25, 'triangle');
  }
  renderLiveActive(true);
}
function renderLiveActive(force) {
  const el = $('#lv-active'), a = L.active, k = a ? `${a.phase}:${a.d.id}` : `idle:${L.incoming.length ? 1 : 0}`;
  if (force || el.dataset.k !== k) {
    el.dataset.k = k;
    if (!a) el.innerHTML = L.incoming.length ? '' : '<div class="bn idle"><div class="bn-text">⏳ Ждём задания от зрителей… Поболтайте с чатом, пока они придумывают.</div></div>';
    else if (a.phase === 'doing') el.innerHTML = `<div class="bn"><div class="bn-row"><span class="tag hot">● Вы выполняете</span><span class="timer" data-k="t">${mmss(a.t)}</span></div>
      <div class="bn-text">«${esc(a.d.text)}»</div><div class="bar"><i data-k="bar" style="width:${(a.t / a.total) * 100}%"></i></div>
      <div class="bn-row"><span>Банк <b class="spark" data-k="pool">${fmt(a.d.pool)}</b> ✦ · вам после комиссии ≈ <b data-k="net">${fmt(a.d.pool * (1 - FEE))}</b></span></div>
      <div class="lv-acts"><button class="btn lime" data-l="done">✓ Готово</button><button class="btn ghost" data-l="quit">Сдаться</button></div></div>`;
    else if (a.phase === 'voting') el.innerHTML = `<div class="bn"><div class="bn-row"><span class="tag cyan">🗳 Зрители голосуют</span><span class="timer" data-k="t">${mmss(a.t)}</span></div>
      <div class="bn-text">«${esc(a.d.text)}»</div><div class="votes"><div class="vbtn yes"><i data-k="yb"></i><span>✓ Да</span><b data-k="yp">0%</b></div><div class="vbtn no"><i data-k="nb"></i><span>✕ Нет</span><b data-k="np">0%</b></div></div></div>`;
    else el.innerHTML = `<div class="bn result ${a.success ? 'ok' : 'bad'}"><div class="big">${a.success ? `✅ +${fmt(a.net)} ✦` : '↩ Не засчитано'}</div><div class="muted">${a.success ? 'Деньги зачислены на баланс' : `${esc(a.why)} — банк вернулся зрителям`}</div></div>`;
  }
  if (!a) return;
  const q = (s) => el.querySelector(`[data-k="${s}"]`);
  if (q('t')) { q('t').textContent = mmss(a.t); q('t').classList.toggle('low', a.t <= 5); }
  if (q('bar')) q('bar').style.width = (a.t / a.total) * 100 + '%';
  if (q('pool')) { q('pool').textContent = fmt(a.d.pool); q('net').textContent = fmt(a.d.pool * (1 - FEE)); }
  if (a.phase === 'voting') {
    const tot = Math.max(1, a.yes + a.no), yp = Math.round((a.yes / tot) * 100);
    q('yp').textContent = yp + '%'; q('np').textContent = 100 - yp + '%'; q('yb').style.width = yp + '%'; q('nb').style.width = 100 - yp + '%';
  }
}
function renderIncoming(force) {
  const el = $('#lv-incoming'), hide = !!L.active, sig = hide ? 'hide' : L.incoming.map((d) => d.id).join();
  if (force || el.dataset.sig !== sig) {
    el.dataset.sig = sig;
    el.innerHTML = hide ? '' : L.incoming.map((d) => `<div class="icard" data-i="${d.id}"><div class="grow"><div class="t">${esc(d.text)}</div>
      <div class="m"><b class="spark" data-k="p">${fmt(d.pool)} ✦</b> · ⏱ ${durLabel(d.time)} · от ${esc(d.by)}</div></div>
      <div class="acts"><button class="no" data-l="decline" aria-label="Отказаться">✕</button><button class="yes" data-l="accept" aria-label="Принять">✓</button></div></div>`).join('');
    return;
  }
  for (const d of L.incoming) { const r = el.querySelector(`[data-i="${d.id}"] [data-k="p"]`); if (r) r.textContent = `${fmt(d.pool)} ✦`; }
}
$('#live-view').addEventListener('click', (e) => {
  const b = e.target.closest('[data-l]'); if (!b) return;
  const act = b.dataset.l;
  if (act === 'accept' || act === 'decline') {
    const d = L.incoming.find((x) => x.id === b.closest('[data-i]').dataset.i); if (!d) return;
    L.incoming = L.incoming.filter((x) => x !== d);
    if (act === 'accept') {
      L.active = { d, phase: 'doing', t: d.time, total: d.time, yes: 0, no: 0 };
      liveChat({ sys: true, text: `▶ Вы приняли «${d.text}». Время пошло!` }); buzz(30); beep(880, 0.08);
    } else { liveChat({ sys: true, text: `✋ Вы отказались от «${d.text}» — банк вернули зрителям` }); }
    renderLiveActive(true); renderIncoming(true);
  } else if (act === 'done' && L.active?.phase === 'doing') {
    Object.assign(L.active, { phase: 'voting', t: 8, p: rnd(0.78, 0.96) });
    liveChat({ sys: true, text: '🗳 Стример говорит «готово»! Голосуем: засчитать?' }); renderLiveActive(true);
  } else if (act === 'quit' && L.active?.phase === 'doing') liveResolve(false, 'вы сдались');
});

/* ═════════ canvas scenes ═════════ */
function drawScene(cv, sc, t) {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, w * 0.4, h);
  g.addColorStop(0, `hsl(${sc.hue[0]} 55% 17%)`); g.addColorStop(1, `hsl(${sc.hue[1]} 60% 5%)`);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';
  for (const b of sc.bokeh) {
    const x = (b.x + Math.sin(t * b.s + b.p) * 0.04) * w, y = (b.y + Math.cos(t * b.s * 0.8 + b.p) * 0.03) * h, r = b.r * Math.max(w, h);
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `hsla(${b.h},90%,65%,${b.a})`); rg.addColorStop(1, `hsla(${b.h},90%,65%,0)`);
    c.fillStyle = rg; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  const cx = w / 2 + Math.sin(t * 0.6) * w * 0.025, hr = Math.min(w, h) * 0.14, hy = h * 0.6 + Math.sin(t * 1.1) * 3, sy = hy + hr * 1.7;
  c.fillStyle = 'rgba(5,4,10,.93)';
  c.beginPath(); c.ellipse(cx, sy + h * 0.32, w * 0.44, h * 0.34, 0, 0, Math.PI * 2); c.fill();
  c.fillRect(cx - hr * 0.42, hy, hr * 0.84, hr * 1.9);
  c.beginPath(); c.arc(cx, hy, hr, 0, Math.PI * 2); c.fill();
  c.strokeStyle = `hsla(${sc.hue[0]},95%,72%,.55)`; c.lineWidth = 2.5;
  c.beginPath(); c.arc(cx, hy, hr, Math.PI * 1.05, Math.PI * 1.72); c.stroke();
  c.beginPath(); c.ellipse(cx, sy + h * 0.32, w * 0.44, h * 0.34, 0, Math.PI * 1.1, Math.PI * 1.4); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 70; i++) c.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
}
const prevScene = { hue: [150, 260], bokeh: makeBokeh([150, 0]) };
let lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden || ts - lastFrame < 33) return;
  lastFrame = ts; const t = ts / 1000;
  if (cur === 'feed') { const card = feedEl.children[curIdx]; if (card) drawScene(card.querySelector('canvas'), curStream(), t); }
  if (cur === 'live') { if (L.on) { if (!L.camOk) drawScene($('#cam-fake'), L.fake, t); } else drawScene($('#prev-canvas'), prevScene, t); }
}

/* ═════════ navigation ═════════ */
let cur = 'feed';
function show(tab) {
  if (L.on && tab !== 'live') return;
  cur = tab;
  $$('.screen').forEach((s) => s.classList.toggle('on', s.id === 'scr-' + tab));
  $$('.tabbar [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'top') renderTop(true);
  if (tab === 'wallet') renderWallet();
  if (tab === 'profile') renderProfile();
  if (tab === 'live' && !L.on) renderSetup();
  if (tab === 'feed') renderChat(curStream());
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  closeSheet(); show(b.dataset.tab);
});

/* ═════════ onboarding ═════════ */
function onboarding() {
  const steps = [
    { em: '📺', h: 'Смотри живые эфиры', p: 'Стримеры гуляют, рисуют, поют и готовят прямо сейчас. Листай вверх, чтобы переключать эфиры.' },
    { em: '🎯', h: 'Предлагай задания', p: 'Придумай задание и положи ✦ в банк. Другие зрители докидывают — самое богатое задание стример берёт первым.' },
    { em: '🗳', h: 'Зачёт решает чат', p: `Когда время выходит, зрители голосуют. ≥${PASS * 100}% «да» — банк уходит стримеру, иначе все получают деньги назад.` },
    { em: '🛡', h: 'Кураж, а не риск', p: 'Опасные, незаконные и унизительные задания блокирует фильтр. Стример всегда может отказаться без штрафа.' },
  ];
  const el = document.createElement('div'); el.className = 'onb'; $('#app').appendChild(el);
  let i = 0, agree = false;
  const render = () => {
    const last = i === steps.length;
    el.innerHTML = `<div class="logo">КУРАЖ</div>
      <div class="hero">${last ? `<div class="em">⚡</div><h1>Как тебя зовут в чате?</h1>
        <input class="inp" id="onb-nick" maxlength="20" placeholder="Ник" autocomplete="nickname" />
        <button class="check ${agree ? 'on' : ''}" id="onb-agree"><i></i><span>Мне есть 18 лет, я принимаю правила безопасности</span></button>`
      : `<div class="em">${steps[i].em}</div><h1>${steps[i].h}</h1><p>${steps[i].p}</p>`}</div>
      <div class="dots">${[...steps, 0].map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn lime block" id="onb-next" style="height:54px;font-size:16px">${last ? 'Погнали ⚡' : 'Дальше'}</button>
      ${last ? '' : '<button class="btn block" id="onb-skip" style="margin-top:6px;background:none;color:var(--muted)">Пропустить</button>'}`;
    const nick = $('#onb-nick', el);
    if (nick) { nick.value = el.dataset.nick || ''; nick.addEventListener('input', () => (el.dataset.nick = nick.value)); }
    $('#onb-agree', el)?.addEventListener('click', () => { agree = !agree; render(); });
    $('#onb-skip', el)?.addEventListener('click', () => { i = steps.length; render(); });
    $('#onb-next', el).addEventListener('click', () => {
      if (!last) { i++; render(); return; }
      const v = (el.dataset.nick || '').trim();
      if (v.length < 2) return toast('Ник — минимум 2 символа', 'bad');
      if (!Safety.scan(v).ok) return toast('🛡 Такой ник не пропустит фильтр', 'bad');
      if (!agree) return toast('Подтвердите возраст и правила', 'bad');
      S.user = { nick: v, joined: Date.now() }; save(); el.remove(); toast(`Привет, ${v}! На счёт зачислено 500 ✦ 🎁`, 'ok'); chime();
    });
  };
  render();
}

/* ═════════ boot ═════════ */
load();
buildFeed();
refreshBalance();
setInterval(() => {
  streams.forEach((st, i) => tickStream(st, i === curIdx && cur === 'feed'));
  if (cur === 'feed') streams.forEach((st) => updateCard(st));

}, 1000);
requestAnimationFrame(frame);
if (!S.user) onboarding();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.Kurazh = { Safety, BANK, UNSAFE, S: () => S, streams, L };
