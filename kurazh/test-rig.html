<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kurazh Test Rig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Layout: a full-screen WebGL stage with a frosted test-runner panel docked right (bottom on phones) and a caption bar. Single matte dark look. */
  :root {
    --bg: #070807; --panel: rgba(13,17,14,.8); --line: rgba(236,226,207,.12); --line2: rgba(184,151,90,.42);
    --gold: #b8975a; --gold2: #cdb27c; --cash: #c8b69a; --van: #ece2cf; --muted: #8f8b7e; --ok: #93b49c; --bad: #c07466; --green: #1e3a2c; --ink: #121410;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--van); font: 14px/1.4 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 1.5px solid var(--gold2); outline-offset: 2px; }
  .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 5; }
  .brand .k { font: 700 11px var(--sans); letter-spacing: .5em; color: var(--gold2); }
  .brand h1 { margin: 6px 0 0; font: 600 34px/1 var(--serif); letter-spacing: -.01em; }
  .brand p { margin: 6px 0 0; color: var(--cash); font-size: 13px; max-width: 30ch; }
  .ctrl { pointer-events: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .ctrl button { height: 34px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .ctrl button.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .ctrl svg { width: 14px; height: 14px; }

  .tests { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 110px); width: 340px;
    border-radius: 18px; padding: 14px 14px 12px; display: grid; gap: 10px; max-height: calc(100% - 220px); }
  .t-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .t-head b { font: 600 20px var(--serif); }
  .runpill { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; font: 600 11px var(--mono); border: 1px solid var(--line2); color: var(--gold2); white-space: nowrap; }
  .runpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold2); animation: blink 1.2s infinite; }
  .runpill.done { color: var(--ok); border-color: rgba(147,180,156,.5); }
  .runpill.done i { background: var(--ok); animation: none; }
  @keyframes blink { 50% { opacity: .25; } }
  .prog { height: 3px; border-radius: 3px; background: rgba(236,226,207,.1); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s ease; }
  .tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; overflow-y: auto; min-height: 0; }
  .tlist li { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 9px; font-size: 13px; color: var(--muted); }
  .tlist .ic { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(236,226,207,.22); display: grid; place-items: center; }
  .tlist li.run { color: var(--van); background: rgba(184,151,90,.09); }
  .tlist li.run .ic { border-color: rgba(205,178,124,.25); border-top-color: var(--gold2); animation: spin .8s linear infinite; }
  .tlist li.pass { color: var(--cash); }
  .tlist li.pass .ic { border-color: var(--ok); background: rgba(147,180,156,.16); }
  .tlist li.pass .ic::before { content: ""; width: 7px; height: 4px; border: 1.5px solid var(--ok); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .tlist .ms { font: 500 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .t-toggle { display: none; }

  .caption { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: min(640px, calc(100% - 32px));
    border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .caption .step { flex: none; font: 600 11px var(--mono); color: var(--gold2); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 7px; }
  .caption .txt { font: italic 600 19px/1.25 var(--serif); color: var(--van); min-width: 0; }
  .hint { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); color: var(--muted); font-size: 12px; pointer-events: none; }

  @media (max-width: 860px) {
    .brand h1 { font-size: 28px; }
    .brand p { display: none; }
    .ctrl button span { display: none; }
    .ctrl button { padding: 0 10px; }
    .tests { top: auto; right: max(12px, env(safe-area-inset-right, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); width: auto;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-height: 46%; padding: 12px; }
    .tests.collapsed .tlist li:not(.run) { display: none; }
    .t-toggle { display: inline-flex; font-size: 12px; font-weight: 700; color: var(--gold2); }
    .caption { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 66px); width: calc(100% - 24px); padding: 10px 12px; }
    .caption .txt { font-size: 16px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .runpill i, .tlist li.run .ic { animation: none; } }
</style>

</head>
<body>
<canvas id="c" aria-label="3D simulation of the Kurazh test run" tabindex="0"></canvas>

<header class="top">
  <div class="brand"><div class="k">KURAZH</div><h1>Test rig</h1><p>Every check of the app, played out on one stage: sign-up, safety filter, card holds, voting and payouts.</p></div>
  <nav class="ctrl" aria-label="Playback">
    <button class="glass" id="b-play" aria-label="Pause"></button>
    <button class="glass" id="b-restart" aria-label="Restart run"></button>
    <button class="glass" id="b-speed" aria-label="Playback speed">1×</button>
    <button class="glass" id="b-outcome" aria-label="Outcome of the next run"></button>
    <button class="glass gold" id="b-cam" hidden aria-label="Return to the cinematic camera"></button>
  </nav>
</header>

<aside class="tests glass collapsed" id="tests" aria-label="Test run">
  <div class="t-head"><b>End-to-end run</b><span class="runpill" id="runpill"><i></i><span id="runtxt">0/12</span></span></div>
  <div class="prog"><i id="progbar"></i></div>
  <ol class="tlist" id="tlist"></ol>
  <button class="t-toggle" id="t-toggle" aria-expanded="false">Show all checks</button>
</aside>

<div class="caption glass" role="status" aria-live="polite"><span class="step" id="capstep">00</span><span class="txt" id="captxt">Setting the stage…</span></div>
<div class="hint">Drag to orbit · scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const C = { bg: 0x070807, floor: 0x0d1611, green: 0x1e3a2c, green2: 0x284a39, gold: 0xb8975a, gold2: 0xcdb27c, cash: 0xc8b69a, van: 0xece2cf, sage: 0x93b49c, rose: 0xc07466, ox: 0x7e2b25, ink: 0x121410 };
const HEX = { gold: '#b8975a', gold2: '#cdb27c', cash: '#c8b69a', van: '#ece2cf', muted: '#8f8b7e', ok: '#93b49c', bad: '#c07466', green: '#1e3a2c', ink: '#121410', ox: '#7e2b25' };
const SERIF = '"Cormorant Garamond", Georgia, serif', SANS = 'Manrope, system-ui, sans-serif';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ═════════ renderer, scene, camera ═════════ */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.Fog(C.bg, 16, 38);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 120);
camera.position.set(0, 8, 17);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.48; controls.minDistance = 2.5; controls.maxDistance = 30;
controls.target.set(0, 1.4, 0);

// soft studio environment for the metals
{
  const pm = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshBasicMaterial({ color: 0x0c0f0c, side: THREE.BackSide })));
  const panel = (col, p, w, h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.copy(p); m.lookAt(0, 0, 0); env.add(m); };
  panel(0xfff0d8, V(0, 12, 2), 14, 10); panel(0xcdb27c, V(11, 4, 6), 8, 5); panel(0x2c4a3b, V(-11, 3, -4), 8, 8); panel(0xece2cf, V(-4, 6, 11), 6, 3);
  scene.environment = pm.fromScene(env, 0.04).texture;
}
scene.add(new THREE.HemisphereLight(0xece2cf, 0x0e1712, 0.22));
const key = new THREE.DirectionalLight(0xffe6c0, 1.25);
key.position.set(6, 12, 8); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -12; key.shadow.camera.right = 12; key.shadow.camera.top = 12; key.shadow.camera.bottom = -12; key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.PointLight(0xcdb27c, 1.4, 16); rim.position.set(-4, 5, -5); scene.add(rim);
const fill = new THREE.PointLight(0x93b49c, 0.7, 16); fill.position.set(5, 3, -4); scene.add(fill);

const std = (color, rough = 0.85, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, envMapIntensity: metal > 0.3 ? 1 : 0.35, ...extra });
const goldMat = std(C.gold, 0.32, 0.95);
const goldDim = std(C.gold, 0.5, 0.7);
const shadowy = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

/* ═════════ canvas helpers ═════════ */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrap(c, text, maxW) { const out = []; let line = ''; for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } if (line) out.push(line); return out; }
function texFrom(cv) { const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
// A camera-facing label with a redraw hook.
function makeSprite(w, h, worldH, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = texFrom(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  sp.scale.set(worldH * (w / h), worldH, 1);
  sp.userData.base = sp.scale.clone();
  sp.userData.redraw = (...a) => { const c = cv.getContext('2d'); c.clearRect(0, 0, w, h); draw(c, w, h, ...a); tex.needsUpdate = true; };
  sp.userData.redraw();
  return sp;
}
function pill(text, kind = 'gold', worldH = 0.32, widthText = text) {
  const tones = { gold: [HEX.gold2, 'rgba(14,18,15,.9)', HEX.gold], ok: [HEX.ok, 'rgba(14,22,17,.92)', HEX.ok], bad: [HEX.bad, 'rgba(26,14,13,.92)', HEX.bad], van: [HEX.van, 'rgba(14,18,15,.88)', 'rgba(236,226,207,.25)'] };
  const probe = document.createElement('canvas').getContext('2d'); probe.font = `700 52px ${SANS}`;
  const w = Math.ceil(Math.max(probe.measureText(text).width, probe.measureText(widthText).width) * 1.08 + 90), h = 104;
  return makeSprite(w, h, worldH, (c, W, H, t = text, k = kind) => {
    const [fg, bg, br] = tones[k];
    rr(c, 4, 4, W - 8, H - 8, 46); c.fillStyle = bg; c.fill(); c.lineWidth = 4; c.strokeStyle = br; c.stroke();
    c.fillStyle = fg; c.font = `700 52px ${SANS}`; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText(t, W / 2, H / 2 + 2);
  });
}

/* ═════════ tween clock (pausable, speed, abortable) ═════════ */
let simT = 0, speed = 1, paused = false, token = 0;
const tweens = [];
class Abort extends Error {}
function tween(dur, fn, ease = easeInOut, quiet = false) {
  const tok = token;
  return new Promise((res, rej) => tweens.push({ t0: simT, dur: Math.max(1, dur), fn, ease, res, rej, tok, quiet }));
}
const fx = (dur, fn, ease) => { tween(dur, fn, ease, true); };
const wait = (ms) => tween(ms, () => {});
function stepTweens() {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const k = Math.min(1, (simT - tw.t0) / tw.dur);
    tw.fn(tw.ease(k), k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
function abortAll() { token++; const old = tweens.splice(0); for (const tw of old) if (!tw.quiet) tw.rej(new Abort()); }

/* ═════════ stage ═════════ */
const floor = new THREE.Mesh(new THREE.CircleGeometry(22, 96), std(0x060a07, 0.97, 0, { envMapIntensity: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
for (const r of [2.6, 5.4, 8.6, 12]) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.025, 160), new THREE.MeshBasicMaterial({ color: C.gold, transparent: true, opacity: r < 9 ? 0.32 : 0.14 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.004; scene.add(ring);
}
// ambient gold dust
const dust = (() => {
  const n = 260, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 13; pos.set([Math.cos(a) * r, Math.random() * 7, Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: C.gold2, size: 0.035, transparent: true, opacity: 0.55, depthWrite: false }));
  scene.add(p); return p;
})();

// pedestal + phone
const ped = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.45, 0.3, 64), std(0x15281e, 0.8, 0, { envMapIntensity: 0.2 })));
ped.position.set(0, 0.15, -1.6); scene.add(ped);
const pedRing = new THREE.Mesh(new THREE.TorusGeometry(1.37, 0.018, 8, 120), goldMat); pedRing.rotation.x = Math.PI / 2; pedRing.position.set(0, 0.3, -1.6); scene.add(pedRing);
function roundedShape(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
const phone = new THREE.Group(); phone.position.set(0, 2.15, -1.6); scene.add(phone);
{
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(1.6, 3.3, 0.24), { depth: 0.1, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035, bevelSegments: 5, curveSegments: 14 }), goldMat);
  body.geometry.translate(0, 0, -0.05); body.castShadow = true; phone.add(body);
  const glass = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(1.52, 3.22, 0.2), 14), std(0x050605, 0.2, 0.1)); glass.position.z = 0.088; phone.add(glass);
}
const SW = 600, SH = 1290;
const scv = document.createElement('canvas'); scv.width = SW; scv.height = SH;
const sctx = scv.getContext('2d');
const stex = texFrom(scv);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.46, 1.46 * SH / SW), new THREE.MeshBasicMaterial({ map: stex, transparent: true, toneMapped: false }));
screen.position.z = 0.095; phone.add(screen);
const phoneFront = () => phone.localToWorld(V(0, 0.35, 0.3));

// shield (safety filter)
const shield = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), new THREE.MeshBasicMaterial({ color: C.sage, wireframe: true, transparent: true, opacity: 0, depthWrite: false }));
shield.scale.set(1.25, 1.55, 0.45); shield.position.set(0, 2.15, -0.95); scene.add(shield);

// vault for held money
const vault = new THREE.Group(); vault.position.set(-2.7, 0, -0.9); scene.add(vault);
{
  const vp = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.82, 0.24, 48), std(C.green, 0.8))); vp.position.y = 0.12; vault.add(vp);
  const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: C.van, transparent: true, opacity: 0.12, roughness: 0.1, metalness: 0, depthWrite: false }));
  cube.position.y = 0.76; vault.add(cube);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: C.gold2 })); edges.position.y = 0.76; vault.add(edges);
  const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.03, 10, 24, Math.PI), goldMat); shackle.position.set(0, 1.42, 0); vault.add(shackle);
  const lockBody = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.26, 0.12), goldMat)); lockBody.position.set(0, 1.3, 0); vault.add(lockBody);
  vault.userData.shackle = shackle;
}
const vaultLabel = pill('ON HOLD · $0', 'gold', 0.3, 'ON HOLD · $888'); vaultLabel.position.set(-2.7, 2.05, -0.9); scene.add(vaultLabel);
const coinGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.028, 28);
const stack = [];
for (let i = 0; i < 36; i++) {
  const m = new THREE.Mesh(coinGeo, goldMat); const col = i % 4, row = Math.floor(i / 4);
  m.position.set(-2.7 + (col % 2 ? 0.14 : -0.14), 0.3 + row * 0.032, -0.9 + (col > 1 ? 0.14 : -0.14)); m.visible = false; m.castShadow = true; scene.add(m); stack.push(m);
}
let held = 0;
function setHeld(v) { held = Math.max(0, v); vaultLabel.userData.redraw(`ON HOLD · $${held}`, held ? 'gold' : 'van'); const n = Math.min(stack.length, Math.ceil(held / 2.5)); stack.forEach((m, i) => (m.visible = i < n)); }

// platform fee obelisk
const fee = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.3, 0.32), goldDim)); fee.position.set(-4.4, 0.65, -2.6); scene.add(fee);
const feeLabel = pill('Platform 20% · $0', 'van', 0.24, 'Platform 20% · $888'); feeLabel.position.set(-4.4, 1.65, -2.6); scene.add(feeLabel);

// KYC gate
const gate = new THREE.Group(); gate.position.set(0, 0, 8.4); scene.add(gate);
{
  for (const x of [-1.25, 1.25]) { const p = shadowy(new THREE.Mesh(new THREE.BoxGeometry(0.22, 3, 0.22), goldMat)); p.position.set(x, 1.5, 0); gate.add(p); }

function animPerson(p, t, dt) {
  const T = { lx: 0, rx: 0, lz: -0.08, rz: 0.08, ll: 0, lr: 0, y: 0.9, tilt: Math.sin(t * 0.6 + p.phase) * 0.12, sway: 0 };

  } else if (p.mode === 'phone') { T.rx = -1.25; T.rz = 0.15; T.y = 0.9 + Math.sin(ph * 2) * 0.006; }
  else if (p.mode === 'raise') { T.rx = -1.25; T.rz = 0.15; T.lz = -2.75 + Math.sin(ph * 5) * 0.08; }
  else if (p.mode === 'dance') { T.lz = -2.3 + Math.sin(ph * 6) * 0.45; T.rz = 2.3 - Math.sin(ph * 6) * 0.45; T.y = 0.9 + Math.abs(Math.sin(ph * 6)) * 0.07; T.sway = Math.sin(ph * 3) * 0.14; T.ll = Math.sin(ph * 6) * 0.15; T.lr = -Math.sin(ph * 6) * 0.15; T.tilt = Math.sin(ph * 3) * 0.2; }
  else if (p.mode === 'cheer') { T.lz = -2.85 + Math.sin(ph * 12) * 0.12; T.rz = 2.85 - Math.sin(ph * 12) * 0.12; T.y = 0.9 + Math.max(0, Math.sin(ph * 7)) * 0.22; }
  else if (p.mode === 'shrug') { T.lz = -0.75; T.rz = 0.75; T.lx = -0.5; T.rx = -0.5; T.tilt = 0.25; }
  else if (p.mode === 'wave') { T.rz = 2.5 + Math.sin(ph * 8) * 0.35; }
  const k = 1 - Math.exp(-dt * 10);
  for (const key of Object.keys(T)) p.pose[key] = lerp(p.pose[key], T[key], k);
  const P = p.pose;
  p.armL.rotation.set(P.lx, 0, P.lz); p.armR.rotation.set(P.rx, 0, P.rz);
  p.legL.rotation.x = P.ll; p.legR.rotation.x = P.lr;
  p.hips.position.y = P.y; p.hips.rotation.z = P.sway; p.head.rotation.y = P.tilt;
}

  for (const p of people) if (p.g.visible) animPerson(p, t, paused ? 0 : dt * speed);
  phone.position.y = 2.15 + (reduced ? 0 : Math.sin(wall * 1.1) * 0.04);
  vaultLabel.position.y = 2.05 + Math.sin(wall * 1.4) * 0.03;
  dust.rotation.y += dt * 0.02;
  tripod.userData.rec.material.color.setHex(recOn && Math.sin(wall * 5) > 0 ? 0xc0392b : 0x3a1512);
  screenAcc += dt; if (screenAcc > 1 / 20) { screenAcc = 0; drawScreen(now); }
  driveCamera(dt, wall);
  controls.update();
  renderer.render(scene, camera);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  [vaultLabel, feeLabel, gateLabel, streamerTag, earnLabel, carSign].forEach((s) => s.userData.redraw());
  setHeld(0); feeLabel.userData.redraw('Platform 20% · $0', 'van');
});
requestAnimationFrame(frame);
loop();
</script>
