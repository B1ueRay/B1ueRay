# Конфиг пайплайна нарезки шортсов.
# Любой параметр можно переопределить флагом командной строки (см. --help у скриптов).
# Файл в UTF-8. Если правите в Блокноте — сохраняйте как UTF-8.

# ---------------------------------------------------------------------------
# find_moments.py — поиск смешных моментов по чату
# ---------------------------------------------------------------------------
chat:
  window_sec: 15          # скользящее окно, в котором считается «индекс угара»
  step_sec: 1             # шаг сетки (сек)
  baseline_sec: 300       # окно скользящего базового уровня (медиана), сек
  baseline_floor: 4.0     # минимальный базовый уровень (в «весе сообщений» за окно),
                          # чтобы тихий чат не давал огромных коэффициентов от 3 сообщений
  chat_delay_sec: 7       # чат реагирует на событие позже на N сек — сдвигаем назад
  message_weight: 1.0     # вес любого сообщения (активность)
  max_laugh_per_message: 5.0   # потолок смех-веса одного сообщения (KEKW x50 не считается за 50)
  user_cooldown_sec: 4    # повторное сообщение того же юзера чаще, чем раз в N сек...
  user_repeat_factor: 0.3 # ...считается с этим множителем (антиспам)
  min_laugh_share: 0.15   # доля смеха в окне (смех-вес / сообщений), ниже — это не «угар», а просто движ
  min_score: 1.8          # порог: во сколько раз окно «горячее» базового уровня
  min_gap_sec: 45         # моменты ближе друг к другу склеиваются (берётся лучший)
  top_n: 15

  # Границы клипа относительно начала всплеска смеха (уже со сдвигом на chat_delay_sec)
  pad_before_sec: 20      # сколько взять ДО события (контекст/завязка)
  pad_after_sec: 8        # сколько взять ПОСЛЕ конца всплеска
  min_clip_sec: 15
  max_clip_sec: 59        # Shorts: до 60 сек (YouTube уже разрешает до 3 мин, но короткие заходят лучше)

  csv_delimiter: ";"      # ";" — чтобы CSV нормально открывался в русском Excel
  top_messages: 6         # сколько самых частых сообщений показывать для каждого момента

# Смех-маркеры. Три группы:
#   emotes — целые слова/эмоуты (сравнение без учёта регистра, если emotes_case_sensitive: false)
#   emoji  — подстроки (каждое вхождение считается)
#   regex  — регулярные выражения Python (без учёта регистра), одно совпадение на сообщение
laugh_markers:
  emotes_case_sensitive: false
  emotes:
    KEKW: 3
    OMEGALUL: 3
    LULW: 2.5
    LUL: 2
    ICANT: 3
    KEKL: 3
    KEKWait: 1.5
    pepeLaugh: 2.5
    EleGiggle: 2
    4Head: 1
    Clueless: 1
    LMAO: 2.5
    LMFAO: 3
    ROFL: 2.5
    XD: 1.5
    ЗАХОДИ: 2
    ору: 2.5
    ржу: 2
    ржака: 2
    угар: 2
    ахуеть: 1
  emoji:
    "😂": 2
    "🤣": 2.5
    "💀": 2
    "😭": 1
    "😹": 1.5
  regex:
    # ахах / хаха / ахахаха / ХАХАХ / аххаха — минимум 4 буквы из «а/х» и обе буквы присутствуют
    '(?<![а-яё])(?=[ах]*а)(?=[ах]*х)[ах]{4,}(?![а-яё])': 2.5
    # пхах, пхахах, пхпхпх
    '(?<![а-яё])п[хпа]{2,}(?![а-яё])': 2.5
    # орууу, ору, ОРУУУ (одиночное «ору» уже в emotes, тут — растянутые)
    '(?<![а-яё])ор(у{2,}|нул)(?![а-яё])': 3
    # lol / loool / lul
    '\bl+[ou]+l+\b': 1.5
    # lmao / lmaooo
    '\blm+a+o+\b': 2.5
    # hahaha / hehehe / jajaja
    '\b(?:h+a+){2,}h?\b|\b(?:h+e+){2,}h?\b|\b(?:j+a+){2,}\b': 2
    # xD / xDDD
    '\bx+d+\b': 1.5

# ---------------------------------------------------------------------------
# cut_clips.py — нарезка и вертикаль
# ---------------------------------------------------------------------------
render:
  width: 1080
  height: 1920
  fps: 30                 # 30 или 60. 0 = как в исходнике
  layout: blur            # cam | blur
  # cam-режим: доля высоты под вебку сверху (0.35-0.40)
  cam_share: 0.375
  # Кроп вебки в координатах ИСХОДНОГО видео: x,y,w,h. Обязателен для layout=cam.
  cam_crop: null          # например "0,700,480,380"
  # Кроп геймплея (x,y,w,h) — null = по центру исходника на всю высоту
  game_crop: null
  # blur-режим
  blur_strength: 30       # сила размытия фона
  blur_dim: 0.75          # затемнение фона (1.0 = без затемнения)
  fg_zoom: 1.0            # >1 — увеличить геймплей по центру (обрезать бока), 1.0 = вся ширина
  # Кодирование
  video_codec: libx264    # libx264 | h264_nvenc (NVIDIA) | h264_qsv (Intel) | h264_amf (AMD)
  crf: 20                 # для libx264 (для nvenc используется как -cq)
  preset: medium
  audio_bitrate: 192k
  # Громкость (EBU R128, два прохода)
  loudnorm:
    enabled: true
    I: -14
    TP: -1.5
    LRA: 11
  fade_sec: 0.15          # микро-фейд аудио в начале/конце, чтобы не щёлкало (0 = выкл)

# ---------------------------------------------------------------------------
# Внешний вид: плашка ника, водяной знак, субтитры
# ---------------------------------------------------------------------------
style:
  # Шрифт. "auto" — ищется жирный системный (Windows: Arial Black / Arial Bold; Linux: DejaVu Sans Bold).
  # Если указываете свой файл — укажите и font_name (имя семейства внутри файла, нужно для .ass).
  font_file: auto
  font_name: auto

  streamer_name: null     # текст плашки, например "@streamer" (null = без плашки)
  nick_font_size: 54
  nick_text_color: "#FFFFFF"
  nick_box_color: "#9146FF"   # фиолетовый Twitch
  nick_box_opacity: 0.85

  watermark: null         # текст ("@my_channel") или путь к PNG-логотипу
  watermark_font_size: 40
  watermark_opacity: 0.55
  watermark_position: top-right  # top-left | top-right | bottom-left | bottom-right

# ---------------------------------------------------------------------------
# subtitles.py — транскрипция и .ass
# ---------------------------------------------------------------------------
subtitles:
  model: small            # tiny | base | small | medium | large-v3 | large-v3-turbo
  language: auto          # auto | ru | en | ...
  device: auto            # auto | cpu | cuda
  compute_type: auto      # auto (cuda: float16, cpu: int8) | int8 | int8_float16 | float16 | float32
  beam_size: 5
  vad_filter: true

  max_words: 3            # слов на экране одновременно
  max_chars: 18           # и не длиннее N символов
  pause_break_sec: 0.45   # пауза длиннее — новый кусок
  linger_sec: 0.25        # сколько держать последний кусок после окончания речи
  uppercase: true
  strip_punctuation: true

  font_size: 92
  primary_color: "#FFFFFF"
  highlight_color: "#FFE600"  # подсветка текущего слова
  outline_color: "#000000"
  outline: 9              # толщина обводки
  shadow: 3
  highlight_scale: 112    # % размера текущего слова (100 = без увеличения)
  pop_in: true            # лёгкий «поп» при появлении нового куска
  # Вертикальная позиция центра текста (доля высоты кадра): 0.62-0.70 — нижняя-средняя
  # треть, выше интерфейса Shorts/TikTok (название, ник, музыка внизу ~ 20-25% кадра).
  position_y: 0.66
  margin_x: 110           # поля слева/справа (справа кнопки лайков) в px при ширине 1080
