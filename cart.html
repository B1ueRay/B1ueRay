<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кошик — ArtSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Art<span>Space</span></a>
    <nav class="nav">
      <a href="index.html" class="nav-link" data-i18n="nav.home">Головна</a>
      <a href="gallery.html" class="nav-link" data-i18n="nav.gallery">Галерея</a>
      <a href="about.html" class="nav-link" data-i18n="nav.about">Про нас</a>
      <a href="contact.html" class="nav-link" data-i18n="nav.contacts">Контакти</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switcher">
        <button class="lang-current" id="lang-toggle">
          <span class="lang-flag">🇺🇦</span>
          <span class="lang-code">UA</span>
          <span class="lang-arrow">▾</span>
        </button>
        <div class="lang-dropdown" id="lang-dropdown">
          <button class="lang-opt" data-lang="uk">🇺🇦 Українська</button>
          <button class="lang-opt" data-lang="ru">🇷🇺 Русский</button>
          <button class="lang-opt" data-lang="en">🇬🇧 English</button>
          <button class="lang-opt" data-lang="es">🇪🇸 Español</button>
        </div>
      </div>
      <a href="cart.html" class="cart-btn">🛒 <span data-i18n="cart_btn">Кошик</span> <span class="cart-count">0</span></a>
      <button class="burger" aria-label="Меню"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<!-- CART PAGE -->
<main class="cart-page">
  <div class="container">
    <div class="cart-header-row">
      <h1 data-i18n="cart.title">Кошик</h1>
      <button class="cart-clear-btn" id="cart-clear" data-i18n="cart.clear">Очистити кошик</button>
    </div>
    <div class="cart-layout">
      <div id="cart-items"></div>
      <aside class="order-summary">
        <h2 data-i18n="cart.title">Ваш заказ</h2>
        <div class="summary-rows">
          <div class="summary-row">
            <span class="label" data-i18n="cart.w5">Робіт</span>
            <span id="summary-count">0</span>
          </div>
          <div class="summary-row">
            <span class="label" data-i18n="cart.subtotal">Сума</span>
            <span id="summary-subtotal">0 ₴</span>
          </div>
          <div class="summary-row">
            <span class="label" data-i18n="cart.delivery">Доставка</span>
            <span id="summary-delivery">500 ₴</span>
          </div>
          <div class="summary-row total">
            <span class="label" data-i18n="cart.total">Разом</span>
            <span id="summary-total">0 ₴</span>
          </div>
        </div>
        <button class="btn btn-primary checkout-btn" id="checkout-btn" data-i18n="cart.checkout">Оформити замовлення</button>
        <p class="secure-note" data-i18n="cart.secure">🔒 Безпечна оплата</p>
        <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px;" data-i18n="cart.note">Після оформлення...</p>
      </aside>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span data-i18n="footer.copy">© 2024 ArtSpace.</span>
      <a href="index.html" style="color:var(--accent-light)">← <span data-i18n="nav.home">Головна</span></a>
    </div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
