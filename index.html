<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>DrinkMate</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;--s1:#12121e;--s2:#1c1c2e;--s3:#252538;
  --border:rgba(255,255,255,.08);
  --t1:#f0f0f8;--t2:#9090b0;--t3:#50507a;
  --accent:#f59e0b;--ag:rgba(245,158,11,.3);
  --red:#ef4444;--blue:#3b82f6;--green:#22c55e;--purple:#a855f7;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-xl:30px;--r-f:9999px;
}
html,body{height:100%;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ── Screen transitions ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .3s,transform .3s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97)}

/* ── Onboarding ── */
.step{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px;overflow-y:auto;transition:opacity .25s,transform .25s}
.step.hidden{opacity:0;pointer-events:none;transform:translateX(40px)}
.onb-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;padding-top:max(8px,env(safe-area-inset-top))}
.logo{font-size:20px;font-weight:900}
.lang-row{display:flex;gap:6px}
.lp{background:var(--s2);border:1.5px solid var(--border);border-radius:var(--r-f);padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--t2);transition:all .15s}
.lp.on{background:var(--accent);color:#000;border-color:var(--accent)}
.onb-h{font-size:34px;font-weight:900;line-height:1.1;margin-bottom:10px;white-space:pre-line}
.onb-s{font-size:16px;color:var(--t2);line-height:1.5;margin-bottom:32px}
.fl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:9px}
.ti{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:15px 17px;font-size:17px;color:var(--t1);outline:none;transition:border-color .2s;margin-bottom:24px;font-family:inherit}
.ti:focus{border-color:var(--accent)}
.ti::placeholder{color:var(--t3)}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:32px}
.av-opt{aspect-ratio:1;background:var(--s2);border:2px solid var(--border);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all .15s}
.av-opt:hover{background:var(--s3);transform:scale(1.05)}
.av-opt.on{border-color:var(--accent);background:rgba(245,158,11,.15);transform:scale(1.08)}
.dk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:20px}
.dk-opt{background:var(--s2);border:2px solid var(--border);border-radius:var(--r-md);padding:9px 3px;text-align:center;cursor:pointer;transition:all .15s;font-size:11px;font-weight:700;color:var(--t2)}
.dk-opt:hover{background:var(--s3)}
.dk-opt.on{border-color:var(--accent);background:rgba(245,158,11,.12);color:var(--accent)}
.dk-opt .de{font-size:22px;display:block;margin-bottom:3px}
.am-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:26px}
.am-opt{background:var(--s2);border:2px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center;cursor:pointer;transition:all .15s;font-size:12px;font-weight:700;color:var(--t2)}
.am-opt:hover{background:var(--s3)}
.am-opt.on{border-color:var(--accent);background:rgba(245,158,11,.12);color:var(--t1)}
.vb-list{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
.vb-opt{background:var(--s2);border:2px solid var(--border);border-radius:var(--r-lg);padding:15px 17px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:all .15s}
.vb-opt:hover{background:var(--s3)}
.vb-opt.on{border-color:var(--accent);background:rgba(245,158,11,.08)}
.vb-opt[data-v="3"]{}.vb-opt[data-v="3"].on{border-color:var(--red);background:rgba(239,68,68,.08)}
.vb-icon{font-size:30px;width:40px;text-align:center;flex-shrink:0}
.vb-lbl{font-size:15px;font-weight:800;margin-bottom:2px}
.vb-desc{font-size:12px;color:var(--t2)}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--s3);transition:all .3s}
.dot.on{background:var(--accent);width:22px}
.spacer{flex:1}
.btn-main{width:100%;padding:17px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;border-radius:var(--r-lg);font-size:16px;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:-.2px;font-family:inherit}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,158,11,.35)}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Main app ── */
.app-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.hdr-logo{font-size:20px;font-weight:900}
.hdr-logo span{color:var(--accent)}
.hdr-acts{display:flex;gap:8px}
.ic-btn{width:38px;height:38px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--t1);transition:background .15s;flex-shrink:0}
.ic-btn:hover{background:var(--s3)}
.tab-c{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.tab-c.hidden{display:none}

/* ── Cards ── */
#card-stack{flex:1;position:relative;padding:2px 16px 0;overflow:hidden}
.card{position:absolute;inset:0 16px;border-radius:24px;overflow:hidden;cursor:grab;user-select:none;will-change:transform;box-shadow:0 20px 60px rgba(0,0,0,.65)}
.card:active{cursor:grabbing}
.card-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card-av{font-size:110px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));margin-bottom:50px}
.card-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.92) 82%,rgba(0,0,0,.98) 100%)}
.card-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{background:rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-f);padding:5px 11px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.badge-on{color:var(--green)}
.badge-on::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge-dist{color:var(--accent)}
.compat-badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border-radius:var(--r-f);padding:5px 13px;font-size:11px;font-weight:800;white-space:nowrap}
.card-bot{position:absolute;bottom:0;left:0;right:0;padding:18px 17px 16px}
.card-name-row{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.card-name{font-size:28px;font-weight:900;line-height:1}
.card-age{font-size:19px;font-weight:400;color:rgba(255,255,255,.65)}
.card-dk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:10px 13px;margin-bottom:9px}
.dk-em{font-size:24px}
.dk-det{flex:1}
.dk-nm{font-size:14px;font-weight:700}
.dk-am{font-size:12px;color:var(--accent);font-weight:600;margin-top:1px}
.vibe-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-f);border:1px solid rgba(255,255,255,.15)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.card-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 9px;font-size:11px}
.swipe-lbl{position:absolute;top:28px;font-size:26px;font-weight:900;border:3px solid;border-radius:10px;padding:5px 13px;opacity:0;pointer-events:none;z-index:10;text-transform:uppercase;letter-spacing:1px}
.swipe-lbl.yes{left:16px;color:var(--green);border-color:var(--green)}
.swipe-lbl.no{right:16px;color:var(--red);border-color:var(--red)}

/* ── Actions ── */
.act-bar{padding:8px 20px 6px;flex-shrink:0}
.cards-left-txt{text-align:center;font-size:11px;color:var(--t3);padding:2px 0 6px;font-weight:600}
.act-row{display:flex;justify-content:center;align-items:center;gap:10px}
.act-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.act-lbl{font-size:9px;font-weight:700;letter-spacing:.3px;color:var(--t3);text-transform:uppercase}
.ab{border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;flex-shrink:0}
.ab:active{transform:scale(.88)!important}
.ab-undo{width:50px;height:50px;font-size:19px;background:var(--s2);color:var(--accent);border:1px solid var(--border)}
.ab-nope{width:60px;height:60px;font-size:20px;background:var(--s2);color:var(--red);border:1px solid rgba(239,68,68,.2);box-shadow:0 4px 20px rgba(239,68,68,.12)}
.ab-cheers{width:76px;height:76px;font-size:26px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;box-shadow:0 6px 28px rgba(245,158,11,.4)}
.ab-super{width:60px;height:60px;font-size:19px;background:var(--s2);color:var(--blue);border:1px solid rgba(59,130,246,.2);box-shadow:0 4px 20px rgba(59,130,246,.12)}
.ab-boost{width:50px;height:50px;font-size:18px;background:var(--s2);color:var(--purple);border:1px solid rgba(168,85,247,.2)}
.ab:hover{transform:scale(1.06)}

/* Empty state */
#empty-state{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;padding:24px}
#empty-state .be{font-size:60px}
#empty-state h2{font-size:22px;font-weight:800}
#empty-state p{color:var(--t2);font-size:15px;max-width:250px;line-height:1.5}

/* ── Nav ── */
nav{display:flex;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,4px);flex-shrink:0;background:var(--bg)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 7px;border:none;background:none;color:var(--t3);font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:color .15s;position:relative}
.nav-btn .ni{font-size:21px}
.nav-btn.on{color:var(--accent)}
.nav-badge{position:absolute;top:5px;right:calc(50% - 15px);min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:8px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px}
.nav-badge.hidden{display:none}

/* ── Map ── */
#map-tab{flex:1;display:flex;flex-direction:column;overflow:hidden;gap:0;padding:4px 0 0}
.map-area{flex:1;position:relative;margin:0 16px;border-radius:var(--r-lg);overflow:hidden;background:var(--s1);min-height:0}
.map-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}
.map-pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.map-pin-inner{width:46px;height:46px;border-radius:50%;background:var(--s2);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .2s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.map-pin:hover .map-pin-inner{transform:scale(1.12)}
.map-pin-you .map-pin-inner{border-color:var(--blue)}
.map-pin-lbl{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:700;background:rgba(0,0,0,.75);border-radius:4px;padding:2px 5px;color:var(--accent)}
.map-pin-you .map-pin-lbl{color:var(--blue)}
.pulse-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(59,130,246,.3);animation:ring 2.5s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.map-list{padding:10px 16px;overflow-y:auto;flex-shrink:0;max-height:190px}
.ml-item{display:flex;align-items:center;gap:12px;padding:9px 12px;background:var(--s1);border-radius:var(--r-md);margin-bottom:6px;cursor:pointer;transition:background .15s;border:1px solid var(--border)}
.ml-item:hover{background:var(--s2)}
.ml-av{font-size:26px;width:38px;text-align:center}
.ml-info{flex:1;min-width:0}
.ml-name{font-weight:700;font-size:14px}
.ml-sub{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-dist{font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0}

/* ── Matches ── */
.mx-hdr{padding:6px 18px 10px;font-size:22px;font-weight:900;flex-shrink:0}
.mx-grid{flex:1;overflow-y:auto;padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.mx-card{background:var(--s1);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .15s;border:1px solid var(--border)}
.mx-card:hover{transform:scale(1.02)}
.mx-top{height:120px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.mx-dot{position:absolute;top:9px;right:9px;width:9px;height:9px;background:var(--green);border-radius:50%;border:2px solid var(--s1)}
.mx-body{padding:9px 11px 11px}
.mx-name{font-weight:800;font-size:14px;margin-bottom:3px}
.mx-dk{font-size:12px;color:var(--accent);font-weight:600}
.mx-dist{font-size:11px;color:var(--t3);margin-top:2px}
.mx-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--t2)}
.mx-empty .be{font-size:50px}

/* ── Profile ── */
#profile-tab{overflow-y:auto}
.pf-hero{display:flex;flex-direction:column;align-items:center;padding:20px 18px 14px;gap:8px}
.pf-av{font-size:78px}
.pf-name{font-size:26px;font-weight:900;text-align:center}
.pf-vibe{display:flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-f);padding:5px 13px;font-size:13px;font-weight:700}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);margin:0 16px 12px;border-radius:var(--r-lg);overflow:hidden}
.stat{background:var(--s1);padding:13px;text-align:center}
.stat-n{font-size:24px;font-weight:900;color:var(--accent)}
.stat-l{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
.pf-sec{margin:0 16px 12px;background:var(--s1);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border)}
.pf-row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.pf-row:last-child{border-bottom:none}
.pf-row:hover{background:var(--s2)}
.pf-ri{font-size:20px;width:26px;text-align:center}
.pf-rc{flex:1}
.pf-rl{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pf-rv{font-size:14px;font-weight:700;margin-top:2px}
.pf-arr{color:var(--t3);font-size:13px}

/* ── Match overlay ── */
#match-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:radial-gradient(ellipse at center,rgba(245,158,11,.1) 0%,rgba(0,0,0,.92) 65%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .3s}
#match-overlay.show{opacity:1;pointer-events:all}
.mo-fw{font-size:46px;line-height:1}
.mo-title{font-size:40px;font-weight:900;text-align:center}
.mo-title em{color:var(--accent);font-style:normal}
.mo-avs{display:flex;align-items:center;gap:6px}
.mo-av{width:96px;height:96px;border-radius:50%;background:var(--s2);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:48px}
.mo-sep{font-size:30px}
.mo-info{background:var(--s2);border:1px solid rgba(245,158,11,.25);border-radius:var(--r-xl);padding:14px 20px;text-align:center;width:100%;max-width:300px}
.mo-il{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.mo-idk{font-size:21px;font-weight:900;color:var(--accent);margin:5px 0 3px}
.mo-idist{font-size:13px;color:var(--t2)}
.mo-sub{font-size:15px;color:var(--t2);text-align:center}
.mo-btns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.btn-ol{background:var(--s2);border:1px solid var(--border);color:var(--t2);border-radius:var(--r-lg);padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;width:100%;font-family:inherit}
.btn-ol:hover{background:var(--s3)}

/* ── Settings sheet ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%) translateY(100%);background:var(--s1);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:95;transition:transform .35s cubic-bezier(.32,.72,0,1);padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sh-handle{width:36px;height:4px;background:var(--s3);border-radius:2px;margin:12px auto 18px}
.sh-title{font-size:18px;font-weight:800;padding:0 20px 14px}
.sh-sec{padding:0 20px 18px}
.sh-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:9px}
.lang-grid{display:flex;gap:8px}
.lg-opt{flex:1;background:var(--s2);border:2px solid var(--border);border-radius:var(--r-md);padding:10px 5px;text-align:center;cursor:pointer;transition:all .15s;font-size:12px;font-weight:700;color:var(--t2)}
.lg-opt .flag{font-size:22px;display:block;margin-bottom:3px}
.lg-opt:hover{background:var(--s3)}
.lg-opt.on{border-color:var(--accent);color:var(--t1);background:rgba(245,158,11,.1)}
.divider{height:1px;background:var(--border);margin:0 0 18px}
.btn-danger{width:100%;background:var(--s2);border:1px solid rgba(239,68,68,.25);color:var(--red);border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;font-family:inherit}
.btn-danger:hover{background:rgba(239,68,68,.1)}

/* ── Toast ── */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--s2);border:1px solid rgba(245,158,11,.25);border-radius:var(--r-lg);padding:11px 18px;font-size:14px;font-weight:700;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
</style>
</head>
<body>
<div id="app">

<!-- ══ ONBOARDING ══ -->
<div id="onb" class="screen">

  <!-- Step 1: Name + Avatar -->
  <div id="s1" class="step">
    <div class="onb-hdr">
      <div class="logo" id="lg1">DrinkMate 🍻</div>
      <div class="lang-row">
        <button class="lp" data-l="en" onclick="setLang('en')">EN</button>
        <button class="lp" data-l="uk" onclick="setLang('uk')">UK</button>

// ── Cards ─────────────────────────────────────────────────────────
function buildCards() {
  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';
  cardEls = [];

  const remaining = PROFILES.slice(idx);
  const visible = remaining.slice(0, 3);

  if (visible.length === 0) { showEmpty(); return; }

  visible.forEach((p, i) => {
    const card = makeCard(p, i);
    addDrag(card, idx + i, p);
    stack.appendChild(card);
    cardEls.push(card);
  });

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('card-stack').style.display = '';
  document.querySelectorAll('.act-bar,.act-row').forEach(e => e.style.display = '');
  updateCardsLeft();
}

function makeCard(p, stackPos) {
  const d = dk(p.drink);
  const compat = calcCompat(p);
  const cc = compatColor(compat);
  const vib = VIBES[p.vibe];
  const scale = 1 - stackPos * 0.035;
  const yOff = stackPos * 10;

  const card = document.createElement('div');
  card.className = 'card';
  card.style.cssText = `z-index:${20-stackPos};transform:scale(${scale}) translateY(${yOff}px);transition:transform .25s ease`;
  if (p.vibe === 3) card.style.boxShadow = '0 20px 60px rgba(0,0,0,.65), 0 0 0 2px rgba(239,68,68,.4)';

  const ln = L();
  const amtLabel = ln.amounts[p.amount] || '';

  card.innerHTML = `
    <div class="card-bg" style="background:linear-gradient(155deg,${d.g[0]},${d.g[1]})">
      <div class="card-av">${p.avatar}</div>
    </div>
    <div class="card-grad"></div>
    <div class="card-top">
      <div class="badge ${p.online?'badge-on':''}">${p.online?ln.online:ln.recently}</div>
      <div class="badge badge-dist">📍 ${fmtDist(p.dist)}</div>
    </div>
    <div class="compat-badge" style="color:${cc}">${ln.compat} ${compat}%</div>
    <div class="swipe-lbl yes">${ln.cheers}</div>
    <div class="swipe-lbl no">${ln.nope}</div>
    <div class="card-bot">
      <div class="card-name-row">
        <span class="card-name">${p.name}</span>
        <span class="card-age">${p.age} ${ln.yo}</span>
      </div>
      <div class="card-dk">
        <span class="dk-em">${d.emoji}</span>
        <div class="dk-det">
          <div class="dk-nm">${dkName(p)}</div>
          <div class="dk-am">${amtLabel}</div>
        </div>
        <div class="vibe-chip" style="color:${vib.color};border-color:${vib.color}40">
          ${vib.label} ${ln.vibes[p.vibe].label}
        </div>
      </div>
      <div class="card-tags">${p.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
    </div>
  `;
  return card;
}

function updateBackCards() {
  cardEls.forEach((c, i) => {
    c.style.transition = 'transform .25s ease';
    const scale = 1 - i * 0.035;
    const y = i * 10;
    c.style.transform = `scale(${scale}) translateY(${y}px)`;
  });
  if (cardEls.length < 3 && idx + cardEls.length < PROFILES.length) {
    buildCards();
  }
}

function addDrag(card, pIdx, profile) {
  const onStart = (e) => {
    if (card !== cardEls[0]) return;
    dragging = true; activeEl = card;
    startX = e.touches?e.touches[0].clientX:e.clientX;
    startY = e.touches?e.touches[0].clientY:e.clientY;
    dragX = 0;
    card.style.transition = 'none';
  };

  const onMove = (e) => {
    if (!dragging || activeEl !== card) return;
    const x = (e.touches?e.touches[0].clientX:e.clientX) - startX;
    const y = (e.touches?e.touches[0].clientY:e.clientY) - startY;
    dragX = x;
    card.style.transform = `translateX(${x}px) translateY(${y*.25}px) rotate(${x*.07}deg)`;
    const yes = card.querySelector('.swipe-lbl.yes');
    const no = card.querySelector('.swipe-lbl.no');
    const pct = Math.min(Math.abs(x)/100, 1);
    if (x > 15) { yes.style.opacity = pct; no.style.opacity = 0; }
    else if (x < -15) { no.style.opacity = pct; yes.style.opacity = 0; }
    else { yes.style.opacity = 0; no.style.opacity = 0; }
  };

  const onEnd = () => {
    if (!dragging || activeEl !== card) return;
    dragging = false; activeEl = null;
    card.style.transition = 'transform .3s ease-out';
    if (dragX > 80) flyOut(card, 'right', pIdx, profile);
    else if (dragX < -80) flyOut(card, 'left', pIdx, profile);
    else {
      card.style.transform = `scale(1) translateY(0)`;
      card.querySelectorAll('.swipe-lbl').forEach(l => l.style.opacity = 0);
    }
  };

  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function flyOut(card, dir, pIdx, profile) {
  const x = dir === 'right' ? 700 : -700;
  card.style.transition = 'transform .38s cubic-bezier(.55,0,1,.5), opacity .38s';
  card.style.transform = `translateX(${x}px) rotate(${dir==='right'?25:-25}deg)`;
  card.style.opacity = '0';

  swipeHistory.push({dir, pIdx, profile, card});

  totalSwipes++;
  localStorage.setItem('dm_sw', totalSwipes);

  setTimeout(() => {
    card.remove();
    cardEls.shift();
    idx++;

    if (dir === 'right' || dir === 'super') {
      matches.push({...profile, superLiked: dir==='super'});
      localStorage.setItem('dm_matches', JSON.stringify(matches));
      updateNavBadge();
      setTimeout(() => showMatch(profile), 200);
    } else {
      updateBackCards();
      if (idx >= PROFILES.length) showEmpty();
      updateCardsLeft();
    }
  }, 360);
}

function swipeCard(dir) {
  if (cardEls.length === 0) return;
  const p = PROFILES[idx];
  if (!p) return;
  if (dir === 'super') {
    superCount++;
    localStorage.setItem('dm_su', superCount);
    showToast(L().superToast);
  }
  flyOut(cardEls[0], dir, idx, p);
}

function undoSwipe() {
  if (swipeHistory.length === 0) { showToast(L().noUndo); return; }
  const last = swipeHistory.pop();
  idx = last.pIdx;
  totalSwipes = Math.max(0, totalSwipes - 1);
  localStorage.setItem('dm_sw', totalSwipes);
  if (last.dir !== 'left') {
    matches = matches.filter(m => m.id !== last.profile.id);
    localStorage.setItem('dm_matches', JSON.stringify(matches));
    updateNavBadge();
  }
  buildCards();
  showToast(L().undoToast);
}

function showEmpty() {
  document.getElementById('card-stack').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('clTxt').textContent = '';
}

function resetCards() {
  idx = 0;
  swipeHistory = [];
  document.getElementById('card-stack').style.display = '';
  document.getElementById('empty-state').style.display = 'none';
  buildCards();
}

function updateCardsLeft() {
  const rem = Math.max(0, PROFILES.length - idx);
  document.getElementById('clTxt').textContent = rem > 0 ? L().xLeft(rem) : '';
}

  document.getElementById('moDist').textContent = `📍 ${fmtDist(profile.dist)} ${l.away}`;
  document.getElementById('btnSendMsg').textContent = l.sendMsg;
  document.getElementById('btnKeep').textContent = l.keepSwiping;

function closeMatch() {
  document.getElementById('match-overlay').classList.remove('show');
  if (idx >= PROFILES.length) showEmpty();
  updateCardsLeft();

// ── Map ──────────────────────────────────────────────────────────
function renderMap() {
  const pins = document.getElementById('mapPins');
  const list = document.getElementById('mapList');
  const area = document.getElementById('mapArea');
  pins.innerHTML = ''; list.innerHTML = '';

  const positions = [
    {x:50,y:50},
    {x:28,y:32},{x:72,y:28},{x:62,y:65},{x:33,y:68},
    {x:80,y:52},{x:20,y:58},{x:55,y:22},{x:42,y:75},
  ];

  // You
  const you = document.createElement('div');
  you.className = 'map-pin map-pin-you';
  you.style.cssText = `left:50%;top:50%`;
  you.innerHTML = `<div class="pulse-ring"></div><div class="map-pin-inner">${user?.avatar||'🧑'}</div><div class="map-pin-lbl">${L().you}</div>`;
  pins.appendChild(you);

  PROFILES.slice(0,8).forEach((p,i) => {
    const pos = positions[i+1];
    const pin = document.createElement('div');
    pin.className = 'map-pin';
    pin.style.cssText = `left:${pos.x}%;top:${pos.y}%`;
    const vc = VIBES[p.vibe].color;
    pin.innerHTML = `<div class="map-pin-inner" style="border-color:${vc};font-size:22px">${p.avatar}</div><div class="map-pin-lbl">${p.name}</div>`;
    pin.onclick = () => showToast(`${dk(p.drink).emoji} ${p.name} · ${dkName(p)} · ${fmtDist(p.dist)}`);
    pins.appendChild(pin);

    const item = document.createElement('div');
    item.className = 'ml-item';
    item.innerHTML = `<div class="ml-av">${p.avatar}</div><div class="ml-info"><div class="ml-name">${p.name}, ${p.age}</div><div class="ml-sub">${dk(p.drink).emoji} ${dkName(p)} · ${L().amounts[p.amount]}</div></div><div class="ml-dist">${fmtDist(p.dist)}</div>`;
    item.onclick = () => showToast(`📍 ${p.name} — ${fmtDist(p.dist)} ${L().away}`);
    list.appendChild(item);
  });
}

// ── Matches ──────────────────────────────────────────────────────
function renderMatches() {
  const grid = document.getElementById('mxGrid');

  const hdr = document.getElementById('mxHdr');
  hdr.textContent = L().matchesTitle;
  grid.innerHTML = '';

  if (matches.length === 0) {
    grid.style.display = 'none';
    empty.classList.remove('hidden');
    empty.style.display = 'flex';
    document.getElementById('mxEmTit').textContent = L().noMatchesTit;
    document.getElementById('mxEmSub').textContent = L().noMatchesSub;
    return;
  }
  empty.classList.add('hidden');
  empty.style.display = 'none';
  grid.style.display = '';

  matches.forEach(p => {
    const d = dk(p.drink);
    const c = document.createElement('div');
    c.className = 'mx-card';
    c.innerHTML = `
      <div class="mx-top" style="background:linear-gradient(135deg,${d.g[0]},${d.g[1]})">

        <div class="mx-name">${p.name}, ${p.age}</div>
        <div class="mx-dk">${d.emoji} ${dkName(p)}</div>
        <div class="mx-dist">📍 ${fmtDist(p.dist)}</div>
      </div>`;
    c.onclick = () => showToast(`💬 ${p.name}: "${L().sendMsg.replace('👋','')}"? ${L().keepSwiping}...`);
    grid.appendChild(c);
  });
}

function updateNavBadge() {
  const b = document.getElementById('navBadge');

  if (matches.length > 0) {
    b.textContent = matches.length;
    b.classList.remove('hidden');

}

  if (!confirm(L().resetData + '?')) return;
  localStorage.clear();
  location.reload();
}

// ── Tabs ──────────────────────────────────────────────────────────
const TABS = ['swipe','map','matches','profile'];
function switchTab(tab) {
  TABS.forEach(t => {
    const el = document.getElementById(t === 'swipe' ? 'swipe-tab' : t + '-tab');
    const nav = document.getElementById('n' + (t==='swipe'?'Find':t.charAt(0).toUpperCase()+t.slice(1)));
    if (el) el.classList.toggle('hidden', t !== tab);
    if (nav) nav.classList.toggle('on', t === tab);
  });
  if (tab === 'map') renderMap();
  if (tab === 'matches') renderMatches();
  if (tab === 'profile') renderProfile();
}

// ── Toast ─────────────────────────────────────────────────────────
let toastT;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

  }
})();
