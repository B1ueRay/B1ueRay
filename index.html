<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>БухМет — знайди з ким випити</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #222;
      --accent: #f5a623;
      --accent2: #e8441a;
      --green: #2ecc71;
      --text: #f0f0f0;
      --muted: #888;
      --card-radius: 20px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── App shell ── */
    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 420px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      background: var(--bg);
      z-index: 10;
      flex-shrink: 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--accent); }

    .header-right { display: flex; gap: 14px; align-items: center; }

    .icon-btn {
      background: var(--surface);
      border: none;
      color: var(--text);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: var(--surface2); }

    .notif-dot {
      position: relative;
    }
    .notif-dot::after {
      content: '';
      position: absolute;
      top: 6px; right: 6px;
      width: 8px; height: 8px;
      background: var(--accent2);
      border-radius: 50%;
      border: 2px solid var(--bg);
    }

    /* ── Tab bar ── */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 20px 12px;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
      color: var(--muted);
    }

    .tab.active {
      background: var(--accent);
      color: #000;
    }

    /* ── Card stack ── */
    #card-stack {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 0 16px;
    }

    .card {
      position: absolute;
      inset: 0 16px;
      border-radius: var(--card-radius);
      overflow: hidden;
      cursor: grab;
      user-select: none;
      will-change: transform;
      transition: transform 0.08s ease-out;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .card:active { cursor: grabbing; }

    .card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
    }

    .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0,0,0,0.3) 60%,
        rgba(0,0,0,0.95) 100%
      );
    }

    .card-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 20px 20px;
    }

    .card-top-badges {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .online-badge {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      display: flex; align-items: center; gap: 5px;
    }

    .online-badge::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .distance-badge {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
    }

    .card-name {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .card-age {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .drink-info {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .drink-emoji { font-size: 26px; }

    .drink-text { flex: 1; }

    .drink-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .drink-name {
      font-size: 15px;
      font-weight: 700;
    }

    .drink-amount {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text);
    }

    /* ── Swipe feedback labels ── */
    .swipe-label {
      position: absolute;
      top: 40px;
      font-size: 34px;
      font-weight: 900;
      border: 4px solid;
      border-radius: 12px;
      padding: 6px 16px;
      opacity: 0;
      transform: rotate(-15deg);
      pointer-events: none;
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: opacity 0.1s;
    }

    .swipe-label.yes {
      left: 20px;
      color: var(--green);
      border-color: var(--green);
      transform: rotate(-15deg);
    }

    .swipe-label.no {
      right: 20px;
      color: var(--accent2);
      border-color: var(--accent2);
      transform: rotate(15deg);
    }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 14px 20px 10px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    .action-btn:active { transform: scale(0.92) !important; }

    .btn-nope {
      width: 60px; height: 60px;
      background: var(--surface);
      color: var(--accent2);
      box-shadow: 0 4px 20px rgba(232,68,26,0.2);
    }

    .btn-nope:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(232,68,26,0.35); }

    .btn-cheers {
      width: 74px; height: 74px;
      background: linear-gradient(135deg, var(--accent), #e8961a);
      color: #000;
      box-shadow: 0 6px 28px rgba(245,166,35,0.45);
    }

    .btn-cheers:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(245,166,35,0.6); }

    .btn-super {
      width: 60px; height: 60px;
      background: var(--surface);
      color: #3498db;
      box-shadow: 0 4px 20px rgba(52,152,219,0.2);
    }

    .btn-super:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(52,152,219,0.35); }

    /* ── Bottom nav ── */
    nav {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 0 14px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .nav-item .nav-icon { font-size: 22px; }
    .nav-item.active { color: var(--accent); }

    /* ── Match overlay ── */
    #match-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 24px;
    }

    #match-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .match-title {
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
    }

    .match-title span { color: var(--accent); }

    .match-subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      max-width: 280px;
    }

    .match-avatars {
      display: flex;
      align-items: center;
      gap: -16px;
    }

    .match-avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      overflow: hidden;
      background-size: cover;
      background-position: center top;
    }

    .match-avatar + .match-avatar { margin-left: -20px; }

    .match-emoji {
      font-size: 40px;
      z-index: 1;
      background: var(--bg);
      border-radius: 50%;
      width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid var(--accent);
    }

    .match-drink-info {
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 20px;
      text-align: center;
      width: 100%;
      max-width: 300px;
      border: 1px solid rgba(245,166,35,0.2);
    }

    .match-drink-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .match-drink-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .match-dist {
      font-size: 13px;
      color: var(--muted);
    }

    .match-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #e8961a);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(245,166,35,0.4);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: var(--surface2); }

    /* ── Empty state ── */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }

    #empty-state .big-emoji { font-size: 64px; }

    #empty-state h2 { font-size: 22px; font-weight: 800; }

    #empty-state p { color: var(--muted); font-size: 15px; max-width: 260px; line-height: 1.5; }

    #empty-state .btn-primary { max-width: 260px; }

    /* ── Map view ── */
    #map-view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .map-placeholder {
      flex: 1;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      margin: 0 16px;
    }

    .map-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .map-dot {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background-size: cover;
      background-position: center top;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 0 0 6px rgba(245,166,35,0.15);
    }

    .map-dot:hover { transform: scale(1.1); }

    .map-dot.you {
      border-color: #3498db;
      box-shadow: 0 0 0 6px rgba(52,152,219,0.2);
      z-index: 2;
    }

    .map-label {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(0,0,0,0.7);
      border-radius: 6px;
      padding: 2px 6px;
    }

    .map-label.you-label { color: #3498db; }

    .map-you-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(52,152,219,0.4);
      animation: ring 2s infinite;
    }

    @keyframes ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .map-list {
      padding: 12px 16px;
      overflow-y: auto;
      max-height: 200px;
    }

    .map-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: var(--surface);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .map-list-item:hover { background: var(--surface2); }

    .map-list-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background-size: cover;
      background-position: center top;
      flex-shrink: 0;
    }

    .map-list-info { flex: 1; }

    .map-list-name { font-weight: 700; font-size: 14px; }

    .map-list-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .map-list-dist {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ── Matches view ── */
    #matches-view {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .matches-title {
      padding: 8px 20px 12px;
      font-size: 22px;
      font-weight: 800;
    }

    .matches-grid {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-content: start;
    }

    .match-card {
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .match-card:hover { transform: scale(1.02); }

    .match-card-img {
      height: 140px;
      background-size: cover;
      background-position: center top;
      position: relative;
    }

    .match-card-online {
      position: absolute;
      top: 8px; right: 8px;
      width: 10px; height: 10px;
      background: var(--green);
      border-radius: 50%;
      border: 2px solid var(--surface);
    }

    .match-card-body { padding: 10px 12px 12px; }

    .match-card-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }

    .match-card-drink { font-size: 12px; color: var(--accent); }

    .match-card-dist { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .empty-matches {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    .empty-matches .big-emoji { font-size: 48px; }

    /* ── Notification toast ── */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--surface);
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 90vw;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">Бух<span>Мет</span> 🍺</div>
    <div class="header-right">
      <button class="icon-btn notif-dot" onclick="showToast('🔔 3 нових матчі поруч!')">🔔</button>
      <button class="icon-btn" onclick="showToast('⚙️ Налаштування скоро...')">⚙️</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('swipe', this)">Знайти</button>
    <button class="tab" onclick="switchTab('map', this)">Карта</button>
    <button class="tab" onclick="switchTab('matches', this)">Матчі</button>
  </div>

  <!-- ── SWIPE VIEW ── -->
  <div id="swipe-view" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div id="card-stack"></div>

    <div id="empty-state">
      <div class="big-emoji">😴</div>
      <h2>Поруч нікого нема</h2>
      <p>Усі або вже знайшли з ким бухати, або сплять. Спробуй пізніше!</p>
      <button class="btn-primary" onclick="resetCards()">🔄 Оновити</button>
    </div>

    <div class="actions" id="action-buttons">
      <button class="action-btn btn-nope" onclick="swipeCard('left')" title="Пропустити">❌</button>
      <button class="action-btn btn-cheers" onclick="swipeCard('right')" title="Пити разом!">🥂</button>
      <button class="action-btn btn-super" onclick="swipeCard('super')" title="Дуже хочу!">⭐</button>
    </div>
  </div>

  <!-- ── MAP VIEW ── -->
  <div id="map-view">
    <div class="map-placeholder">
      <div class="map-grid"></div>
      <div id="map-dots"></div>
    </div>
    <div class="map-list" id="map-list"></div>
  </div>

  <!-- ── MATCHES VIEW ── -->
  <div id="matches-view">
    <div class="matches-title">Твої матчі 🎉</div>
    <div class="matches-grid" id="matches-grid"></div>
  </div>

  <nav>
    <button class="nav-item active" onclick="switchTab('swipe', null, this)">
      <span class="nav-icon">🃏</span>
      Знайти
    </button>
    <button class="nav-item" onclick="switchTab('map', null, this)">
      <span class="nav-icon">📍</span>
      Карта
    </button>
    <button class="nav-item" onclick="switchTab('matches', null, this)">
      <span class="nav-icon">💬</span>
      Матчі
    </button>
  </nav>

</div>

<!-- ── MATCH OVERLAY ── -->
<div id="match-overlay">
  <div class="match-title">Це <span>матч!</span> 🎉</div>
  <div class="match-subtitle" id="match-subtitle"></div>
  <div class="match-avatars">
    <div class="match-avatar" id="match-you" style="background-image:url('https://api.dicebear.com/7.x/avataaars/svg?seed=you&backgroundColor=b6e3f4')"></div>
    <div class="match-emoji">🍻</div>
    <div class="match-avatar" id="match-them"></div>
  </div>
  <div class="match-drink-info">
    <div class="match-drink-label">Буде пити</div>
    <div class="match-drink-name" id="match-drink-name"></div>
    <div class="match-dist" id="match-drink-dist"></div>
  </div>
  <div class="match-actions">
    <button class="btn-primary" onclick="closeMatch()">📱 Написати «Де зустрічаємось?»</button>
    <button class="btn-secondary" onclick="closeMatch()">Продовжити шукати</button>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<script>
const AVATARS = [
  'https://api.dicebear.com/7.x/avataaars/svg?seed=alpha&backgroundColor=c0aede&hair=short01&eyes=happy',
  'https://api.dicebear.com/7.x/avataaars/svg?seed=beta&backgroundColor=d1f4d1&hair=dreads01',
  'https://api.dicebear.com/7.x/avataaars/svg?seed=gamma&backgroundColor=ffd5dc&hair=bob',
  'https://api.dicebear.com/7.x/avataaars/svg?seed=delta&backgroundColor=ffd93d',
  'https://api.dicebear.com/7.x/avataaars/svg?seed=epsilon&backgroundColor=c9e4ff',

let cards = [];
let currentIndex = 0;
let matches = [];
let isDragging = false;
let startX = 0, startY = 0, currentX = 0;
let activeCard = null;

function buildCards() {
  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';
  cards = [];

  const profiles = [...PROFILES].slice(currentIndex);
  const visible = profiles.slice(0, 3);

  visible.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.zIndex = 10 - i;
    const scale = 1 - i * 0.04;
    const yOffset = i * 10;
    card.style.transform = `scale(${scale}) translateY(${yOffset}px)`;

    card.innerHTML = `
      <div class="card-bg" style="background:${p.bg}">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:30px">
          <img src="${p.avatar}" style="width:200px;height:200px;object-fit:cover" alt="${p.name}" />
        </div>
      </div>
      <div class="card-gradient"></div>
      <div class="card-top-badges">
        <div class="online-badge">${p.online ? 'Онлайн' : 'Нещодавно'}</div>
        <div class="distance-badge">📍 ${p.dist}</div>
      </div>
      <div class="swipe-label yes">Бухати!</div>
      <div class="swipe-label no">Пас</div>
      <div class="card-content">
        <div class="card-name">${p.name}</div>
        <div class="card-age">${p.age} років</div>
        <div class="drink-info">
          <div class="drink-emoji">${p.drinkEmoji}</div>
          <div class="drink-text">
            <div class="drink-label">Буде пити</div>
            <div class="drink-name">${p.drink}</div>
            <div class="drink-amount">${p.amount}</div>
          </div>
        </div>
        <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
    `;

    addDragListeners(card, currentIndex + i, p);
    stack.appendChild(card);
    cards.push(card);
  });
}

function addDragListeners(card, idx, profile) {
  let startTime;

  const onStart = (e) => {
    if (card !== cards[0]) return;
    isDragging = true;
    activeCard = card;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    currentX = 0;
    startTime = Date.now();
    card.style.transition = 'none';
  };

  const onMove = (e) => {
    if (!isDragging || activeCard !== card) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
    currentX = x;
    const rotate = x * 0.08;
    card.style.transform = `translateX(${x}px) translateY(${y * 0.3}px) rotate(${rotate}deg)`;

    const yesLabel = card.querySelector('.swipe-label.yes');
    const noLabel = card.querySelector('.swipe-label.no');
    const pct = Math.abs(x) / 120;
    if (x > 20) { yesLabel.style.opacity = Math.min(pct, 1); noLabel.style.opacity = 0; }
    else if (x < -20) { noLabel.style.opacity = Math.min(pct, 1); yesLabel.style.opacity = 0; }
    else { yesLabel.style.opacity = 0; noLabel.style.opacity = 0; }
  };

  const onEnd = () => {
    if (!isDragging || activeCard !== card) return;
    isDragging = false;
    activeCard = null;
    card.style.transition = 'transform 0.3s ease-out';

    if (currentX > 80) {
      flyOut(card, 'right', idx, profile);
    } else if (currentX < -80) {
      flyOut(card, 'left', idx, profile);
    } else {
      card.style.transform = 'scale(1) translateY(0)';
      const yesLabel = card.querySelector('.swipe-label.yes');
      const noLabel = card.querySelector('.swipe-label.no');
      yesLabel.style.opacity = 0;
      noLabel.style.opacity = 0;
    }
  };

  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function flyOut(card, dir, idx, profile) {
  const x = dir === 'right' ? 600 : -600;
  card.style.transition = 'transform 0.4s cubic-bezier(0.55,0,1,0.45), opacity 0.4s';
  card.style.transform = `translateX(${x}px) rotate(${dir === 'right' ? 30 : -30}deg)`;
  card.style.opacity = '0';

  setTimeout(() => {
    card.remove();
    cards.shift();
    currentIndex++;

    if (dir === 'right') {
      matches.push(profile);
      setTimeout(() => showMatch(profile), 250);
    } else {
      updateBackCards();
      if (currentIndex >= PROFILES.length) showEmpty();
    }
  }, 380);
}

function updateBackCards() {
  cards.forEach((c, i) => {
    c.style.transition = 'transform 0.3s ease';
    const scale = 1 - i * 0.04;
    const y = i * 10;
    c.style.transform = `scale(${scale}) translateY(${y}px)`;
  });

  if (currentIndex < PROFILES.length && cards.length < 3) {
    const needed = Math.min(3 - cards.length, PROFILES.length - currentIndex - (cards.length ? 0 : 0));
    buildCards();
  }
}

function swipeCard(dir) {
  if (cards.length === 0) return;
  const idx = currentIndex;
  const profile = PROFILES[idx];
  const card = cards[0];

  if (dir === 'super') {
    showToast(`⭐ Супер-лайк для ${profile.name}!`);
    flyOut(card, 'right', idx, profile);
  } else {
    flyOut(card, dir, idx, profile);
  }
}

function showEmpty() {
  document.getElementById('card-stack').style.display = 'none';
  document.getElementById('action-buttons').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
}

function resetCards() {
  currentIndex = 0;
  document.getElementById('card-stack').style.display = '';
  document.getElementById('action-buttons').style.display = '';
  document.getElementById('empty-state').style.display = 'none';
  buildCards();
}

function showMatch(profile) {
  document.getElementById('match-them').style.backgroundImage = `url('${profile.avatar}')`;
  document.getElementById('match-drink-name').textContent = `${profile.drinkEmoji} ${profile.drink} · ${profile.amount}`;
  document.getElementById('match-drink-dist').textContent = `📍 ${profile.dist} від тебе`;
  document.getElementById('match-subtitle').textContent = `${profile.name} теж хоче випити з тобою!`;
  document.getElementById('match-overlay').classList.add('show');
  updateBackCards();
}

function closeMatch() {
  document.getElementById('match-overlay').classList.remove('show');
  if (currentIndex >= PROFILES.length) showEmpty();
  renderMatchesGrid();
}

// ── Map view ──
function renderMap() {
  const dotsEl = document.getElementById('map-dots');
  const listEl = document.getElementById('map-list');
  dotsEl.innerHTML = '';
  listEl.innerHTML = '';

  const positions = [
    { x: 50, y: 50 },
    { x: 25, y: 35 }, { x: 70, y: 25 },
    { x: 60, y: 65 }, { x: 35, y: 70 },
    { x: 80, y: 50 }, { x: 20, y: 60 },
  ];

  // You
  const youDot = document.createElement('div');
  youDot.className = 'map-dot you';
  youDot.style.left = `${positions[0].x}%`;
  youDot.style.top = `${positions[0].y}%`;
  youDot.style.transform = 'translate(-50%,-50%)';
  youDot.innerHTML = `<div class="pulse-ring"></div><div class="map-you-icon">🫵</div><div class="map-label you-label">Ти</div>`;
  dotsEl.appendChild(youDot);

  PROFILES.slice(0, 6).forEach((p, i) => {
    const pos = positions[i + 1];
    const dot = document.createElement('div');
    dot.className = 'map-dot';
    dot.style.left = `${pos.x}%`;
    dot.style.top = `${pos.y}%`;
    dot.style.transform = 'translate(-50%,-50%)';
    dot.style.backgroundImage = `url('${p.avatar}')`;
    dot.innerHTML = `<div class="map-label">${p.name}</div>`;
    dot.onclick = () => showToast(`${p.drinkEmoji} ${p.name} · ${p.drink} · ${p.dist}`);
    dotsEl.appendChild(dot);

    const item = document.createElement('div');
    item.className = 'map-list-item';
    item.innerHTML = `
      <div class="map-list-avatar" style="background-image:url('${p.avatar}');background-color:${BG_COLORS[i%BG_COLORS.length].split('#')[1]?.split(',')[0] || '#333'}"></div>
      <div class="map-list-info">
        <div class="map-list-name">${p.name}, ${p.age}</div>
        <div class="map-list-sub">${p.drinkEmoji} ${p.drink} · ${p.amount}</div>
      </div>
      <div class="map-list-dist">${p.dist}</div>
    `;
    item.onclick = () => showToast(`📍 ${p.name} — ${p.dist} від тебе!`);
    listEl.appendChild(item);
  });
}

// ── Matches grid ──
function renderMatchesGrid() {
  const grid = document.getElementById('matches-grid');
  if (matches.length === 0) {
    grid.parentElement.innerHTML = `
      <div class="matches-title">Твої матчі 🎉</div>
      <div class="empty-matches" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;text-align:center;padding:20px;color:var(--muted)">

        <div style="font-weight:700;font-size:16px;color:var(--text)">Ще немає матчів</div>
        <div style="font-size:14px;max-width:220px;line-height:1.5">Свайпай праворуч — і скоро знайдеш з ким бухати!</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = '';
  matches.forEach(p => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="match-card-img" style="background-image:url('${p.avatar}');background-color:${['#1a2a1a','#1a1a2a','#2a1a1a'][Math.floor(Math.random()*3)]}">
        ${p.online ? '<div class="match-card-online"></div>' : ''}

      <div class="match-card-body">
        <div class="match-card-name">${p.name}, ${p.age}</div>
        <div class="match-card-drink">${p.drinkEmoji} ${p.drink}</div>
        <div class="match-card-dist">📍 ${p.dist}</div>
      </div>
    `;
    card.onclick = () => showToast(`💬 Написати ${p.name}? Скоро буде чат!`);
    grid.appendChild(card);
  });
}

// ── Tabs ──
function switchTab(tab, tabBtn, navBtn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  if (tabBtn) tabBtn.classList.add('active');
  if (navBtn) navBtn.classList.add('active');

  // Sync both if only one provided
  const tabBtns = document.querySelectorAll('.tab');
  const navBtns = document.querySelectorAll('.nav-item');
  const idx = ['swipe','map','matches'].indexOf(tab);
  if (idx >= 0) {
    tabBtns[idx]?.classList.add('active');
    navBtns[idx]?.classList.add('active');
  }

  document.getElementById('swipe-view').style.display = tab === 'swipe' ? 'flex' : 'none';
  document.getElementById('map-view').style.display = tab === 'map' ? 'flex' : 'none';
  document.getElementById('matches-view').style.display = tab === 'matches' ? 'flex' : 'none';

  if (tab === 'map') renderMap();
  if (tab === 'matches') renderMatchesGrid();
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Init ──
buildCards();
switchTab('swipe');
