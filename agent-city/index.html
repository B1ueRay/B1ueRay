<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Город агентов B1ueRay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D night city; glass HUD pinned to the edges — brand + metrics on top, task feed bottom-left, team panel on the right, command bar along the bottom. */
:root {
  --ink: #070b1a;
  --glass: rgba(10, 16, 36, 0.88);
  --glass-hi: rgba(16, 25, 56, 0.92);
  --line: rgba(124, 156, 236, 0.22);
  --fg: #e7edff;
  --muted: #93a0c9;
  --ray: #4da3ff;
  --ray-hi: #9ad8ff;
  --warm: #ffc46b;
  --ok: #5be49b;
  --warn: #ffb547;
  --busy: #6fe7ff;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; }

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ray-hi); outline-offset: 2px; }

/* ---------- building labels ---------- */
.lbl {
  --c: var(--ray);
  pointer-events: none;
  will-change: transform;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px 5px 8px;
  border-radius: 7px;
  background: rgba(6, 10, 24, 0.82);
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--c) 30%, transparent);
  color: var(--fg);
  font-family: var(--f-display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  user-select: none;
  transition: transform 0.2s ease, background 0.2s ease;
}
.lbl.is-hover, .lbl.is-focus, .lbl:focus-visible { background: rgba(16, 26, 60, 0.95); }
.lbl i { font-style: normal; font-family: var(--f-mono); font-size: 9.5px; min-width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 30%, transparent); color: var(--fg); }
.lbl.boss { --c: #ffd36b; font-size: 12px; padding: 6px 12px 6px 9px; box-shadow: 0 0 26px rgba(255, 211, 107, 0.45); }
.stamp-wrap { pointer-events: none; }
.stamp { display: grid; justify-items: center; padding: 8px 16px 10px; border: 3px solid var(--ok); border-radius: 14px; background: rgba(6, 24, 18, 0.82); color: var(--ok); transform: scale(0.2) rotate(-9deg); opacity: 0; transition: transform 0.35s cubic-bezier(.2, 1.6, .4, 1), opacity 0.25s ease; box-shadow: 0 0 40px rgba(91, 228, 155, 0.45); }
.stamp.show { transform: scale(1) rotate(-9deg); opacity: 1; }
.stamp b { font-family: var(--f-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stamp span { font-family: var(--f-display); font-size: 11px; letter-spacing: 0.22em; }
.inbox { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.inbox li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; padding: 8px 10px; border-radius: 9px; background: rgba(255, 211, 107, 0.07); }
.inbox li b { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox li em { font-style: normal; font-family: var(--f-display); color: var(--ok); font-variant-numeric: tabular-nums; }
.inbox li span { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.btn.p-toggle { display: none; margin-left: auto; }
.lbl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: 0.55; }
.lbl.is-busy .dot { opacity: 1; animation: pulse 1s ease-in-out infinite; }
.lbl small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.lbl.project { font-size: 10px; padding: 3px 8px; border-style: dashed; box-shadow: none; }
@keyframes pulse { 50% { transform: scale(1.6); box-shadow: 0 0 10px var(--c); } }

/* ---------- HUD grid ---------- */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-columns: minmax(0, 360px) minmax(0, 1fr) minmax(0, 370px);
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud > * { pointer-events: auto; min-width: 0; }
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r);
}

/* top bar */
.top { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: radial-gradient(circle at 50% 30%, #bfe8ff, var(--ray) 45%, #11307a 100%); box-shadow: 0 0 22px rgba(77, 163, 255, 0.55); position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 14px; transform: translateX(-50%); background: linear-gradient(var(--ray-hi), transparent); }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.15; }
.brand p { margin: 0; font-size: 11px; color: var(--muted); }
.metrics { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.metrics::-webkit-scrollbar { display: none; }
.metric { padding: 7px 12px; display: grid; min-width: 86px; flex: 0 0 auto; }
.metric b { font-family: var(--f-display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.metric span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.controls { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line);
  background: var(--glass);
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: var(--glass-hi); border-color: rgba(154, 216, 255, 0.45); }
.btn[aria-pressed="true"] { border-color: rgba(154, 216, 255, 0.6); color: var(--ray-hi); }
.btn .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* feed */
.feed { grid-column: 1; grid-row: 2; align-self: end; display: flex; flex-direction: column; gap: 8px; max-height: min(100%, 560px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-right: 2px; }
.feed-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.feed-head h2 { margin: 0; font-family: var(--f-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.feed-head span { font-size: 11px; color: var(--muted); }
.task { padding: 11px 12px 12px; display: grid; gap: 8px; animation: rise 0.35s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.task header { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.task .tid { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: 0 0 auto; }
.task .ttl { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; text-transform: uppercase; letter-spacing: 0.06em; }
.badge.you { color: var(--ray-hi); border-color: rgba(154, 216, 255, 0.4); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.steps li { font-size: 9.5px; color: var(--muted); padding-top: 6px; border-top: 3px solid rgba(124, 156, 236, 0.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.done { border-color: var(--ok); color: var(--fg); }
.steps li.now { border-color: var(--busy); color: var(--busy); }
.steps li.back { border-color: var(--warn); color: var(--warn); }
.teams-row { display: flex; gap: 4px; flex-wrap: wrap; }
.tchip { font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 70%, white); }
.status { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.score { display: flex; align-items: baseline; gap: 6px; }
.score b { font-family: var(--f-display); font-size: 20px; color: var(--ok); font-variant-numeric: tabular-nums; }
.score span { font-size: 11px; color: var(--muted); }
.task.is-done:not(:first-of-type):not(:hover):not(:focus-within) .result ul { display: none; }
.task.is-done { outline: none; }
.result ul { margin: 0; padding-left: 16px; font-size: 12px; color: #c9d3f2; display: grid; gap: 2px; }

/* panel */
.panel { grid-column: 3; grid-row: 2 / span 2; align-self: start; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 16px; display: grid; gap: 14px; scrollbar-width: thin; }
.p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.p-head h2 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
.icon-btn:hover { background: var(--glass-hi); }
.p-role { margin: 0; color: #c9d3f2; }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.p-stat { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; display: grid; }
.p-stat b { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.p-stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.panel h3 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.agent { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 9px; border-radius: 9px; background: rgba(124, 156, 236, 0.06); }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--c) 28%, #0b1430); color: color-mix(in srgb, var(--c) 60%, white); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.agent .who { min-width: 0; }
.agent .who b { display: block; font-size: 13px; }
.agent .who span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { font-size: 10px; padding: 3px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.state.idle { color: var(--muted); background: rgba(147, 160, 201, 0.1); }
.state.busy { color: var(--busy); background: rgba(111, 231, 255, 0.12); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-family: var(--f-mono); font-size: 11.5px; }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 8px; color: #c9d3f2; animation: rise 0.25s ease both; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log b { color: color-mix(in srgb, var(--c) 70%, white); font-weight: 500; }
.log .empty { color: var(--muted); display: block; }
.projects { display: flex; gap: 6px; flex-wrap: wrap; }
.proj { font-size: 11.5px; padding: 5px 9px; border-radius: 7px; border: 1px dashed var(--line); color: #c9d3f2; }
.proj b { color: var(--fg); }

/* command bar */
.command { grid-column: 1 / 3; grid-row: 3; display: grid; gap: 8px; max-width: 760px; }
.cmd-row { display: flex; gap: 8px; padding: 6px; }
.cmd-row input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0; padding: 8px 10px; font-size: 14px; }
.cmd-row input::placeholder { color: var(--muted); }
.cmd-row:focus-within { border-color: rgba(154, 216, 255, 0.55); }
.go { border: 0; border-radius: 9px; padding: 9px 16px; background: linear-gradient(180deg, #6db6ff, #2f7ff0); color: #04122e; font-weight: 700; font-size: 13px; white-space: nowrap; }
.go:hover { filter: brightness(1.08); }
.suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.suggest::-webkit-scrollbar { display: none; }
.sg { flex: 0 0 auto; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 6px 11px; font-size: 12px; color: #c9d3f2; }
.sg:hover { color: var(--fg); border-color: rgba(154, 216, 255, 0.45); }

.hint { grid-column: 2; grid-row: 2; align-self: start; justify-self: center; padding: 10px 14px; font-size: 12px; color: #c9d3f2; transition: opacity 0.4s ease; max-width: 560px; }
.hint ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hint li { display: contents; }
.hint kbd { font-family: var(--f-mono); font-size: 11px; color: var(--ray-hi); white-space: nowrap; }
.hint.gone { opacity: 0; pointer-events: none; }

.toast { box-sizing: border-box; position: fixed; left: 50%; top: calc(max(16px, env(safe-area-inset-top, 0px)) + 64px); transform: translate(-50%, -10px); opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; padding: 10px 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; max-width: calc(100vw - 32px); z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: var(--ok); font-family: var(--f-display); }
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.mobile-only { display: none; }

@media (max-width: 1520px) {
  .controls .lbl-txt { display: none; }
}
@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
  .brand p, .controls .lbl-txt { display: none; }
  .brand { padding: 6px 10px 6px 8px; }
  .brand h1 { font-size: 12px; }
  .metric { min-width: 70px; padding: 5px 9px; }
  .metric b { font-size: 14px; }
  .controls { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .controls::-webkit-scrollbar { display: none; }
  .btn { padding: 7px 10px; flex: 0 0 auto; min-height: 40px; min-width: 40px; justify-content: center; }
  .feed { grid-column: 1; grid-row: 2; max-height: 42vh; }
  .feed.collapsed article.task:nth-of-type(n + 2) { display: none; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
  .metric { min-width: 0; }
  .metric span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel { grid-column: 1; grid-row: 2; align-self: end; max-height: min(58vh, 100%); padding: 14px; }
  body.has-panel .feed { display: none; }
  .command { grid-column: 1; grid-row: 3; }
  .hint { grid-column: 1; grid-row: 2; }
  .mobile-only { display: inline-flex; }
  .panel { max-height: min(42vh, 100%); gap: 10px; }
  .panel:not(.open) .p-role, .panel:not(.open) .agents, .panel:not(.open) .h-agents, .panel:not(.open) .projects, .panel:not(.open) .h-projects { display: none; }
  .btn.p-toggle { display: inline-flex; padding: 6px 10px; font-size: 11px; }
  .lbl { font-size: 9.5px; padding: 3px 7px 3px 5px; gap: 5px; }
  .lbl small { display: none; }
  .lbl.boss { font-size: 10px; }
  .stamp b { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="scene" aria-label="3D-город агентов"></div>
<div id="labels"></div>

<div class="hud">
  <div class="top">
    <div class="brand glass">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>Город агентов B1ueRay</h1>
        <p>Штаб → команды → перепроверка → аналитика → тебе</p>
      </div>
    </div>
    <div class="metrics" role="status" aria-live="polite">
      <div class="metric glass"><b id="m-inflight">0</b><span>в работе</span></div>
      <div class="metric glass"><b id="m-done">0</b><span>готово</span></div>
      <div class="metric glass"><b id="m-score">—</b><span>оценка</span></div>
      <div class="metric glass"><b id="m-agents">0/21</b><span>заняты</span></div>
    </div>
    <div class="controls">
      <button class="btn" id="b-help" type="button" aria-pressed="false" title="Как летать">? <span class="lbl-txt">Управление</span></button>
      <button class="btn" id="b-home" type="button" title="Вернуть камеру">◎ <span class="lbl-txt">Обзор</span></button>
      <button class="btn" id="b-speed" type="button" title="Скорость времени"><span class="k">×1</span> <span class="lbl-txt">Скорость</span></button>
      <button class="btn" id="b-auto" type="button" aria-pressed="true" title="Агенты сами берут демо-задачи">⟳ <span class="lbl-txt">Автопилот</span></button>
      <button class="btn" id="b-day" type="button" aria-pressed="false" title="День / ночь">☾ <span class="lbl-txt">Ночь</span></button>
      <button class="btn" id="b-fx" type="button" aria-pressed="true" title="Свечение и качество">✦ <span class="lbl-txt">Свечение</span></button>
      <button class="btn mobile-only" id="b-feed" type="button" aria-pressed="false">Задачи</button>
    </div>
  </div>

  <div class="hint glass" id="hint" role="note"></div>

  <section class="feed collapsed" id="feed" aria-label="Лента задач">
    <div class="feed-head"><h2>Лента задач</h2><span id="feed-count"></span></div>
  </section>

  <aside class="panel glass" id="panel" hidden aria-label="Карточка здания"></aside>

  <form class="command" id="cmd-form" autocomplete="off">
    <div class="suggest" id="suggest"></div>
    <div class="cmd-row glass">
      <input id="cmd" name="cmd" maxlength="140" placeholder="Дай задачу городу: например, «рилс про VELORA»" aria-label="Задача для агентов">
      <button class="go" type="submit">Запустить</button>
    </div>
  </form>
</div>

<div class="toast glass" id="toast" role="status"><b id="toast-score"></b><span id="toast-text"></span></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   DATA — команды, агенты, реплики
   ================================================================ */
const TEAMS = {
  hq: {

function windowTexture(repeatY, palette) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
  for (let y = 3; y < 64; y += 8) {
    for (let x = 3; x < 64; x += 8) {
      const r = Math.random();
      if (r < 0.5) {
        g.globalAlpha = 0.35 + Math.random() * 0.65;
        g.fillStyle = r < 0.34 ? palette[0] : r < 0.44 ? palette[1] : palette[2];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, repeatY);
  return t;
}
const WARM = ['#ffcf8a', '#9fd0ff', '#ffffff'];
const windowMats = [];

function screenTexture(color, title) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#0b1330'; g.fillRect(0, 0, 256, 160);
  g.fillStyle = hex(color); g.globalAlpha = 0.9; g.fillRect(0, 0, 256, 22);
  g.globalAlpha = 1; g.fillStyle = '#06102a'; g.font = '600 13px Manrope, sans-serif'; g.fillText(title, 10, 15);
  for (let i = 0; i < 7; i++) {
    const w = 60 + Math.random() * 150;
    g.fillStyle = i % 3 === 0 ? hex(color) : '#c9d6ff';
    g.globalAlpha = i % 3 === 0 ? 0.8 : 0.35;
    g.fillRect(i % 2 ? 256 - 14 - w : 14, 32 + i * 17, w, 9);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function keyDist(x, z) { let d = Infinity; for (const [kx, kz] of KEY_SPOTS) d = Math.min(d, Math.hypot(x - kx, z - kz)); return d; }
function nearKey(x, z) {
  for (const [kx, kz] of KEY_SPOTS) if (Math.abs(x - kx) < 7.2 && Math.abs(z - kz) < 7.2) return true;
  return false;
}
function inCamCorridor(x, z) {
  for (const [id, t] of [...Object.entries(TEAMS), ['boss', BOSS]]) {
    const [bx, bz] = t.pos;
    const L = Math.hypot(bx, bz) || 1;
    const [ox, oz] = id === 'hq' ? [0.55, 0.83] : [bx / L, bz / L];
    const dx = x - bx, dz = z - bz;
    const along = dx * ox + dz * oz;
    const across = dx * oz - dz * ox; // + is the camera's side offset
    if (along > 2 && along < 24 && across > -4 && across < 10) return true;
  }
  return false;
}
const lots = [];

      for (let j = 0; j < 3; j++) {
        const x = x0 + 2.1 + i * 3.9, z = z0 + 2.1 + j * 3.9;
        if (nearKey(x, z) || inCamCorridor(x, z) || Math.random() < 0.12) continue;
        const d = Math.hypot(x, z);
        const tall = Math.random() < (d < 45 ? 0.07 : 0.03);
        let h = tall ? rand(9, 22) : rand(1.4, 5) + (d < 40 ? rand(0, 2.5) : 0);

}

function fitText(g, text, maxW) {

  return t + '…';
}

  scene.add(m);
  walkers.push({ m, dir: alongX ? new THREE.Vector3(Math.random() < 0.5 ? 1 : -1, 0, 0) : new THREE.Vector3(0, 0, Math.random() < 0.5 ? 1 : -1), speed: rand(1.6, 3.2), phase: rand(0, 6) });
}
function nearestRoad(v) { let best = ROAD[0]; for (const r of ROAD) if (Math.abs(v - r) < Math.abs(v - best)) best = r; return best; }
function updateWalkers(dt) {
  for (const w of walkers) {
    const p = w.m.position;
    const axis = w.dir.x !== 0 ? 'x' : 'z';
    const before = p[axis];
    p.addScaledVector(w.dir, w.speed * dt);
    const after = p[axis];
    for (const r of ROAD) {
      if ((before - r) * (after - r) <= 0 && Math.random() < 0.3) {
        const other = axis === 'x' ? 'z' : 'x';
        const side = p[other] - nearestRoad(p[other]);
        p[axis] = r + (Math.random() < 0.5 ? 0.75 : -0.75);
        p[other] = nearestRoad(p[other]) + side;
        const s = Math.random() < 0.5 ? 1 : -1;
        w.dir.set(other === 'x' ? s : 0, 0, other === 'z' ? s : 0);
        break;
      }
    }
    if (Math.abs(p.x) > 64 || Math.abs(p.z) > 64) { w.dir.multiplyScalar(-1); p.x = THREE.MathUtils.clamp(p.x, -63.5, 63.5); p.z = THREE.MathUtils.clamp(p.z, -63.5, 63.5); }
    w.phase += dt * w.speed * 4;
    w.m.position.y = Math.abs(Math.sin(w.phase)) * 0.08;
  }
}

  const at = (id, spread) => id === 'sky' ? SKY.clone().add(new THREE.Vector3(rand(-spread, spread), 0, rand(-spread, spread))) : id === 'boss' ? boss.anchor.clone() : B(id).clone();
  const a = at(from, 10);
  const b = at(to, 20);
  const curve = arcCurve(a, b);
  const arc = arcMap.get(`${from}>${to}`);
  if (arc) arc.active++;
  const head = new THREE.Mesh(orbGeo, glowMat(0xffffff));
  const halo = new THREE.Mesh(orbGeo, glowMat(color, 0.55));
  halo.scale.setScalar(1.9);
  head.add(halo);
  scene.add(head);
  const trail = [];
  for (let i = 0; i < 7; i++) { const t = new THREE.Mesh(trailGeo, glowMat(color, 0.5 - i * 0.06)); t.scale.setScalar(1 - i * 0.11); scene.add(t); trail.push(t); }
  const dur = 1.3 + curve.getLength() * 0.018;
  return new Promise((resolve) => orbs.push({ curve, head, trail, t: 0, dur, resolve: () => { if (arc) arc.active--; resolve(); } }));
}
function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t = Math.min(1, o.t + (dt * speed) / o.dur);
    const k = o.t < 0.5 ? 2 * o.t * o.t : 1 - Math.pow(-2 * o.t + 2, 2) / 2;
    o.head.position.copy(o.curve.getPoint(k));
    o.trail.forEach((tr, j) => tr.position.copy(o.curve.getPoint(Math.max(0, k - (j + 1) * 0.018))));
    if (o.t >= 1) {
      scene.remove(o.head); o.trail.forEach((tr) => scene.remove(tr));
      o.head.children[0].material.dispose(); o.head.material.dispose(); o.trail.forEach((tr) => tr.material.dispose());
      orbs.splice(i, 1);
      o.resolve();
    }
  }
}

/* ================================================================
   TASK ENGINE
   ================================================================ */
const tasks = [];
let taskSeq = 0;
let lastScore = null;
let scoreSum = 0, scoreN = 0;

function route(text) {
  const t = text.toLowerCase();
  const hits = PRODUCTION.filter((id) => TEAMS[id].keywords.some((k) => t.includes(k)));
  if (!hits.length) hits.push(pick(PRODUCTION));
  return hits;
}
function slugify(t) {
  const map = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ы: 'y', э: 'e', ю: 'yu', я: 'ya' };
  return t.toLowerCase().split('').map((c) => map[c] ?? (/[a-z0-9]/.test(c) ? c : '-')).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 22) || 'task';
}
function fmtLine(tpl, task) {
  return tpl
    .replace('{t}', task.text.length > 34 ? task.text.slice(0, 33) + '…' : task.text)
    .replace('{teams}', task.teams.map((id) => TEAMS[id].short).join(', '))
    .replace('{slug}', task.slug)
    .replace('{n}', String(task.checks))
    .replace('{score}', task.score?.toFixed(1) ?? '');
}
function clock() {
  const d = new Date();
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function log(id, task, text, who) {
  const b = buildings[id];
  const busyIdx = b.agentState.map((s, i) => (s === 'busy' ? i : -1)).filter((i) => i >= 0);
  const agentName = who ?? b.team.agents[busyIdx.length ? pick(busyIdx) : 0][0];
  const entry = { time: clock(), who: agentName, text, task: task?.id };
  b.logs.push(entry);
  if (b.logs.length > 40) b.logs.shift();
  if (task) { task.status = `${b.team.short} · ${agentName}: ${text}`; renderTask(task); }
  if (selected === id) { renderPanel(); drawWall(id); }
}

function setBusy(id, on, count) {
  const b = buildings[id];
  b.busy = Math.max(0, b.busy + (on ? 1 : -1));
  const n = b.team.agents.length;
  if (on) {
    const want = Math.min(n, count ?? Math.max(1, Math.ceil(n * 0.66)));
    let made = b.agentState.filter((s) => s === 'busy').length;
    for (let i = 0; i < n && made < want; i++) if (b.agentState[i] !== 'busy') { b.agentState[i] = 'busy'; made++; }
  } else if (b.busy === 0) {
    b.agentState = b.agentState.map(() => 'idle');
  }
  b.label.el.classList.toggle('is-busy', b.busy > 0);
  const small = document.getElementById('lbl-' + id);
  if (small) small.textContent = b.busy > 0 ? 'в работе' : `${n} аг.`;
  updateMetrics();
  if (selected === id) { renderPanel(); drawWall(id); }
}

async function work(id, task, ms, lines = 2) {
  setBusy(id, true);
  const tpl = TEAMS[id].lines;
  const used = new Set();
  for (let i = 0; i < lines; i++) {
    let line;
    do { line = pick(tpl); } while (used.has(line) && used.size < tpl.length);
    used.add(line);
    log(id, task, fmtLine(line, task));
    await wait(ms / lines);
  }
  setBusy(id, false);
}

async function runTask(text, opts = {}) {
  const task = {
    id: ++taskSeq, text, demo: !!opts.demo, teams: route(text), slug: slugify(text),
    stage: 0, back: false, status: 'Падает в штаб…', checks: 30 + Math.floor(Math.random() * 40),
    score: null, result: null, startedAt: performance.now(),
  };
  tasks.unshift(task);
  mountTask(task);
  updateMetrics();

  await travel('sky', 'hq', TEAMS.hq.color);
  await work('hq', task, 2200, 2);

  task.stage = 1; renderTask(task);
  await Promise.all(task.teams.map(async (id) => {
    await travel('hq', id, TEAMS[id].color);
    await work(id, task, rand(2600, 4200), 3);
    buildings[id].done++;
    await travel(id, 'qa', TEAMS[id].color);
  }));

  task.stage = 2; renderTask(task);
  await work('qa', task, 2200, 2);
  if (Math.random() < 0.35) {
    const culprit = pick(task.teams);
    task.back = true;
    task.bounced = true;
    log('qa', task, `Нашёл косяк, отправляю назад в «${TEAMS[culprit].short}»`, 'Зануда');
    await travel('qa', culprit, TEAMS.qa.color);
    await work(culprit, task, 1800, 1);
    log(culprit, task, 'Починили. Больше так не будем (будем)');
    await travel(culprit, 'qa', TEAMS[culprit].color);
    await work('qa', task, 1200, 1);
    task.back = false;
  }
  buildings.qa.done++;

  task.stage = 3; renderTask(task);
  await travel('qa', 'analytics', TEAMS.analytics.color);
  task.score = Math.min(9.9, rand(7.6, 9.6) + (task.bounced ? 0.2 : 0));
  await work('analytics', task, 2000, 2);
  lastScore = task.score;
  log('analytics', task, `Оценка: ${task.score.toFixed(1)}/10. Можно отправлять`, 'Аналитик');
  showStamp(task.score);
  buildings.analytics.done++;

  task.stage = 4; renderTask(task);
  await travel('analytics', 'delivery', TEAMS.delivery.color);
  await work('delivery', task, 1400, 1);
  log('delivery', task, 'Лечу к боссу', 'Почтальон');
  buildings.delivery.done++;
  await travel('delivery', 'boss', TEAMS.delivery.color);
  boss.flash = 1;
  addTrophy();

  task.stage = 5;
  task.doneAt = 1000 + taskSeq + performance.now();
  task.status = 'Отправлено боссу';
  task.result = [...task.teams.map((id) => pick(TEAMS[id].result)), `QA: ${task.checks} проверок, критичных косяков нет`];
  scoreSum += task.score; scoreN++;
  buildings.hq.done++;
  renderTask(task);
  trimTasks();
  updateMetrics();
  toast(task);
  if (selected === 'boss') renderPanel();
}

function seedDone(text, teams, score) {
  const task = { id: ++taskSeq, text, demo: true, teams, slug: slugify(text), stage: 5, back: false, status: 'Отправлено боссу', checks: 30 + Math.floor(Math.random() * 40), score };
  task.result = [...teams.map((id) => pick(TEAMS[id].result)), `QA: ${task.checks} проверок, критичных косяков нет`];
  tasks.push(task);
  mountTask(task);
  scoreSum += score; scoreN++; lastScore = score;
  for (const id of [...teams, 'hq', 'qa', 'analytics', 'delivery']) buildings[id].done++;
  addTrophy();
}

const feedEl = $('feed');
function mountTask(task) {
  const el = document.createElement('article');
  el.className = 'task glass';
  el.id = 'task-' + task.id;
  el.tabIndex = 0;
  feedEl.querySelector('.feed-head').after(el);
  task.el = el;
  trimCards();
  renderTask(task);
}
function trimCards() {
  const cards = [...feedEl.querySelectorAll('.task')];
  while (cards.length > 6) {
    const old = cards.slice().reverse();
    const victim = old.find((c) => tasks.find((t) => t.el === c)?.stage === 5);
    if (!victim) break;
    const t = tasks.find((x) => x.el === victim);
    if (t) t.el = null;
    victim.remove();
    cards.splice(cards.indexOf(victim), 1);
  }
}
function trimTasks() {
  trimCards();
  while (tasks.length > 30) {
    const i = tasks.map((t) => t.stage).lastIndexOf(5);
    if (i < 0) break;
    tasks.splice(i, 1);
  }
}
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

let fly = null;
function flyTo(pos, target, dur) {
  const len = camera.position.distanceTo(pos) + controls.target.distanceTo(target) * 0.5;
  const d = dur ?? THREE.MathUtils.clamp(0.8 + len * 0.011, 0.9, 2);
  fly = { fromP: camera.position.clone(), toP: pos.clone(), fromT: controls.target.clone(), toT: target.clone(), t: 0, dur: reduceMotion ? 0.01 : d, bump: Math.min(22, len * 0.18) };
  controls.enabled = false;
}
const roomLight = new THREE.PointLight(0xfff1d6, 0, 16, 1.4);
scene.add(roomLight);
function setCutaway(id, on) {
  if (id === 'boss') return;
  const b = buildings[id];
  for (const m of b.meshes) m.visible = !on;
  b.interior.group.visible = on;
  b.beam.visible = !on;
  if (on) {
    roomLight.position.set(b.group.position.x, 4.5, b.group.position.z);
    roomLight.intensity = 14;
    drawWall(id);
  } else roomLight.intensity = 0;
}
function applyViewOffset() {
  if (isMobile && selected) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.2, innerWidth, innerHeight);
  else camera.clearViewOffset();
}
function allLabels() { return [...Object.values(buildings).map((b) => b.label.el), boss.label.el]; }
let lastLabel = null;
function focusBuilding(id) {
  if (document.activeElement?.classList?.contains('lbl')) lastLabel = document.activeElement;
  if (selected && selected !== id) setCutaway(selected, false);
  if (selected !== id) setCutaway(id, true);
  selected = id;
  document.body.classList.add('has-panel');
  allLabels().forEach((el) => el.classList.remove('is-focus'));
  (id === 'boss' ? boss.label.el : buildings[id].label.el).classList.add('is-focus');
  const p = id === 'boss' ? boss.group.position : buildings[id].group.position;
  const out = id === 'boss' ? new THREE.Vector3(p.x, 0, p.z).normalize() : buildings[id].out;
  // camera sits outside, a little to the right, so both walls of the cutaway face it
  const side = new THREE.Vector3(out.z, 0, -out.x);
  const dist = id === 'boss' ? (isMobile ? 38 : 30) : isMobile ? 15 : 12.5;
  const lift = id === 'boss' ? 24 : isMobile ? 17 : 14;
  const pos = new THREE.Vector3(p.x, lift, p.z).addScaledVector(out, dist).addScaledVector(side, id === 'boss' ? 0 : 4);
  flyTo(pos, new THREE.Vector3(p.x, id === 'boss' ? 8 : 1.2, p.z));
  controls.autoRotate = false;
  panel.hidden = false;
  panel.classList.toggle('open', panelOpen);
  applyViewOffset();
  renderPanel();
  if (lastLabel) $('p-close')?.focus({ preventScroll: true });
  hoverEl?.classList.remove('is-hover'); hoverEl = null;
  setHelp(false);
}
function unfocus() {
  if (selected) setCutaway(selected, false);
  allLabels().forEach((el) => el.classList.remove('is-focus'));
  selected = null;
  document.body.classList.remove('has-panel');
  panel.hidden = true;
  applyViewOffset();
  flyTo(HOME.pos, HOME.target);
  lastLabel?.focus?.({ preventScroll: true });
  lastLabel = null;
}

  b.flash = 1;
}

/* ================================================================
   INPUT
   ================================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
let lastTap = { t: 0, x: 0, y: 0 };
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function cancelFly() { if (fly) { fly = null; controls.enabled = true; } stopAuto(); }
function labelAt(x, y) {
  let best = null, bestZ = -Infinity;
  for (const lt of labelTargets) {
    if (lt.el.style.display === 'none') continue;
    const r = lt.el.getBoundingClientRect();
    if (x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 4 && y <= r.bottom + 4) {
      const z = Number(lt.el.style.zIndex) || 0;
      if (z > bestZ) { bestZ = z; best = lt; }
    }
  }
  return best;
}
function pickAt(x, y) {
  const lt = labelAt(x, y);
  if (lt) return { id: lt.id, el: lt.el };
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(hitTargets, false)[0];
  return hit ? { id: hit.object.userData.id } : null;
}
// capture phase: runs before the controls see the press, so a press always stops a running flight
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; cancelFly(); }, { capture: true });
renderer.domElement.addEventListener('wheel', cancelFly, { capture: true, passive: true });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return;
  const now = performance.now();
  const hit = pickAt(e.clientX, e.clientY);
  if (hit) { focusBuilding(hit.id); lastTap.t = 0; return; }
  // double tap / double click on empty ground: glide there
  if (now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(groundPlane, pt)) {
      pt.x = THREE.MathUtils.clamp(pt.x, -70, 70); pt.z = THREE.MathUtils.clamp(pt.z, -70, 70);
      const offset = camera.position.clone().sub(controls.target).multiplyScalar(0.7);
      if (offset.length() < 14) offset.setLength(14);
      flyTo(pt.clone().add(offset), pt);
    }
    lastTap.t = 0;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
});
let hoverEl = null;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  const hit = pickAt(e.clientX, e.clientY);
  renderer.domElement.style.cursor = hit ? 'pointer' : '';
  const el = hit?.el ?? null;
  if (el !== hoverEl) { hoverEl?.classList.remove('is-hover'); el?.classList.add('is-hover'); hoverEl = el; }
});

// keyboard flight (layout-independent: uses e.code, so it works on the Russian layout too)
const FLY_CODES = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'KeyR', 'KeyF', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Equal', 'Minus', 'NumpadAdd', 'NumpadSubtract']);
const keys = new Set();
let shiftHeld = false;
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selected) { unfocus(); return; }
  if (e.target.closest?.('input, textarea, [contenteditable]')) return;
  shiftHeld = e.shiftKey;
  if (!FLY_CODES.has(e.code) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code.startsWith('Arrow') && e.target.closest?.('.feed, .panel, .suggest')) return;
  e.preventDefault();
  keys.add(e.code);
  cancelFly();
});
addEventListener('keyup', (e) => { keys.delete(e.code); shiftHeld = e.shiftKey; });
addEventListener('blur', () => keys.clear());
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _move = new THREE.Vector3(), _off = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
function keyFlight(dt) {
  if (!keys.size) return;
  const has = (c) => keys.has(c);
  const fast = shiftHeld ? 2.6 : 1;
  _off.subVectors(camera.position, controls.target);
  const dist = _off.length();
  _fwd.copy(_off).negate(); _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
  _fwd.normalize();
  _right.set(-_fwd.z, 0, _fwd.x);
  const sp = (6 + dist * 0.45) * fast * dt;
  _move.set(0, 0, 0);
  if (has('KeyW') || has('ArrowUp')) _move.add(_fwd);
  if (has('KeyS') || has('ArrowDown')) _move.sub(_fwd);
  if (has('KeyD') || has('ArrowRight')) _move.add(_right);
  if (has('KeyA') || has('ArrowLeft')) _move.sub(_right);
  if (_move.lengthSq()) { _move.normalize().multiplyScalar(sp); camera.position.add(_move); controls.target.add(_move); }
  const turn = ((has('KeyQ') ? 1 : 0) - (has('KeyE') ? 1 : 0)) * 1.3 * fast * dt;
  if (turn) { _off.applyAxisAngle(UP, turn); camera.position.copy(controls.target).add(_off); }
  const zoom = ((has('KeyF') || has('Minus') || has('NumpadSubtract')) ? 1 : 0) - ((has('KeyR') || has('Equal') || has('NumpadAdd')) ? 1 : 0);
  if (zoom) {
    _off.subVectors(camera.position, controls.target);
    const nd = THREE.MathUtils.clamp(_off.length() * (1 + zoom * 1.4 * fast * dt), controls.minDistance, controls.maxDistance);
    _off.setLength(nd);
    camera.position.copy(controls.target).add(_off);
  }
}
// keep the view over the model city
function clampToCity() {
  const tx = THREE.MathUtils.clamp(controls.target.x, -72, 72) - controls.target.x;
  const tz = THREE.MathUtils.clamp(controls.target.z, -72, 72) - controls.target.z;
  if (tx || tz) { controls.target.x += tx; controls.target.z += tz; camera.position.x += tx; camera.position.z += tz; }
  if (controls.target.y !== 2 && !fly && !selected) controls.target.y += (2 - controls.target.y) * 0.1;
}

$('cmd-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('cmd').value.trim();
  if (!v) { $('cmd').focus(); return; }
  runTask(v);
  $('cmd').value = '';
  $('cmd').blur();
});
const sg = $('suggest');
SAMPLES.slice(0, 6).forEach((s) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sg'; b.textContent = s;
  b.onclick = () => runTask(s);
  sg.appendChild(b);
});

$('b-help').onclick = () => setHelp($('hint').classList.contains('gone'));
$('b-home').onclick = () => (selected ? unfocus() : flyTo(HOME.pos, HOME.target));
const SPEEDS = [1, 2, 4];
$('b-speed').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $('b-speed').querySelector('.k').textContent = '×' + speed;
};
let autopilot = true;
$('b-auto').onclick = () => { autopilot = !autopilot; $('b-auto').setAttribute('aria-pressed', String(autopilot)); };
let night = true;
$('b-day').onclick = () => {
  night = !night;
  $('b-day').setAttribute('aria-pressed', String(!night));
  $('b-day').innerHTML = night ? '☾ <span class="lbl-txt">Ночь</span>' : '☀ <span class="lbl-txt">День</span>';
};
let autoQuality = true;
function setQuality(level) {
  // 0: full · 1: lower resolution · 2: no glow, lower resolution
  fxOn = level < 2;
  pixelRatio = level === 0 ? fullRatio : 1;
  renderer.setPixelRatio(pixelRatio);
  composer.setPixelRatio(pixelRatio);
  $('b-fx').setAttribute('aria-pressed', String(fxOn));
  onResize();
}
$('b-fx').onclick = () => { autoQuality = false; setQuality(fxOn ? 2 : 0); };
// drop quality when the device can't keep up (ignores load hitches and background tabs)
let perfT = 0, perfN = 0, perfMax = 0, perfLevel = 0, perfWarm = 4;
function watchPerf(raw) {
  if (!autoQuality || perfLevel >= 2) return;
  if (perfWarm > 0) { perfWarm -= raw; return; }
  perfT += raw; perfN++; perfMax = Math.max(perfMax, raw);
  if (perfT < 2.5) return;
  const fps = perfN / perfT;
  if (perfMax < 0.5 && fps < 40) { perfLevel++; setQuality(perfLevel); perfWarm = 2; }
  perfT = 0; perfN = 0; perfMax = 0;
}
$('b-feed').onclick = () => {
  const c = feedEl.classList.toggle('collapsed');
  $('b-feed').setAttribute('aria-pressed', String(!c));
};

const coarse = matchMedia('(pointer: coarse)').matches;
const HELP = coarse
  ? [['1 палец', 'лететь над городом'], ['2 пальца', 'щипок — ближе/дальше, сдвиг — наклон и поворот'], ['тап по зданию', 'залететь внутрь'], ['двойной тап', 'перелететь в точку']]
  : [['тянуть мышью', 'лететь над городом'], ['правая кнопка / Shift', 'повернуть и наклонить'], ['колесо', 'ближе к курсору'], ['WASD / стрелки', 'полёт, Shift — быстрее'], ['Q / E · R / F', 'поворот · ближе / дальше'], ['клик / двойной клик', 'в здание / перелёт в точку']];
$('hint').innerHTML = '<ul>' + HELP.map(([k, v]) => `<li><kbd>${k}</kbd><span>${v}</span></li>`).join('') + '</ul>';
let hintTimer = setTimeout(() => setHelp(false), 14000);
function setHelp(on) {
  $('hint').classList.toggle('gone', !on);
  $('b-help').setAttribute('aria-pressed', String(on));
  clearTimeout(hintTimer);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  applyViewOffset();
}
addEventListener('resize', onResize);

/* ================================================================
   LOOP
   ================================================================ */
const clk = new THREE.Clock();
let dayMix = 0; // 0 night → 1 day
let insideMix = 0;
let bbTimer = 0, bbIdx = 0, autoTimer = 6;
let warmFrames = 0; // first frame renders every interior once so the first fly-in doesn't stutter on shader compiles
const tmpCol = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const raw = clk.getDelta();
  const dt = Math.min(raw, 0.1);
  const t = clk.elapsedTime;
  watchPerf(raw);
  if (warmFrames < 2) { for (const b of Object.values(buildings)) b.interior.group.visible = warmFrames === 0 || b.id === selected; warmFrames++; }

  // sim waits
  const sdt = dt * 1000 * speed;
  for (let i = waits.length - 1; i >= 0; i--) { waits[i].left -= sdt; if (waits[i].left <= 0) { waits[i].r(); waits.splice(i, 1); } }
  updateOrbs(dt);
  updateWalkers(dt);

  // day / night blend
  dayMix += ((night ? 0 : 1) - dayMix) * Math.min(1, dt * 2.5);
  scene.background.copy(NIGHT_BG).lerp(DAY_BG, dayMix);
  scene.fog.color.copy(scene.background);
  scene.fog.density = 0.0062 - dayMix * 0.0034;
  hemi.intensity = 1.1 + dayMix * 1.6;
  sun.intensity = 1.0 + dayMix * 2.6;
  for (const m of windowMats) m.emissiveIntensity = m.userData.base * (1 - dayMix * 0.82);
  const inside = selected && selected !== 'boss' ? 1 : 0;
  insideMix += (inside - insideMix) * Math.min(1, dt * 3);
  bloom.strength = (0.85 - dayMix * 0.6) * (1 - insideMix * 0.55);
  bloom.threshold = 0.62 + insideMix * 0.25;
  hqGlow.intensity = 600 * (1 - dayMix * 0.7);
  dust.material.opacity = 0.75 * (1 - dayMix * 0.8);
  plateMat.color.set(0x1a2550).lerp(tmpCol.set(0x8796c4), dayMix);

  // buildings: beams, rings, interiors
  for (const b of Object.values(buildings)) {
    const target = b.busy > 0 ? 0.34 : 0.1;
    const mat = b.beam.material;
    mat.opacity += (target * (1 - dayMix * 0.6) - mat.opacity) * Math.min(1, dt * 4);
    if (b.flash) { mat.opacity = Math.max(mat.opacity, b.flash * 0.9); b.beam.scale.set(1 + b.flash * 3, 1, 1 + b.flash * 3); b.flash = Math.max(0, b.flash - dt * 0.8); if (!b.flash) b.beam.scale.set(1, 1, 1); }
    b.ring.material.opacity = b.busy > 0 ? (reduceMotion ? 0.7 : 0.6 + Math.sin(t * 6) * 0.3) : 0.35;
    if (b.interior.group.visible) {
      for (const a of b.interior.agents) {
        const busy = a.intern ? b.busy > 0 && a.i % 2 === 0 : b.agentState[a.i] === 'busy';
        a.head.position.y = a.baseY + (busy ? Math.abs(Math.sin(t * 9 + a.i)) * 0.06 : Math.sin(t * 1.5 + a.i) * 0.015);
        a.head.rotation.y = busy ? Math.sin(t * 3 + a.i) * 0.25 : 0;
        a.mon.color.setScalar(busy ? (reduceMotion ? 0.95 : 0.85 + Math.random() * 0.15) : 0.45);
      }
    }
  }

  // boss house glow + mini screens
  boss.beam.material.opacity = (boss.flash > 0 ? 0.2 + boss.flash * 0.7 : 0.14) * (1 - dayMix * 0.5);
  boss.beam.scale.set(1 + boss.flash * 3, 1, 1 + boss.flash * 3);
  boss.flash = Math.max(0, boss.flash - dt * 0.9);
  if (selected && selected !== 'boss') {
    const b = buildings[selected];
    const busy = b.busy > 0;
    if (!reduceMotion) for (const mm of b.interior.miniMats) if (Math.random() < 0.08) mm.color.setScalar(busy ? 0.75 + Math.random() * 0.25 : 0.5 + Math.random() * 0.1);
  }

  // spinners
  for (const s of spinners) {
    if (s.scan) { s.obj.position.y = 1 + (Math.sin(t * 1.4) * 0.5 + 0.5) * 10; }
    else s.obj.rotation[s.axis] += dt * s.speed;
  }

  // arcs sparks
  for (const a of arcs) {
    a.t = (a.t + dt * a.speed) % 1;
    a.spark.position.copy(a.curve.getPoint(a.t));
    const want = a.active > 0 ? 1 : 0.4;
    a.tube.material.opacity += (want - a.tube.material.opacity) * Math.min(1, dt * 6);
  }

  // dust drift
  const pa = dustGeo.attributes.position;
  const drift = reduceMotion ? 0.1 : 0.6;
  for (let i = 0; i < dustCount; i++) { let y = pa.array[i * 3 + 1] + dt * drift; if (y > 40) y = 0; pa.array[i * 3 + 1] = y; }
  pa.needsUpdate = true;

  // billboard
  bbTimer += dt;
  if (bbTimer > 3.2) { bbTimer = 0; drawBillboard(++bbIdx); }

  // autopilot demo tasks
  autoTimer -= dt * speed;
  if (autopilot && autoTimer <= 0) {
    autoTimer = rand(12, 20);
    if (tasks.filter((x) => x.stage < 5).length < 2) runTask(pick(SAMPLES), { demo: true });
  }

  // camera
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / fly.dur);
    const k = fly.t < 0.5 ? 4 * fly.t ** 3 : 1 - Math.pow(-2 * fly.t + 2, 3) / 2;
    camera.position.lerpVectors(fly.fromP, fly.toP, k);
    camera.position.y += Math.sin(Math.PI * k) * fly.bump;
    controls.target.lerpVectors(fly.fromT, fly.toT, k);
    if (fly.t >= 1) { fly = null; controls.enabled = true; }
  } else {
    keyFlight(dt);
  }
  controls.update();
  clampToCity();

  if (fxOn) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateMetrics();
animate();
document.fonts?.ready.then(() => { drawBillboard(bbIdx); if (selected && selected !== 'boss') drawWall(selected); });

// open in a living state: two finished tasks in the boss inbox, two moving through the city
seedDone('Обложки для рилсов', ['design', 'marketing'], 8.8);
seedDone('Починить логин в VELORA', ['dev'], 9.2);
updateMetrics();
runTask('Сделай лендинг для БухМета', { demo: true });
setTimeout(() => runTask('Рилс про VELORA в инсту', { demo: true }), 2600);

window.__city = { runTask, focusBuilding, unfocus, buildings, tasks, boss };
window.__nav = { camera, controls, flying: () => !!fly };
</script>
