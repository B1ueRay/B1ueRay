<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Город агентов B1ueRay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D night city; glass HUD pinned to the edges — brand + metrics on top, task feed bottom-left, team panel on the right, command bar along the bottom. */
:root {
  --ink: #070b1a;
  --glass: rgba(10, 16, 36, 0.88);
  --glass-hi: rgba(16, 25, 56, 0.92);
  --line: rgba(124, 156, 236, 0.22);
  --fg: #e7edff;
  --muted: #93a0c9;
  --ray: #4da3ff;
  --ray-hi: #9ad8ff;
  --warm: #ffc46b;
  --ok: #5be49b;
  --warn: #ffb547;
  --busy: #6fe7ff;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; }

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ray-hi); outline-offset: 2px; }

/* ---------- building labels ---------- */
.lbl {
  --c: var(--ray);
  pointer-events: none;
  will-change: transform;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px 5px 8px;
  border-radius: 7px;
  background: rgba(6, 10, 24, 0.82);
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--c) 30%, transparent);
  color: var(--fg);
  font-family: var(--f-display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  user-select: none;
  transition: transform 0.2s ease, background 0.2s ease;
}
.lbl.is-hover, .lbl.is-focus, .lbl:focus-visible { background: rgba(16, 26, 60, 0.95); }
.lbl i { font-style: normal; font-family: var(--f-mono); font-size: 9.5px; min-width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 30%, transparent); color: var(--fg); }
.lbl.boss { --c: #ffd36b; font-size: 12px; padding: 6px 12px 6px 9px; box-shadow: 0 0 26px rgba(255, 211, 107, 0.45); }
.stamp-wrap { pointer-events: none; }
.stamp { display: grid; justify-items: center; padding: 8px 16px 10px; border: 3px solid var(--ok); border-radius: 14px; background: rgba(6, 24, 18, 0.82); color: var(--ok); transform: scale(0.2) rotate(-9deg); opacity: 0; transition: transform 0.35s cubic-bezier(.2, 1.6, .4, 1), opacity 0.25s ease; box-shadow: 0 0 40px rgba(91, 228, 155, 0.45); }
.stamp.show { transform: scale(1) rotate(-9deg); opacity: 1; }
.stamp b { font-family: var(--f-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stamp span { font-family: var(--f-display); font-size: 11px; letter-spacing: 0.22em; }
.inbox { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.inbox li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; padding: 8px 10px; border-radius: 9px; background: rgba(255, 211, 107, 0.07); }
.inbox li b { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox li em { font-style: normal; font-family: var(--f-display); color: var(--ok); font-variant-numeric: tabular-nums; }
.inbox li span { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.btn.p-toggle { display: none; margin-left: auto; }
.lbl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: 0.55; }
.lbl.is-busy .dot { opacity: 1; animation: pulse 1s ease-in-out infinite; }
.lbl small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.lbl.project { font-size: 10px; padding: 3px 8px; border-style: dashed; box-shadow: none; }
@keyframes pulse { 50% { transform: scale(1.6); box-shadow: 0 0 10px var(--c); } }

/* ---------- HUD grid ---------- */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-columns: minmax(0, 360px) minmax(0, 1fr) minmax(0, 370px);
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud > * { pointer-events: auto; min-width: 0; }
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r);
}

/* top bar */
.top { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: radial-gradient(circle at 50% 30%, #bfe8ff, var(--ray) 45%, #11307a 100%); box-shadow: 0 0 22px rgba(77, 163, 255, 0.55); position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 14px; transform: translateX(-50%); background: linear-gradient(var(--ray-hi), transparent); }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.15; }
.brand p { margin: 0; font-size: 11px; color: var(--muted); }
.metrics { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.metrics::-webkit-scrollbar { display: none; }
.metric { padding: 7px 12px; display: grid; min-width: 86px; flex: 0 0 auto; }
.metric b { font-family: var(--f-display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.metric span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.controls { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line);
  background: var(--glass);
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: var(--glass-hi); border-color: rgba(154, 216, 255, 0.45); }
.btn[aria-pressed="true"] { border-color: rgba(154, 216, 255, 0.6); color: var(--ray-hi); }
.btn .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* feed */
.feed { grid-column: 1; grid-row: 2; align-self: end; display: flex; flex-direction: column; gap: 8px; max-height: min(100%, 560px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-right: 2px; }
.feed-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.feed-head h2 { margin: 0; font-family: var(--f-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.feed-head span { font-size: 11px; color: var(--muted); }
.task { padding: 11px 12px 12px; display: grid; gap: 8px; animation: rise 0.35s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.task header { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.task .tid { font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: 0 0 auto; }
.task .ttl { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; text-transform: uppercase; letter-spacing: 0.06em; }
.badge.you { color: var(--ray-hi); border-color: rgba(154, 216, 255, 0.4); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.steps li { font-size: 9.5px; color: var(--muted); padding-top: 6px; border-top: 3px solid rgba(124, 156, 236, 0.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.done { border-color: var(--ok); color: var(--fg); }
.steps li.now { border-color: var(--busy); color: var(--busy); }
.steps li.back { border-color: var(--warn); color: var(--warn); }
.teams-row { display: flex; gap: 4px; flex-wrap: wrap; }
.tchip { font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 70%, white); }
.status { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.score { display: flex; align-items: baseline; gap: 6px; }
.score b { font-family: var(--f-display); font-size: 20px; color: var(--ok); font-variant-numeric: tabular-nums; }
.score span { font-size: 11px; color: var(--muted); }
.task.is-done:not(:first-of-type):not(:hover):not(:focus-within) .result ul { display: none; }
.task.is-done { outline: none; }
.result ul { margin: 0; padding-left: 16px; font-size: 12px; color: #c9d3f2; display: grid; gap: 2px; }

/* panel */
.panel { grid-column: 3; grid-row: 2 / span 2; align-self: start; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 16px; display: grid; gap: 14px; scrollbar-width: thin; }
.p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
.p-head h2 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
.icon-btn:hover { background: var(--glass-hi); }
.p-role { margin: 0; color: #c9d3f2; }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.p-stat { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; display: grid; }
.p-stat b { font-family: var(--f-display); font-size: 15px; font-variant-numeric: tabular-nums; }
.p-stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.panel h3 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.agent { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 9px; border-radius: 9px; background: rgba(124, 156, 236, 0.06); }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--c) 28%, #0b1430); color: color-mix(in srgb, var(--c) 60%, white); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.agent .who { min-width: 0; }
.agent .who b { display: block; font-size: 13px; }
.agent .who span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { font-size: 10px; padding: 3px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.state.idle { color: var(--muted); background: rgba(147, 160, 201, 0.1); }
.state.busy { color: var(--busy); background: rgba(111, 231, 255, 0.12); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-family: var(--f-mono); font-size: 11.5px; }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 8px; color: #c9d3f2; animation: rise 0.25s ease both; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log b { color: color-mix(in srgb, var(--c) 70%, white); font-weight: 500; }
.log .empty, .works .empty { color: var(--muted); display: block; font-size: 12px; }
.projects { display: flex; gap: 6px; flex-wrap: wrap; }
.proj { font-size: 11.5px; padding: 5px 9px; border-radius: 7px; border: 1px dashed var(--line); color: #c9d3f2; }
.proj b { color: var(--fg); }

/* command bar */
.command { grid-column: 1 / 3; grid-row: 3; display: grid; gap: 8px; max-width: 760px; }
.cmd-row { display: flex; gap: 8px; padding: 6px; }
.cmd-row input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0; padding: 8px 10px; font-size: 14px; }
.cmd-row input::placeholder { color: var(--muted); }
.cmd-row:focus-within { border-color: rgba(154, 216, 255, 0.55); }
.go { border: 0; border-radius: 9px; padding: 9px 16px; background: linear-gradient(180deg, #6db6ff, #2f7ff0); color: #04122e; font-weight: 700; font-size: 13px; white-space: nowrap; }
.go:hover { filter: brightness(1.08); }
.suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.suggest::-webkit-scrollbar { display: none; }
.sg { flex: 0 0 auto; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 6px 11px; font-size: 12px; color: #c9d3f2; }
.sg:hover { color: var(--fg); border-color: rgba(154, 216, 255, 0.45); }

.hint { grid-column: 2; grid-row: 2; align-self: start; justify-self: center; padding: 10px 14px; font-size: 12px; color: #c9d3f2; transition: opacity 0.4s ease; max-width: 560px; }
.hint ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hint li { display: contents; }
.hint kbd { font-family: var(--f-mono); font-size: 11px; color: var(--ray-hi); white-space: nowrap; }
.hint.gone { opacity: 0; pointer-events: none; }

.toast { box-sizing: border-box; position: fixed; left: 50%; top: calc(max(16px, env(safe-area-inset-top, 0px)) + 64px); transform: translate(-50%, -10px); opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; padding: 10px 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; max-width: calc(100vw - 32px); z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: var(--ok); font-family: var(--f-display); }
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* real-agent UI */
.feed-list { display: flex; flex-direction: column; gap: 8px; }
.empty-card { padding: 14px; font-size: 12.5px; color: #c9d3f2; display: grid; gap: 6px; }
.empty-card b { color: var(--fg); font-size: 13px; }
.badge.ok { color: var(--ok); border-color: rgba(91, 228, 155, 0.4); }
.badge.run { color: var(--busy); border-color: rgba(111, 231, 255, 0.4); }
.badge.err { color: var(--warn); border-color: rgba(255, 181, 71, 0.4); }
.status.err { color: var(--warn); white-space: normal; }
.verdict { margin: 0; font-size: 12px; color: #c9d3f2; }
.t-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: rgba(124, 156, 236, 0.08); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.mini:hover { border-color: rgba(154, 216, 255, 0.5); }
.mini.primary { background: linear-gradient(180deg, #6db6ff, #2f7ff0); color: #04122e; border-color: transparent; }
.cmd-note { margin: 0; padding: 8px 12px; font-size: 12px; color: #c9d3f2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cmd-note:empty { display: none; }
.cmd-note.shake { animation: shake 0.4s ease; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.go:disabled, .sg:disabled, .cmd-row input:disabled { opacity: 0.45; cursor: not-allowed; }
.live-pre { margin: 0; max-height: 220px; overflow: auto; background: #060a18; border: 1px solid var(--line); border-radius: 9px; padding: 10px; font-family: var(--f-mono); font-size: 11px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; color: #cfe0ff; }
.works { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.work-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; background: rgba(124, 156, 236, 0.07); color: var(--fg); }
.work-btn:hover { border-color: rgba(154, 216, 255, 0.4); }
.work-btn b { font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-btn em { font-style: normal; font-family: var(--f-display); color: var(--ok); font-variant-numeric: tabular-nums; }
.work-btn span { grid-column: 1 / -1; font-size: 11px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--busy); margin-left: 6px; vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
.report { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(3, 6, 16, 0.74);
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.report-card { width: min(940px, 100%); height: min(90vh, 100%); display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: #0b1230; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.r-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 16px 18px 12px; flex-wrap: wrap; }
.r-titles { min-width: 0; flex: 1 1 260px; }
.r-head h2 { margin: 0; font-family: var(--f-display); font-size: 18px; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.r-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.r-tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.r-tabs::-webkit-scrollbar { display: none; }
.r-tab { border: 0; background: transparent; padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; flex: 0 0 auto; }
.r-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--c); }
.r-body { overflow: auto; padding: 18px 22px 30px; overscroll-behavior: contain; min-width: 0; }
.r-live { display: flex; align-items: center; gap: 4px; margin: 0 0 12px; font-size: 11.5px; color: var(--busy); }
.md { font-size: 14.5px; line-height: 1.6; color: #d9e2ff; }
.md > * { max-width: 76ch; }
.md h1 { font-family: var(--f-display); font-size: 20px; line-height: 1.25; margin: 0 0 14px; color: var(--fg); }
.md h2 { font-family: var(--f-display); font-size: 17px; margin: 24px 0 8px; color: var(--fg); }
.md h3 { font-size: 15px; margin: 18px 0 6px; color: var(--fg); }
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md li { margin: 3px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md code { font-family: var(--f-mono); font-size: 12.5px; background: rgba(124, 156, 236, 0.14); padding: 1px 5px; border-radius: 4px; }
.md pre { max-width: 100%; background: #050916; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; line-height: 1.5; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 12px; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; }
.md blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 3px solid var(--warn); color: #c9d3f2; }
.md a { color: var(--ray-hi); }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.mobile-only { display: none; }

@media (max-width: 1520px) {
  .controls .lbl-txt { display: none; }
}
@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
  .brand p, .controls .lbl-txt { display: none; }

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   DATA — команды, агенты, реплики
   ================================================================ */
const TEAMS = {
  hq: {
    name: 'Штаб «Луч»', short: 'Штаб', step: 1, color: 0x6fe7ff, pos: [0, 0],
    role: 'Оркестратор. Разбирает задачу, раздаёт командам и следит, чтобы никто не филонил.',
    agents: [['Луч', 'оркестратор'], ['Диспетчер', 'роутинг задач'], ['Летописец', 'ведёт протокол']],
  },
  dev: {
    name: 'Разработка', short: 'Разработка', step: 2, color: 0x4da3ff, pos: [-28, 0],
    role: 'Фронт, бэк, базы и деплой. Здесь живут VELORA и БухМет.',
    agents: [['Фронт', 'React / Next.js'], ['Бэк', 'API и Postgres'], ['Девопс', 'Docker и деплой'], ['Джун', 'пишет тесты и ноет']],
  },
  design: {
    name: 'Дизайн', short: 'Дизайн', step: 2, color: 0xb48cff, pos: [-14, -28],
    role: 'Интерфейсы, бренд и анимации. Двигают пиксели, пока не станет красиво.',

  marketing: {

    agents: [['Сторисмейкер', 'рилсы и сторис'], ['Копирайтер', 'тексты и хуки'], ['Таргетолог', 'реклама и охваты']],
  },
  qa: {
    name: 'Перепроверка', short: 'QA', step: 3, color: 0xffb547, pos: [28, 0],
    role: 'QA. Ищут косяки до того, как их найдёшь ты.',
    agents: [['Зануда', 'ручные проверки'], ['Автотест', 'Playwright'], ['Параноик', 'безопасность']],
  },
  analytics: {
    name: 'AI-аналитика', short: 'Аналитика', step: 4, color: 0x5be49b, pos: [14, 28],
    role: 'Ставят каждой задаче оценку из 10 и решают, можно ли показывать боссу.',
    agents: [['Аналитик', 'оценка 0–10'], ['Скептик', 'ищет дыры в логике'], ['Цифровик', 'метрики']],
  },
  delivery: {
    name: 'Отправка', short: 'Отправка', step: 5, color: 0xffd38a, pos: [-14, 28],
    role: 'Упаковывают результат и отправляют боссу.',
    agents: [['Курьер', 'упаковка'], ['Почтальон', 'отправка боссу']],
  },
};
const PRODUCTION = ['dev', 'design', 'marketing'];
const PROJECTS = [
  { id: 'velora', name: 'VELORA', note: 'Next.js · Postgres', pos: [-42, 14], color: 0x9a7bff },
  { id: 'buhmet', name: 'БухМет', note: 'поиск собутыльников', pos: [-42, -14], color: 0xffb03a },
];
const SAMPLES = [
  'Онбординг-экран для БухМета',
  'Сценарий рилса про VELORA',
  'Логотип и палитра для B1ueRay',
  'Телеграм-бот для заявок на Node.js',
  'План запуска БухМета на 2 недели',
  'API для поиска людей рядом в БухМете',
];
const STEP_NAMES = ['Штаб', 'Команды', 'QA', 'Аналитика', 'Отправка'];
const BOSS = { name: 'Дом босса', pos: [42, 14], color: 0xffd36b };

/* ================================================================
   ENV
   ================================================================ */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = matchMedia('(max-width: 760px)').matches || /Mobi|Android/i.test(navigator.userAgent);
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const hex = (n) => '#' + n.toString(16).padStart(6, '0');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Браузер не дал WebGL, поэтому город не нарисовался. Открой страницу в свежем Chrome, Safari или Firefox.</div>');
  throw e;
}
const fullRatio = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 1.75);
let pixelRatio = fullRatio;
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('scene').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: $('labels') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const NIGHT_BG = new THREE.Color(0x070b1a);
const DAY_BG = new THREE.Color(0xaec3ea);
scene.background = NIGHT_BG.clone();
scene.fog = new THREE.FogExp2(0x070b1a, 0.0062);

const camera = new THREE.PerspectiveCamera(isMobile ? 50 : 40, innerWidth / innerHeight, 0.5, 700);
const HOME = {
  pos: isMobile ? new THREE.Vector3(86, 120, 120) : new THREE.Vector3(60, 60, 84),
  target: isMobile ? new THREE.Vector3(0, 2, 0) : new THREE.Vector3(-7, 2, 7),
};
camera.position.copy(HOME.pos);

// Map-style flight: drag moves over the city, right-drag / Shift+drag / two fingers turn,
// wheel or pinch zooms toward the cursor, WASD / arrows fly, Q/E turn, R/F up/down.
const controls = new MapControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.screenSpacePanning = false;
controls.zoomToCursor = true;
controls.panSpeed = 1.1;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 1.2;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 9;
controls.maxDistance = 260;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.3;
function stopAuto() { controls.autoRotate = false; }
controls.addEventListener('start', stopAuto);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(pixelRatio);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.5, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let fxOn = true;

/* ================================================================
   LIGHTS + GROUND
   ================================================================ */
const hemi = new THREE.HemisphereLight(0x9cbcff, 0x0a1024, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xc6d8ff, 1.0);
sun.position.set(-50, 90, 40);
scene.add(sun);
const hqGlow = new THREE.PointLight(0x6fe7ff, 600, 90, 1.7);
hqGlow.position.set(0, 24, 0);
scene.add(hqGlow);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0x0c1430, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.01;
scene.add(ground);

// city plate, like a lit model on a table
const plateMat = new THREE.MeshStandardMaterial({ color: 0x1a2550, roughness: 0.85, metalness: 0.05 });
const plate = new THREE.Mesh(new THREE.BoxGeometry(140, 1, 140), plateMat);
plate.position.y = -0.5;
scene.add(plate);
const plateEdge = new THREE.LineSegments(new THREE.EdgesGeometry(plate.geometry), new THREE.LineBasicMaterial({ color: 0x4da3ff, transparent: true, opacity: 0.45 }));
plateEdge.position.copy(plate.position);
scene.add(plateEdge);

const ROAD = [];
for (let k = 0; k < 10; k++) ROAD.push(-63 + 14 * k);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x27346a, roughness: 0.9 });
const roadLineMat = new THREE.MeshBasicMaterial({ color: 0x5b7fe0, transparent: true, opacity: 0.35 });
const roadGeo = new THREE.PlaneGeometry(140, 2.4);
const lineGeo = new THREE.PlaneGeometry(140, 0.09);
for (const r of ROAD) {
  for (const axis of ['x', 'z']) {
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    const line = new THREE.Mesh(lineGeo, roadLineMat);
    line.rotation.x = -Math.PI / 2;
    if (axis === 'x') { road.position.set(0, 0.01, r); line.position.set(0, 0.02, r); }
    else { road.rotation.z = Math.PI / 2; road.position.set(r, 0.012, 0); line.rotation.z = Math.PI / 2; line.position.set(r, 0.022, 0); }
    scene.add(road, line);
  }
}

/* ================================================================
   TEXTURES
   ================================================================ */
function windowTexture(repeatY, palette) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 64);
  for (let y = 3; y < 64; y += 8) {
    for (let x = 3; x < 64; x += 8) {
      const r = Math.random();
      if (r < 0.5) {
        g.globalAlpha = 0.35 + Math.random() * 0.65;
        g.fillStyle = r < 0.34 ? palette[0] : r < 0.44 ? palette[1] : palette[2];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, repeatY);
  return t;
}
const WARM = ['#ffcf8a', '#9fd0ff', '#ffffff'];
const windowMats = [];

function screenTexture(color, title) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = '#0b1330'; g.fillRect(0, 0, 256, 160);
  g.fillStyle = hex(color); g.globalAlpha = 0.9; g.fillRect(0, 0, 256, 22);
  g.globalAlpha = 1; g.fillStyle = '#06102a'; g.font = '600 13px Manrope, sans-serif'; g.fillText(title, 10, 15);
  for (let i = 0; i < 7; i++) {
    const w = 60 + Math.random() * 150;
    g.fillStyle = i % 3 === 0 ? hex(color) : '#c9d6ff';
    g.globalAlpha = i % 3 === 0 ? 0.8 : 0.35;
    g.fillRect(i % 2 ? 256 - 14 - w : 14, 32 + i * 17, w, 9);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================================================================
   FILLER CITY (instanced)
   ================================================================ */
const KEY_SPOTS = [...Object.values(TEAMS).map((t) => t.pos), ...PROJECTS.map((p) => p.pos), BOSS.pos];
function keyDist(x, z) { let d = Infinity; for (const [kx, kz] of KEY_SPOTS) d = Math.min(d, Math.hypot(x - kx, z - kz)); return d; }
function nearKey(x, z) {
  for (const [kx, kz] of KEY_SPOTS) if (Math.abs(x - kx) < 7.2 && Math.abs(z - kz) < 7.2) return true;
  return false;
}
function inCamCorridor(x, z) {
  for (const [id, t] of [...Object.entries(TEAMS), ['boss', BOSS]]) {
    const [bx, bz] = t.pos;
    const L = Math.hypot(bx, bz) || 1;
    const [ox, oz] = id === 'hq' ? [0.55, 0.83] : [bx / L, bz / L];
    const dx = x - bx, dz = z - bz;
    const along = dx * ox + dz * oz;
    const across = dx * oz - dz * ox; // + is the camera's side offset
    if (along > 2 && along < 24 && across > -4 && across < 10) return true;
  }
  return false;
}
const lots = [];
for (let bx = 0; bx < 9; bx++) {
  for (let bz = 0; bz < 9; bz++) {
    const x0 = ROAD[bx] + 1.2, z0 = ROAD[bz] + 1.2;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        const x = x0 + 2.1 + i * 3.9, z = z0 + 2.1 + j * 3.9;
        if (nearKey(x, z) || inCamCorridor(x, z) || Math.random() < 0.12) continue;
        const d = Math.hypot(x, z);
        const tall = Math.random() < (d < 45 ? 0.07 : 0.03);
        let h = tall ? rand(9, 22) : rand(1.4, 5) + (d < 40 ? rand(0, 2.5) : 0);
        if (keyDist(x, z) < 15) h = Math.min(h, rand(2, 6));
        lots.push({ x, z, h, w: rand(2.2, 3.3), dd: rand(2.2, 3.3) });
      }
    }
  }
}
const buckets = [
  { max: 5, rep: 2, items: [] },
  { max: 11, rep: 4, items: [] },
  { max: 99, rep: 9, items: [] },
];
for (const l of lots) buckets.find((b) => l.h < b.max).items.push(l);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
boxGeo.translate(0, 0.5, 0);
const roofMat = new THREE.MeshStandardMaterial({ color: 0x2b3d7c, roughness: 0.8 });
const tmpM = new THREE.Matrix4();
const tmpC = new THREE.Color();
for (const b of buckets) {
  const side = new THREE.MeshStandardMaterial({ color: 0x223571, roughness: 0.75, metalness: 0.1, emissive: 0xffffff, emissiveMap: windowTexture(b.rep, WARM), emissiveIntensity: 0.55 });
  side.userData.base = 0.55;
  windowMats.push(side);
  const mesh = new THREE.InstancedMesh(boxGeo, [side, side, roofMat, roofMat, side, side], b.items.length);
  b.items.forEach((l, i) => {
    tmpM.makeScale(l.w, l.h, l.dd);
    tmpM.setPosition(l.x, 0, l.z);
    mesh.setMatrixAt(i, tmpM);
    tmpC.setHSL(0.62 + rand(-0.03, 0.03), 0.45, rand(0.42, 0.62));
    mesh.setColorAt(i, tmpC);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
}

// little trees in the gaps
const treeGeo = new THREE.ConeGeometry(0.55, 1.6, 6);
treeGeo.translate(0, 0.8, 0);
const trees = new THREE.InstancedMesh(treeGeo, new THREE.MeshStandardMaterial({ color: 0x2f8f6a, roughness: 0.9, emissive: 0x0b3324 }), 140);
let tc = 0;
for (let n = 0; n < 600 && tc < 140; n++) {
  const x = rand(-66, 66), z = rand(-66, 66);
  if (nearKey(x, z) || ROAD.some((r) => Math.abs(x - r) < 1.8 || Math.abs(z - r) < 1.8)) continue;
  if (lots.some((l) => Math.abs(l.x - x) < l.w / 2 + 0.6 && Math.abs(l.z - z) < l.dd / 2 + 0.6)) continue;
  tmpM.makeScale(1, rand(0.7, 1.3), 1);
  tmpM.setPosition(x, 0, z);
  trees.setMatrixAt(tc++, tmpM);
}
trees.count = tc;
scene.add(trees);

/* ================================================================
   KEY BUILDINGS
   ================================================================ */
const buildings = {};
const hitTargets = [];
const labelTargets = [];
const spinners = [];

function bodyMat(color, rep = 4) {
  const base = new THREE.Color(0x1c2b60).lerp(new THREE.Color(color), 0.22);
  const m = new THREE.MeshStandardMaterial({ color: base, roughness: 0.55, metalness: 0.25, emissive: 0xffffff, emissiveMap: windowTexture(rep, [hex(color), '#ffcf8a', '#ffffff']), emissiveIntensity: 1 });
  m.userData.base = 1;
  windowMats.push(m);
  return m;
}
function glowMat(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, blending: opacity < 1 ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: opacity >= 1 });
}
function solidMat(color) {

function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function drawWall(id) {
  const b = buildings[id];
  if (!b || !b.interior.wall) return;
  const { canvas, tex } = b.interior.wall;
  const g = canvas.getContext('2d');
  const c = hex(b.team.color);
  const n = b.team.agents.length;
  const busyN = b.agentState.filter((x) => x === 'busy').length;
  g.fillStyle = '#0b1330'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = c; g.fillRect(0, 0, 512, 36);
  g.fillStyle = '#06102a';
  g.font = '700 17px Unbounded, Manrope, sans-serif';
  g.fillText(b.team.name, 14, 24);
  g.font = '700 14px Manrope, sans-serif';
  g.textAlign = 'right';
  g.fillText(`${busyN}/${n} заняты · ${b.done} задач`, 498, 24);
  g.textAlign = 'left';
  const scoreBox = id === 'analytics' && lastScore != null;
  const maxW = scoreBox ? 330 : 470;
  if (b.liveText) {
    // what the agents are typing, as it streams in
    g.font = '500 12.5px "JetBrains Mono", ui-monospace, monospace';
    g.fillStyle = '#cfe0ff';
    const lines = [];
    for (const raw of b.liveText.slice(-1400).split('\n')) {
      let line = raw;
      while (line.length > 62) { lines.push(line.slice(0, 62)); line = line.slice(62); }
      lines.push(line);
    }
    lines.slice(-11).forEach((ln, i) => g.fillText(ln, 14, 58 + i * 18));
    g.fillStyle = c;
    g.fillRect(14 + Math.min(62, (lines[lines.length - 1] || '').length) * 7.5, 46 + Math.min(10, lines.length - 1) * 18, 8, 15);
    tex.needsUpdate = true;
    return;
  }
  const logs = b.logs.slice(-5);
  g.font = '500 14px Manrope, sans-serif';
  if (!logs.length) { g.fillStyle = '#93a0c9'; g.fillText('Ждём задачу из штаба…', 16, 70); }
  logs.forEach((l, i) => {
    const y = 46 + i * 41;
    const txt = fitText(g, `${l.who}: ${l.text}`, maxW - 24);
    const w = Math.min(maxW, g.measureText(txt).width + 24);
    g.fillStyle = i % 2 ? 'rgba(201,214,255,0.14)' : c + '40';
    if (g.roundRect) { g.beginPath(); g.roundRect(14, y, w, 32, 9); g.fill(); } else g.fillRect(14, y, w, 32);
    g.fillStyle = '#e7edff';
    g.fillText(txt, 26, y + 21);
  });
  if (scoreBox) {
    g.fillStyle = 'rgba(91,228,155,0.12)'; g.fillRect(360, 46, 138, 196);
    g.fillStyle = '#5be49b';
    g.font = '700 54px Unbounded, Manrope, sans-serif';
    g.textAlign = 'center';
    g.fillText(lastScore.toFixed(1), 429, 140);
    g.font = '600 13px Manrope, sans-serif';
    g.fillText('последняя оценка', 429, 172);
    g.textAlign = 'left';
  }
  tex.needsUpdate = true;
}

  mid.y = Math.max(a.y, b.y) + lift + a.distanceTo(b) * 0.22;

}
const arcs = [];
const arcMap = new Map();
function staticArc(a, b, color, key) {
  const curve = arcCurve(a, b);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, 0.055, 6, false), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(tube);
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), glowMat(color));
  scene.add(spark);
  const arc = { curve, spark, t: Math.random(), speed: rand(0.08, 0.16), tube, active: 0 };
  arcs.push(arc);

}

/* ================================================================

   ================================================================ */
const walkers = [];
const walkerGeo = new THREE.CapsuleGeometry(0.22, 0.38, 3, 8);
walkerGeo.translate(0, 0.42, 0);
const walkerColors = Object.values(TEAMS).map((t) => t.color);
for (let i = 0; i < (isMobile ? 18 : 30); i++) {
  const m = new THREE.Mesh(walkerGeo, new THREE.MeshStandardMaterial({ color: pick(walkerColors), emissive: 0x111111, roughness: 0.6 }));
  const alongX = Math.random() < 0.5;
  const lane = pick(ROAD) + (Math.random() < 0.5 ? 0.75 : -0.75);
  const p = rand(-60, 60);
  m.position.set(alongX ? p : lane, 0, alongX ? lane : p);
  scene.add(m);
  walkers.push({ m, dir: alongX ? new THREE.Vector3(Math.random() < 0.5 ? 1 : -1, 0, 0) : new THREE.Vector3(0, 0, Math.random() < 0.5 ? 1 : -1), speed: rand(1.6, 3.2), phase: rand(0, 6) });
}
function nearestRoad(v) { let best = ROAD[0]; for (const r of ROAD) if (Math.abs(v - r) < Math.abs(v - best)) best = r; return best; }
function updateWalkers(dt) {
  for (const w of walkers) {
    const p = w.m.position;
    const axis = w.dir.x !== 0 ? 'x' : 'z';
    const before = p[axis];
    p.addScaledVector(w.dir, w.speed * dt);
    const after = p[axis];
    for (const r of ROAD) {
      if ((before - r) * (after - r) <= 0 && Math.random() < 0.3) {
        const other = axis === 'x' ? 'z' : 'x';
        const side = p[other] - nearestRoad(p[other]);
        p[axis] = r + (Math.random() < 0.5 ? 0.75 : -0.75);
        p[other] = nearestRoad(p[other]) + side;
        const s = Math.random() < 0.5 ? 1 : -1;
        w.dir.set(other === 'x' ? s : 0, 0, other === 'z' ? s : 0);
        break;
      }
    }
    if (Math.abs(p.x) > 64 || Math.abs(p.z) > 64) { w.dir.multiplyScalar(-1); p.x = THREE.MathUtils.clamp(p.x, -63.5, 63.5); p.z = THREE.MathUtils.clamp(p.z, -63.5, 63.5); }
    w.phase += dt * w.speed * 4;
    w.m.position.y = Math.abs(Math.sin(w.phase)) * 0.08;
  }
}

   ================================================================ */
let speed = 1;
const waits = [];
const wait = (ms) => new Promise((r) => waits.push({ left: ms, r }));
const orbs = [];
const orbGeo = new THREE.SphereGeometry(0.6, 16, 12);
const trailGeo = new THREE.SphereGeometry(0.3, 8, 6);
function travel(from, to, color = 0xffffff) {
  const at = (id, spread) => id === 'sky' ? SKY.clone().add(new THREE.Vector3(rand(-spread, spread), 0, rand(-spread, spread))) : id === 'boss' ? boss.anchor.clone() : B(id).clone();
  const a = at(from, 10);
  const b = at(to, 20);
  const curve = arcCurve(a, b);
  const arc = arcMap.get(`${from}>${to}`);
  if (arc) arc.active++;
  const head = new THREE.Mesh(orbGeo, glowMat(0xffffff));
  const halo = new THREE.Mesh(orbGeo, glowMat(color, 0.55));
  halo.scale.setScalar(1.9);
  head.add(halo);
  scene.add(head);
  const trail = [];
  for (let i = 0; i < 7; i++) { const t = new THREE.Mesh(trailGeo, glowMat(color, 0.5 - i * 0.06)); t.scale.setScalar(1 - i * 0.11); scene.add(t); trail.push(t); }
  const dur = 1.3 + curve.getLength() * 0.018;
  return new Promise((resolve) => orbs.push({ curve, head, trail, t: 0, dur, resolve: () => { if (arc) arc.active--; resolve(); } }));
}
function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t = Math.min(1, o.t + (dt * speed) / o.dur);
    const k = o.t < 0.5 ? 2 * o.t * o.t : 1 - Math.pow(-2 * o.t + 2, 2) / 2;
    o.head.position.copy(o.curve.getPoint(k));
    o.trail.forEach((tr, j) => tr.position.copy(o.curve.getPoint(Math.max(0, k - (j + 1) * 0.018))));
    if (o.t >= 1) {
      scene.remove(o.head); o.trail.forEach((tr) => scene.remove(tr));
      o.head.children[0].material.dispose(); o.head.material.dispose(); o.trail.forEach((tr) => tr.material.dispose());
      orbs.splice(i, 1);
      o.resolve();
    }
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function short(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '\n\n…(обрезано)' : s; }
function titleOf(md) { const m = /^#\s+(.+)$/m.exec(md || ''); return short(m ? m[1] : md, 70); }
function slugify(t) {
  const map = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ы: 'y', э: 'e', ю: 'yu', я: 'ya' };
  return String(t).toLowerCase().split('').map((c) => map[c] ?? (/[a-z0-9]/.test(c) ? c : '-')).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 32) || 'task';
}
function clock() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

function normQa(q, teams) {

    .slice(0, 3)
    .map((i) => ({ team: i.team, problem: String(i.problem).slice(0, 400), fix: String(i.fix || '').slice(0, 400) }));
  return { verdict: q?.verdict === 'fix' && issues.length ? 'fix' : 'ok', issues, report: String(q?.report || '').slice(0, 8000) };
}
function normAn(a) {
  let s = Number(a?.score);
  if (!Number.isFinite(s)) s = 0;
  s = Math.round(Math.max(0, Math.min(10, s)) * 10) / 10;
  const arr = (x) => (Array.isArray(x) ? x : []).map((v) => String(v).slice(0, 300)).slice(0, 5);
  return { score: s, verdict: String(a?.verdict || '').slice(0, 300), strengths: arr(a?.strengths), risks: arr(a?.risks), next: arr(a?.next) };

// ---------- one agent call ----------
async function ask(id, task, prompt, { json = false, tier = 'default' } = {}) {
  const b = buildings[id];
  let last = 0;
  const onText = ({ text }) => {
    task.live[id] = text;
    b.liveText = json ? null : text;
    const now = performance.now();
    if (now - last < 350) return;
    last = now;
    liveTick(id, task);
  };
  try {
    const opts = { modelTier: tier, signal: task.ctl.signal, cache: false, onText };
    if (json) return await sample.json(prompt, opts);
    const r = await sample(prompt, opts);
    return r.truncated ? r.text + '\n\n_Ответ обрезан по длине._' : r.text;
  } finally {
    delete task.live[id];
    b.liveText = null;
    liveTick(id, task);
  }
}

function log(id, task, text, who) {
  const b = buildings[id];
  const entry = { time: clock(), who: who || b.team.agents[0][0], text, task: task?.id };
  b.logs.push(entry);
  if (b.logs.length > 40) b.logs.shift();
  if (task) task.statusLine = `${b.team.short} · ${entry.who}: ${text}`;
  renderFeedSoon();
  if (selected === id) { renderPanel(); drawWall(id); }
}

function setBusy(id, on) {
  const b = buildings[id];
  b.busy = Math.max(0, b.busy + (on ? 1 : -1));
  const n = b.team.agents.length;
  if (on) {
    const want = Math.max(1, Math.ceil(n * 0.66));
    let made = b.agentState.filter((s) => s === 'busy').length;
    for (let i = 0; i < n && made < want; i++) if (b.agentState[i] !== 'busy') { b.agentState[i] = 'busy'; made++; }
  } else if (b.busy === 0) {
    b.agentState = b.agentState.map(() => 'idle');
  }
  b.label.el.classList.toggle('is-busy', b.busy > 0);
  const small = document.getElementById('lbl-' + id);
  if (small) small.textContent = b.busy > 0 ? 'работает' : `${n} аг.`;
  updateMetrics();
  if (selected === id) { renderPanel(); drawWall(id); }
}

// ---------- the pipeline ----------
function runningHere() { return tasks.filter((t) => t.local && t.status === 'running').length; }
function nextN() { return tasks.reduce((m, t) => Math.max(m, t.n || 0), 0) + 1; }

async function runTask(raw) {
  const text = String(raw || '').trim().slice(0, 300);
  if (!text) return;
  if (agentsState !== 'ready') { setAgentsState(agentsState); $('cmd-note').classList.add('shake'); setTimeout(() => $('cmd-note').classList.remove('shake'), 500); return; }
  if (runningHere() >= 2) { flashNote('Две задачи уже в работе. Дождись одной, потом давай следующую.'); return; }
  const task = {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    n: nextN(), text, createdAt: new Date().toISOString(), doneAt: null,
    status: 'running', stage: 0, teams: [], briefs: {}, plan: '', outputs: {},
    qa: null, revised: [], analytics: null, error: null,
    local: true, live: {}, ctl: new AbortController(), busy: new Set(), back: false,
    statusLine: 'Задача летит в штаб…',
  };
  tasks.unshift(task);
  renderFeedSoon(); updateMetrics(); persist(task);
  // a parallel branch that wakes up after the run ended (stop / error) must not grab a building
  const enter = (id) => {
    if (task.finished || task.ctl.signal.aborted) throw { code: 'cancelled', message: 'run ended' };
    setBusy(id, true);
    task.busy.add(id);
  };
  const leave = (id) => { if (task.busy.delete(id)) setBusy(id, false); };

  try {
    // 1 · HQ: real plan + briefs
    await travel('sky', 'hq', TEAMS.hq.color);
    enter('hq');
    log('hq', task, `Разбираю задачу: «${short(text, 40)}»`, 'Луч');
    const plan = await ask('hq', task, hqPrompt(text), { json: true, tier: 'quick' });
    const picked = (Array.isArray(plan?.teams) ? plan.teams : []).filter((x) => x && PRODUCTION.includes(x.id) && typeof x.brief === 'string' && x.brief.trim());
    const uniq = [...new Map(picked.map((x) => [x.id, x])).values()].slice(0, 3);
    if (!uniq.length) uniq.push({ id: 'dev', brief: text });
    task.plan = String(plan?.plan || '').slice(0, 600);
    task.teams = uniq.map((x) => x.id);
    for (const x of uniq) task.briefs[x.id] = x.brief.trim().slice(0, 800);
    leave('hq');
    buildings.hq.done++;
    log('hq', task, `Раскидал по командам: ${task.teams.map((id) => TEAMS[id].short).join(', ')}`, 'Диспетчер');
    task.stage = 1;
    persist(task);

    // 2 · teams write the actual deliverables, in parallel
    await Promise.all(task.teams.map(async (id) => {
      await travel('hq', id, TEAMS[id].color);
      enter(id);
      log(id, task, `Взяли ТЗ: ${short(task.briefs[id], 70)}`, TEAMS[id].agents[0][0]);
      task.outputs[id] = await ask(id, task, teamPrompt(id, task));
      leave(id);
      buildings[id].done++;
      log(id, task, `Сдали: ${titleOf(task.outputs[id])}`, TEAMS[id].agents[0][0]);
      persist(task);
      await travel(id, 'qa', TEAMS[id].color);
    }));

    // 3 · QA reviews, sends real issues back once
    task.stage = 2;
    enter('qa');
    log('qa', task, `Проверяю ${task.teams.length === 1 ? 'результат' : task.teams.length + ' результата'}`, 'Зануда');
    task.qa = normQa(await ask('qa', task, qaPrompt(task), { json: true }), task.teams);
    leave('qa');
    const nIss = task.qa.issues.length;
    log('qa', task, task.qa.verdict === 'fix' ? `Нашёл ${nIss} ${plural(nIss, 'проблему', 'проблемы', 'проблем')}, отправляю на доработку` : 'Серьёзных проблем не нашёл', 'Зануда');
    persist(task);
    if (task.qa.verdict === 'fix') {
      task.back = true;
      renderFeedSoon();
      const byTeam = {};
      for (const i of task.qa.issues) (byTeam[i.team] ||= []).push(i);
      await Promise.all(Object.entries(byTeam).map(async ([id, list]) => {
        await travel('qa', id, TEAMS.qa.color);
        enter(id);
        log(id, task, `Дорабатываем по замечаниям QA: ${list.length}`, TEAMS[id].agents[0][0]);
        task.outputs[id] = await ask(id, task, teamPrompt(id, task, list));
        leave(id);
        task.revised.push(id);
        log(id, task, 'Исправили и пересдали', TEAMS[id].agents[0][0]);
        persist(task);
        await travel(id, 'qa', TEAMS[id].color);
      }));
      task.back = false;
    }
    buildings.qa.done++;

    // 4 · analytics: honest score with reasons
    task.stage = 3;
    await travel('qa', 'analytics', TEAMS.analytics.color);
    enter('analytics');
    log('analytics', task, 'Оцениваю результат', 'Аналитик');
    task.analytics = normAn(await ask('analytics', task, analyticsPrompt(task), { json: true }));
    leave('analytics');
    lastScore = task.analytics.score;
    log('analytics', task, `Оценка ${task.analytics.score.toFixed(1)}/10. ${task.analytics.verdict}`, 'Аналитик');
    showStamp(task.analytics.score);
    buildings.analytics.done++;
    persist(task);

    // 5 · delivery to the boss house
    task.stage = 4;
    await travel('analytics', 'delivery', TEAMS.delivery.color);
    enter('delivery');
    log('delivery', task, 'Собираю отчёт для босса', 'Курьер');
    await wait(700);
    leave('delivery');
    buildings.delivery.done++;
    await travel('delivery', 'boss', TEAMS.delivery.color);
    boss.flash = 1;
    task.stage = 5;
    task.status = 'done';
    task.doneAt = new Date().toISOString();
    log('delivery', task, 'Отчёт лежит в Доме босса', 'Почтальон');
    persist(task);
    toast(task);
  } catch (e) {
    const code = e?.code;
    task.status = code === 'cancelled' ? 'stopped' : 'error';
    task.error = code === 'cancelled' ? 'Остановлено' : errorCopy(e);
    if (STOP_CODES.has(code)) setAgentsState('denied');
    if (!task.ctl.signal.aborted) task.ctl.abort(); // stop sibling teams still writing
    if (code !== 'cancelled' && !e?.code) console.error(e);
    persist(task);
  } finally {
    task.finished = true;
    for (const id of [...task.busy]) leave(id);
    task.live = {};
    renderFeedSoon(); updateMetrics(); refreshBoss();
    if (selected) renderPanel();
    if (reportTask === task) renderReportSoon();
  }
}

// ---------- persistence ----------
function toDoc(t) {
  const outputs = {};
  for (const [k, v] of Object.entries(t.outputs)) outputs[k] = clip(v, 50000);
  return {
    n: t.n, text: t.text, createdAt: t.createdAt, doneAt: t.doneAt, status: t.status, stage: t.stage,
    teams: t.teams, briefs: t.briefs, plan: t.plan, outputs, qa: t.qa, revised: t.revised,
    analytics: t.analytics, error: t.error,
  };
}
function persist(t) {
  if (!db) return;
  const body = JSON.parse(JSON.stringify(toDoc(t)));
  t.chain = (t.chain || Promise.resolve())
    .then(() => db.doc('runs/' + t.id).set(body))
    .catch((e) => {
      if (e?.code === 'quota_exceeded') flashNote('База результатов заполнена: удали старые задачи.');
      else if (e?.code === 'invalid_argument') flashNote('Результат не сохранился: у тебя нет прав на запись в этом артефакте.');
      else console.warn('save failed', e);
    });
}
function fromDoc(id, d) {
  const stale = d.status === 'running' && Date.now() - Date.parse(d.createdAt) > 20 * 60000;
  return {
    id, n: Number(d.n) || 0, text: String(d.text || ''), createdAt: String(d.createdAt || ''), doneAt: d.doneAt || null,
    status: stale ? 'stopped' : String(d.status || 'stopped'), stage: Number(d.stage) || 0,
    teams: (Array.isArray(d.teams) ? d.teams : []).filter((x) => PRODUCTION.includes(x)),
    briefs: d.briefs || {}, plan: String(d.plan || ''), outputs: d.outputs || {}, qa: d.qa || null,
    revised: Array.isArray(d.revised) ? d.revised : [], analytics: d.analytics ? normAn(d.analytics) : null,
    error: stale ? 'Прервано: страницу закрыли во время работы' : d.error || null,
    local: false, live: {},
  };
}
function listenRuns() {
  const timer = setTimeout(() => { if (!loadedRuns) flashNote('Не получается достучаться до базы результатов. Проверь сеть.'); }, 10000);
  db.collection('runs').orderBy('createdAt', 'desc').limit(60).onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { loadedRuns = true; clearTimeout(timer); }
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      const mine = tasks.find((t) => t.id === d.id);
      if (mine?.local) continue;
      const t = fromDoc(d.id, d.data());
      if (mine) Object.assign(mine, t); else tasks.push(t);
    }
    for (let i = tasks.length - 1; i >= 0; i--) if (!tasks[i].local && !seen.has(tasks[i].id)) tasks.splice(i, 1);
    tasks.sort((a, b) => (a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : 0));
    lastScore = tasks.find((t) => t.analytics)?.analytics.score ?? lastScore;
    renderFeedSoon(); updateMetrics(); refreshBoss();
    if (selected) renderPanel();
    if (reportTask) renderReportSoon();
  }, (e) => { clearTimeout(timer); loadedRuns = true; flashNote('База результатов недоступна (' + (e?.code || 'ошибка') + '). Новые задачи не сохранятся.'); renderFeedSoon(); });
}

  updateWalkers(dt);

  // day / night blend
  dayMix += ((night ? 0 : 1) - dayMix) * Math.min(1, dt * 2.5);

  }

  // boss house glow + mini screens
  boss.beam.material.opacity = (boss.flash > 0 ? 0.2 + boss.flash * 0.7 : 0.14) * (1 - dayMix * 0.5);
  boss.beam.scale.set(1 + boss.flash * 3, 1, 1 + boss.flash * 3);
  boss.flash = Math.max(0, boss.flash - dt * 0.9);
  if (selected && selected !== 'boss') {
    const b = buildings[selected];
    const busy = b.busy > 0;
    if (!reduceMotion) for (const mm of b.interior.miniMats) if (Math.random() < 0.08) mm.color.setScalar(busy ? 0.75 + Math.random() * 0.25 : 0.5 + Math.random() * 0.1);
  }

  // spinners
  for (const s of spinners) {
    if (s.scan) { s.obj.position.y = 1 + (Math.sin(t * 1.4) * 0.5 + 0.5) * 10; }
    else s.obj.rotation[s.axis] += dt * s.speed;
  }

  // arcs sparks
  for (const a of arcs) {
    a.t = (a.t + dt * a.speed) % 1;
    a.spark.position.copy(a.curve.getPoint(a.t));
    const want = a.active > 0 ? 1 : 0.4;
    a.tube.material.opacity += (want - a.tube.material.opacity) * Math.min(1, dt * 6);
  }

  // dust drift
  const pa = dustGeo.attributes.position;
  const drift = reduceMotion ? 0.1 : 0.6;
  for (let i = 0; i < dustCount; i++) { let y = pa.array[i * 3 + 1] + dt * drift; if (y > 40) y = 0; pa.array[i * 3 + 1] = y; }
  pa.needsUpdate = true;

  // billboard
  bbTimer += dt;
  if (bbTimer > 3.2) { bbTimer = 0; drawBillboard(++bbIdx); }


  // camera
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / fly.dur);
    const k = fly.t < 0.5 ? 4 * fly.t ** 3 : 1 - Math.pow(-2 * fly.t + 2, 3) / 2;
    camera.position.lerpVectors(fly.fromP, fly.toP, k);
    camera.position.y += Math.sin(Math.PI * k) * fly.bump;
    controls.target.lerpVectors(fly.fromT, fly.toT, k);
    if (fly.t >= 1) { fly = null; controls.enabled = true; }
  } else {
    keyFlight(dt);
  }
  controls.update();
  clampToCity();
  // flew away from the building you were inside: quietly leave it
  if (selected && !fly) {
    const bp = selected === 'boss' ? boss.group.position : buildings[selected].group.position;
    if (Math.hypot(controls.target.x - bp.x, controls.target.z - bp.z) > 25) unfocus(false);
  }

  if (fxOn) composer.render(); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
updateMetrics();
animate();
document.fonts?.ready.then(() => { drawBillboard(bbIdx); if (selected && selected !== 'boss') drawWall(selected); });

// start empty and honest: show stored runs, wait for a real task
setAgentsState('loading');
renderFeed();
initAgents();

window.__city = { runTask, focusBuilding, unfocus, buildings, tasks, boss, openReport };
window.__nav = { camera, controls, flying: () => !!fly };
</script>
</body>
</html>
