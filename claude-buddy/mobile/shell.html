<title>Claude Buddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
[hidden] { display: none !important; }
/* Один экран: небо в сумерках, островок с колобком, снизу — строка чата. Единый тёмный облик. */
:root {
  --sky-top: #1b2140;
  --sky-mid: #3a2f5c;
  --sky-low: #6b4a6e;
  --paper: #fffaf5;
  --ink: #2a1712;
  --line: rgba(58, 29, 20, 0.85);
  --coral: #d97757;
  --chip: rgba(255, 250, 245, 0.96);
  --muted: #a28b80;
  --font: 'Nunito', 'SF Pro Rounded', ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(120% 70% at 50% 100%, var(--sky-low) 0%, var(--sky-mid) 45%, var(--sky-top) 100%);
  color: var(--ink);
  font-family: var(--font);
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
#stars { position: fixed; inset: 0; pointer-events: none; opacity: 0.55; }
#scene {
  position: fixed; left: 0; right: 0; top: 0;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: 100%; height: calc(100% - 76px - env(safe-area-inset-bottom, 0px));
  display: block; touch-action: none;
}
.bubble {
  --tail: 50%;
  position: fixed; left: 0; bottom: 0;
  max-width: min(340px, calc(100vw - 24px)); min-width: 54px;
  padding: 11px 15px 12px;
  background: var(--paper); color: var(--ink);
  border: 2.5px solid var(--line); border-radius: 20px;
  font-size: 16px; line-height: 1.38; font-weight: 600;
  box-shadow: 0 6px 0 rgba(58, 29, 20, 0.18), 0 10px 30px rgba(0, 0, 0, 0.25);
  opacity: 0; transform: translateY(8px) scale(0.92); transform-origin: var(--tail) 100%;
  transition: opacity .18s ease, transform .22s cubic-bezier(.3,1.6,.5,1), border-color .3s;
  pointer-events: none; white-space: pre-wrap; overflow-wrap: anywhere;
}
#bubbleText.clip { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.6em); mask-image: linear-gradient(to bottom, transparent 0, #000 1.6em); }
.menuBtn, .menu { z-index: 2; }
.bubble.on { opacity: 1; transform: none; pointer-events: auto; }
.bubble.hidden { visibility: hidden; }
.bubble::after {
  content: ''; position: absolute; left: calc(var(--tail) - 9px); bottom: -11px; width: 16px; height: 16px;
  background: var(--paper); border-right: 2.5px solid var(--line); border-bottom: 2.5px solid var(--line);
  border-right-color: inherit; border-bottom-color: inherit;
  transform: rotate(45deg) skew(8deg, 8deg); border-bottom-right-radius: 4px;
}
#bubbleText { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.bubble.micro { font-size: 14px; font-weight: 800; font-style: italic; color: #7a2f17; padding: 6px 11px 7px; border-radius: 14px; }
.bubble .dots { display: none; gap: 5px; padding: 3px 2px; }
.bubble.thinking #bubbleText { display: none; }
.bubble.thinking .dots { display: inline-flex; }
.dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); animation: dot 1s infinite ease-in-out; }
.dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-5px); opacity: 1; } }
.bubble[data-emo='angry'] { border-color: #d4462a; } .bubble[data-emo='love'] { border-color: #e0567a; }
.bubble[data-emo='sad'] { border-color: #5b7fb0; } .bubble[data-emo='laugh'], .bubble[data-emo='happy'] { border-color: #e0892a; }
.bubble[data-emo='scared'], .bubble[data-emo='surprised'] { border-color: #8a5cc2; }
.status {
  position: fixed; transform: translate(-50%, 0); padding: 3px 10px; border-radius: 999px;
  background: rgba(42, 23, 18, .82); color: #ffe9dc; font-size: 12px; font-weight: 700;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
.status.on { opacity: 1; }
.chat {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: center;
}
.chat .field {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
  background: var(--chip); border: 2.5px solid var(--line); border-radius: 22px; padding: 4px 4px 4px 14px;
  box-shadow: 0 5px 0 rgba(58, 29, 20, .2);
}
.chat input[type=text] {
  flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); -webkit-user-select: text; user-select: text;
}
.chat input::placeholder { color: var(--muted); }
.icon {
  flex: none; width: 44px; height: 44px; border-radius: 16px; border: 0; display: grid; place-items: center;
  background: #f6e4d8; color: var(--ink); cursor: pointer;
}
.icon:active { transform: scale(.92); }
.icon:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.chat input:focus, .chat input:focus-visible { outline: none; }
.chat .field:focus-within { border-color: var(--coral); }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.send { background: var(--coral); color: #fff; }
.round { border-radius: 50%; background: var(--chip); border: 2.5px solid var(--line); box-shadow: 0 5px 0 rgba(58,29,20,.2); }
#photoPreview { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; }
.menuBtn {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,250,245,.14); color: #ffe9dc;
  display: grid; place-items: center; cursor: pointer;
}
.menuBtn svg { width: 22px; height: 22px; fill: currentColor; }
.menu {
  position: fixed; top: calc(58px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw - 24px)); max-height: 70vh; overflow: auto;
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 16px; padding: 8px;
  box-shadow: 0 6px 0 rgba(58,29,20,.2), 0 14px 34px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px;
}
.menu button.item { text-align: left; border: 0; background: none; padding: 11px 12px; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; }
.menu button.item:active { background: #f6e4d8; }
.menu h3 { margin: 10px 12px 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); }
.menu ul { list-style: none; margin: 0; padding: 0 4px 4px; display: flex; flex-direction: column; gap: 6px; }
.menu li { display: flex; gap: 8px; align-items: center; background: #f6ede6; border-radius: 10px; padding: 7px 9px; font-size: 13px; }
.menu li.empty { color: var(--muted); }
.menu li span { flex: 1; min-width: 0; }
.menu li em { color: var(--coral); font-style: normal; font-size: 11px; font-weight: 800; }
.menu li button { border: 1px solid #e2cfc3; background: none; border-radius: 8px; font: inherit; font-size: 12px; padding: 4px 8px; color: #7a6156; }
.menu .hint { margin: 6px 12px 8px; font-size: 12px; color: #7a6156; line-height: 1.4; }
#fx { position: fixed; inset: 0; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%,-50%); font-weight: 900; font-size: 44px; color: #ffd84d; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: pop 1.3s cubic-bezier(.2,1.6,.4,1) forwards; }
.pop.small { font-size: 24px; color: #fff; -webkit-text-stroke: 2px var(--ink); }
@keyframes pop { 0% { transform: translate(-50%,-50%) scale(.2) rotate(-12deg); opacity: 0; } 20% { transform: translate(-50%,-60%) scale(1.15) rotate(-6deg); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%,-110%) scale(1) rotate(-4deg); opacity: 0; } }
.sticker { position: absolute; font-size: 30px; transform: translate(-50%,-50%); animation: sticker 1.8s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes sticker { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 15% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 30% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%,-80%) scale(.9); opacity: 0; } }
.note, .zzz { position: absolute; font-weight: 900; color: #ffd84d; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.note { font-size: 26px; animation: note 2.2s ease-out forwards; }
.zzz { font-size: 22px; color: #fff; animation: zzz 2.6s ease-out forwards; }
@keyframes note { 0% { transform: scale(.4) rotate(-10deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-20px,-110px) scale(1.2) rotate(12deg); opacity: 0; } }
@keyframes zzz { 0% { transform: scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(34px,-80px) scale(1.3) rotate(15deg); opacity: 0; } }
.toast {
  position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%,-20px);
  max-width: calc(100vw - 110px); padding: 8px 12px; border-radius: 12px; background: rgba(42,23,18,.9); color: #fff3ea;
  font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .pop, .sticker, .note, .zzz, .dots b { animation-duration: .01s; } }
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="scene" aria-label="Claude Buddy: тапни, чтобы потыкать"></canvas>
<div id="bubble" class="bubble" aria-live="polite"><span id="bubbleText"></span><i class="dots"><b></b><b></b><b></b></i></div>
<div id="status" class="status"></div>
<div id="fx"></div>
<div id="toast" class="toast" role="status"></div>

<button id="menuBtn" class="menuBtn" type="button" aria-label="Меню"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>
<div id="menu" class="menu" hidden>
  <button id="muteBtn" class="item" type="button">Без голоса</button>
  <button id="smartBtn" class="item" type="button">Режим: быстрый</button>
  <h3>Что я помню</h3>
  <ul id="memList"></ul>
  <button id="forgetBtn" class="item" type="button">Стереть память и разговор</button>
  <p class="hint">Говорить можно голосом: кнопка микрофона на клавиатуре iPhone. Тапни меня, потряси пальцем у носа, свайпни островок.</p>
</div>

<form id="chat" class="chat" autocomplete="off">
  <div class="field">
    <img id="photoPreview" alt="Фото для Клода" hidden>
    <input id="chatInput" type="text" enterkeyhint="send" placeholder="Скажи что-нибудь 🎙">
    <button id="sendBtn" class="icon send" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </div>
  <button id="photoBtn" class="icon round" type="button" aria-label="Сфоткать и спросить" hidden><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
</form>

<script>
// звёзды на небе — один раз, без анимации
(function () {
  const c = document.getElementById('stars');
  const d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * d; c.height = innerHeight * d;
  const g = c.getContext('2d');
  let s = 7;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 90; i += 1) {
    g.fillStyle = `rgba(255,240,230,${0.25 + rnd() * 0.6})`;
    g.beginPath(); g.arc(rnd() * c.width, rnd() * c.height * 0.7, (0.5 + rnd() * 1.3) * d, 0, 6.3); g.fill();
  }
})();
</script>
